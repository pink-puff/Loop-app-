<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loop</title>
<style>
  /* ============================================================
     Theme variables
     ============================================================ */
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --card-soft: #faf8f4;
    --text: #2e2c28;
    --muted: #7a7468;
    --border: #e2ddd5;
    --border-soft: #efeae0;
    --soft: #ece6dc;
    --soft-hover: #ddd5c8;
    --accent: #b8a890;
    --accent-hover: #a08f76;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 6px 22px rgba(0,0,0,0.10);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.22);

    --pill-overdue: #d44a4a;
    --pill-soon: #e08a2a;
    --pill-done: #4d9a4d;
    --pill-neutral-bg: #ece6dc;
    --pill-neutral-fg: #5a554d;

    --tone-overdue-card: #fdecec;
    --tone-overdue-border: #f1c5c5;
    --tone-soon-card: #fdf2e2;
    --tone-soon-border: #efd6ae;
    --tone-done-card: #eef6ec;
    --tone-done-border: #cee0c9;

    --tone-overdue-task: #fbdada;
    --tone-soon-task: #faebd0;
    --tone-done-task: #e6f1e3;

    --selected: #b8a890;
    --selected-fg: #fff;
    --today-ring: #b8a890;
  }

  [data-theme="dark"] {
    --bg: #1c1a18;
    --card: #2a2724;
    --card-soft: #322f2c;
    --text: #ece6dc;
    --muted: #a8a298;
    --border: #3d3833;
    --border-soft: #34302c;
    --soft: #3a3631;
    --soft-hover: #4a453f;
    --accent: #b8a890;
    --accent-hover: #cdbda3;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 6px 22px rgba(0,0,0,0.5);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);

    --pill-overdue: #b94040;
    --pill-soon: #b97525;
    --pill-done: #4a8a4a;
    --pill-neutral-bg: #3d3833;
    --pill-neutral-fg: #d8d2c6;

    --tone-overdue-card: #3a2424;
    --tone-overdue-border: #4d2c2c;
    --tone-soon-card: #3a2e1c;
    --tone-soon-border: #4d3a22;
    --tone-done-card: #233022;
    --tone-done-border: #2c3d2b;

    --tone-overdue-task: #4a2c2c;
    --tone-soon-task: #4a3a22;
    --tone-done-task: #2c3d2b;

    --selected: #b8a890;
    --selected-fg: #1c1a18;
    --today-ring: #cdbda3;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    padding: 22px 22px 110px 22px;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  select, button, input, textarea {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
  }

  /* ============================================================
     Top bar
     ============================================================ */
  .topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .topbar .left { display: flex; align-items: center; }
  .topbar .center { display: flex; justify-content: center; }
  .topbar .right { display: flex; justify-content: flex-end; }

  .app-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .list-selector { position: relative; }
  .list-current {
    width: 280px;
    text-align: center;
    padding: 9px 14px;
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .list-current:hover { background: var(--soft); }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--muted);
    cursor: pointer;
    padding: 7px 11px;
    font-size: 15px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .btn-icon:hover { background: var(--soft); }

  /* ============================================================
     Menus / popovers (list dropdown, list ctx, subject ctx)
     ============================================================ */
  .menu, .ctx-menu {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: flex;
    flex-direction: column;
    min-width: 200px;
  }
  .menu.hidden, .ctx-menu.hidden { display: none; }
  .menu button, .ctx-menu button {
    background: none;
    border: none;
    text-align: left;
    padding: 8px 10px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
  }
  .menu button:hover, .ctx-menu button:hover { background: var(--soft); }
  .menu button:disabled { color: var(--muted); cursor: not-allowed; }
  .menu button.danger, .ctx-menu button.danger { color: #c75050; }
  .menu button.active { background: var(--soft); }

  /* List dropdown (under list selector) */
  #listDropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 110;
    min-width: 280px;
  }
  /* Right-click menu near the cursor */
  .ctx-menu {
    position: fixed;
    z-index: 200;
    box-shadow: var(--shadow-md);
  }

  /* ============================================================
     Subject card
     ============================================================ */
  .subject {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .subject.has-overdue { background: var(--tone-overdue-card); border-color: var(--tone-overdue-border); }
  .subject.has-soon    { background: var(--tone-soon-card);    border-color: var(--tone-soon-border); }
  .subject.all-done    { background: var(--tone-done-card);    border-color: var(--tone-done-border); }

  .subject-header {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .arrow {
    display: inline-block;
    width: 14px;
    text-align: center;
    transition: transform 0.15s;
    color: var(--muted);
  }
  .arrow.open { transform: rotate(90deg); }
  .subject-name { flex: 1; font-weight: 600; }
  .subject-body { padding: 0 14px 12px 30px; }

  /* ============================================================
     Tasks
     ============================================================ */
  .task {
    background: var(--card-soft);
    border-radius: 10px;
    padding: 8px 10px;
    margin-top: 8px;
  }
  .task.tone-overdue { background: var(--tone-overdue-task); }
  .task.tone-soon    { background: var(--tone-soon-task); }
  .task.tone-done    { background: var(--tone-done-task); }

  .task-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .task-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .task-title { flex: 1; font-size: 14px; }
  .task.tone-done .task-title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task-arrow {
    cursor: pointer;
    color: var(--muted);
    user-select: none;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .task-arrow:hover { background: var(--soft); }

  /* ============================================================
     Pills
     ============================================================ */
  .pill {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 500;
  }
  .pill-neutral { background: var(--pill-neutral-bg); color: var(--pill-neutral-fg); }
  .pill-overdue { background: var(--pill-overdue); color: #fff; }
  .pill-soon    { background: var(--pill-soon);    color: #fff; }
  .pill-done    { background: var(--pill-done);    color: #fff; }

  /* ============================================================
     Task expanded panel
     ============================================================ */
  .task-details {
    margin-top: 10px;
    padding: 14px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .task-details .full { grid-column: 1 / -1; }
  .task-details label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  .task-details input,
  .task-details select,
  .task-details textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  .task-details textarea { resize: vertical; min-height: 60px; }
  .task-details .actions-row {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 4px;
  }
  .task-details .actions-right { display: flex; gap: 8px; }

  /* Buttons */
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn-soft {
    background: var(--soft);
    color: var(--text);
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-soft:hover { background: var(--soft-hover); }
  .btn-danger {
    background: var(--pill-overdue);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-danger:hover { filter: brightness(0.95); }

  /* ============================================================
     Floating action button
     ============================================================ */
  .fab {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 28px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .fab:hover { background: var(--accent-hover); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
  }

  /* ============================================================
     Modal
     ============================================================ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 16, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }
  .overlay.hidden { display: none; }
  .modal {
    position: relative;
    background: var(--card);
    border-radius: 14px;
    padding: 20px 22px;
    min-width: 360px;
    max-width: 90vw;
    box-shadow: var(--shadow-lg);
    color: var(--text);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: var(--soft); }
  .modal-body { margin-bottom: 16px; }
  .modal-body input[type="text"],
  .modal-body input[type="date"],
  .modal-body select,
  .modal-body textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  .modal-message {
    font-size: 14px;
    color: var(--text);
    line-height: 1.45;
  }
  .form-row { margin-bottom: 12px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-row label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Settings rows + toggle switch */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .label-block { display: flex; flex-direction: column; }
  .settings-row .label-block .small {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: var(--soft);
    border-radius: 22px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .toggle .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: 0.18s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  .toggle input:checked + .slider { background: var(--accent); }
  .toggle input:checked + .slider::before { transform: translateX(18px); }

  /* ============================================================
     Custom calendar popup
     ============================================================ */
  .cal-popup {
    position: fixed;
    z-index: 600;
    width: 280px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 10px;
    color: var(--text);
  }
  .cal-popup.hidden { display: none; }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .cal-title { font-weight: 600; font-size: 14px; }
  .cal-nav {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .cal-nav:hover { background: var(--soft); }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .cal-weekdays div {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 0;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-day {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text);
    padding: 6px 0;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
  .cal-day:hover { background: var(--soft); }
  .cal-day.faded { color: var(--muted); opacity: 0.5; }
  .cal-day.today { border-color: var(--today-ring); }
  .cal-day.selected {
    background: var(--selected);
    color: var(--selected-fg);
    border-color: var(--selected);
  }
  .cal-day.selected:hover { background: var(--accent-hover); }
  .cal-clear {
    margin-top: 8px;
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .cal-clear:hover { background: var(--soft); color: var(--text); }
</style>
</head>
<body>

<div class="topbar">
  <div class="left">
    <div class="app-title">Loop</div>
  </div>
  <div class="center">
    <div class="list-selector">
      <div id="listCurrent" class="list-current"></div>
      <div id="listDropdown" class="menu hidden"></div>
    </div>
  </div>
  <div class="right">
    <button id="settingsBtn" class="btn-icon" title="Settings">⚙</button>
  </div>
</div>

<div id="subjects"></div>

<button id="fab" class="fab" title="New subject">+</button>

<!-- Subject right-click menu -->
<div id="ctxMenu" class="ctx-menu hidden">
  <button data-act="add-task">Add Task</button>
  <button data-act="rename">Edit Subject</button>
  <button data-act="delete" class="danger">Delete Subject</button>
</div>

<!-- List right-click menu -->
<div id="listCtxMenu" class="ctx-menu hidden">
  <button data-act="new">New List</button>
  <button data-act="rename">Rename List</button>
  <button data-act="delete" class="danger">Delete List</button>
</div>

<!-- Reusable input/confirm/settings modal -->
<div id="modalOverlay" class="overlay hidden">
  <div class="modal" id="modalBox">
    <button id="modalClose" class="modal-close" title="Close">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Custom calendar -->
<div id="calPopup" class="cal-popup hidden">
  <div class="cal-header">
    <button class="cal-nav" data-act="prev" type="button">‹</button>
    <div class="cal-title" id="calTitle"></div>
    <button class="cal-nav" data-act="next" type="button">›</button>
  </div>
  <div class="cal-weekdays">
    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <button class="cal-clear" id="calClear" type="button">Clear date</button>
</div>

<script>
// ============================================================
// Storage
// ============================================================
const STORAGE_KEY = 'loopAppData';
let data = load();
ensureSeed();
applyTheme();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error('load failed', e); }
  return { lists: [], currentListId: null, settings: null };
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.error('save failed', e); }
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function ensureSeed() {
  if (!data.lists) data.lists = [];
  if (data.lists.length === 0) {
    const id = uid();
    data.lists.push({ id, name: 'My List', subjects: [] });
    data.currentListId = id;
  }
  if (!data.currentListId || !data.lists.find(l => l.id === data.currentListId)) {
    data.currentListId = data.lists[0].id;
  }
  if (!data.settings) {
    data.settings = { darkMode: false, notifications: false, menuBarMode: false };
  }
  // Migrate subjects + tasks
  data.lists.forEach(l => {
    (l.subjects || []).forEach(s => {
      if (s.resetSchedule === undefined) s.resetSchedule = 'None';
      if (s.resetDay === undefined) s.resetDay = 'None';
      if (s.lastResetDate === undefined) s.lastResetDate = '';
      (s.tasks || []).forEach(t => {
        if (t.manualDue === undefined) t.manualDue = t.due || '';
        if (t.repeatSchedule === undefined) {
          if (t.repeat && t.repeat !== 'None' && t.autoDueDay && t.autoDueDay !== 'None') {
            const p = t.repeat === 'Weekly' ? 'weekly' : 'fortnightly';
            t.repeatSchedule = p + ':' + t.autoDueDay;
          } else {
            t.repeatSchedule = 'none';
          }
        }
        if (t.lastCompletedDate === undefined) t.lastCompletedDate = '';
        if (t.notes === undefined) t.notes = '';
      });
    });
  });
  save();
}
function getList() {
  return data.lists.find(l => l.id === data.currentListId);
}

// ============================================================
// Theme
// ============================================================
function applyTheme() {
  if (data.settings && data.settings.darkMode) {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}

// ============================================================
// Date helpers (local time)
// ============================================================
const DAY_MS = 24 * 60 * 60 * 1000;
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function startOfDay(d) {
  const r = new Date(d); r.setHours(0,0,0,0); return r;
}
function todayLocal() { return startOfDay(new Date()); }
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function fromISO(s) {
  if (!s) return null;
  const p = s.split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function isValidISO(s) {
  if (!s) return true; // empty allowed
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = fromISO(s);
  if (!d) return false;
  return toISO(d) === s; // round-trip check
}
function nextWeekday(idx, from, minDays = 0) {
  const start = startOfDay(from);
  let diff = idx - start.getDay();
  while (diff < minDays) diff += 7;
  const r = new Date(start); r.setDate(start.getDate()+diff); return r;
}
function mostRecentPastWeekday(idx, from) {
  const start = startOfDay(from);
  let diff = start.getDay() - idx;
  if (diff < 0) diff += 7;
  const r = new Date(start); r.setDate(start.getDate()-diff); return r;
}
function formatDue(iso) {
  const d = fromISO(iso); if (!d) return '';
  const today = todayLocal();
  const diff = Math.round((startOfDay(d) - today) / DAY_MS);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

// ============================================================
// Repeat Schedule helpers
// ============================================================
const REPEAT_OPTIONS = [
  { value: 'none',                label: "Doesn't repeat" },
  { value: 'weekly:Monday',       label: 'Every week on Monday' },
  { value: 'weekly:Tuesday',      label: 'Every week on Tuesday' },
  { value: 'weekly:Wednesday',    label: 'Every week on Wednesday' },
  { value: 'weekly:Thursday',     label: 'Every week on Thursday' },
  { value: 'weekly:Friday',       label: 'Every week on Friday' },
  { value: 'weekly:Saturday',     label: 'Every week on Saturday' },
  { value: 'weekly:Sunday',       label: 'Every week on Sunday' },
  { value: 'fortnightly:Monday',  label: 'Every 2 weeks on Monday' },
  { value: 'fortnightly:Tuesday', label: 'Every 2 weeks on Tuesday' },
  { value: 'fortnightly:Wednesday',label:'Every 2 weeks on Wednesday' },
  { value: 'fortnightly:Thursday',label: 'Every 2 weeks on Thursday' },
  { value: 'fortnightly:Friday',  label: 'Every 2 weeks on Friday' },
  { value: 'fortnightly:Saturday',label: 'Every 2 weeks on Saturday' },
  { value: 'fortnightly:Sunday',  label: 'Every 2 weeks on Sunday' }
];

function computeAutoDue(task) {
  const r = task.repeatSchedule;
  if (!r || r === 'none') return '';
  const [kind, day] = r.split(':');
  const idx = DAY_NAMES.indexOf(day);
  if (idx < 0) return '';
  const today = todayLocal();
  if (kind === 'weekly') return toISO(nextWeekday(idx, today, 0));
  if (kind === 'fortnightly') {
    if (task.lastCompletedDate) {
      const base = fromISO(task.lastCompletedDate);
      if (base) {
        base.setDate(base.getDate()+14);
        return toISO(nextWeekday(idx, base, 0));
      }
    }
    return toISO(nextWeekday(idx, today, 0));
  }
  return '';
}
function taskEffectiveDue(task) {
  if (task.manualDue) return task.manualDue;
  return computeAutoDue(task);
}

// ============================================================
// Status
// ============================================================
function statusFor(task) {
  if (task.done) return 'done';
  const due = taskEffectiveDue(task);
  if (!due) return 'normal';
  const d = fromISO(due); if (!d) return 'normal';
  const today = todayLocal();
  const diff = Math.round((startOfDay(d) - today) / DAY_MS);
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'soon';
  return 'normal';
}
function subjectStatus(sub) {
  if (!sub.tasks || sub.tasks.length === 0) return { kind: 'normal' };
  let overdue = 0, soon = 0, done = 0;
  sub.tasks.forEach(t => {
    const s = statusFor(t);
    if (s === 'overdue') overdue++;
    else if (s === 'soon') soon++;
    if (t.done) done++;
  });
  if (overdue > 0) return { kind: 'overdue', count: overdue };
  if (soon > 0)    return { kind: 'soon',    count: soon };
  if (done === sub.tasks.length) return { kind: 'done' };
  return { kind: 'normal' };
}

// ============================================================
// Resets
// ============================================================
function checkTaskResets(list) {
  const today = todayLocal();
  list.subjects.forEach(sub => {
    sub.tasks.forEach(t => {
      if (!t.done) return;
      if (!t.repeatSchedule || t.repeatSchedule === 'none') return;
      if (!t.lastCompletedDate) return;
      const last = fromISO(t.lastCompletedDate); if (!last) return;
      const cycleDays = t.repeatSchedule.startsWith('weekly') ? 7 : 14;
      if ((today - startOfDay(last)) / DAY_MS >= cycleDays) {
        t.done = false; t.lastCompletedDate = '';
      }
    });
  });
}
function checkSubjectResets(list) {
  const today = todayLocal();
  list.subjects.forEach(sub => {
    if (!sub.resetSchedule || sub.resetSchedule === 'None') return;
    if (!sub.resetDay || sub.resetDay === 'None') return;
    const idx = DAY_NAMES.indexOf(sub.resetDay);
    if (idx < 0) return;
    if (!sub.lastResetDate) {
      sub.lastResetDate = toISO(mostRecentPastWeekday(idx, today));
      return;
    }
    const last = fromISO(sub.lastResetDate);
    if (!last) { sub.lastResetDate = toISO(mostRecentPastWeekday(idx, today)); return; }
    const cycleDays = sub.resetSchedule === 'Weekly' ? 7 : 14;
    let next = new Date(startOfDay(last));
    next.setDate(next.getDate()+cycleDays);
    if (today >= next) {
      while (true) {
        const further = new Date(next);
        further.setDate(further.getDate()+cycleDays);
        if (today >= further) next = further; else break;
      }
      sub.tasks.forEach(t => { t.done = false; t.lastCompletedDate = ''; });
      sub.lastResetDate = toISO(next);
    }
  });
}

// ============================================================
// Custom calendar popup
// ============================================================
const calPopup = document.getElementById('calPopup');
const calTitle = document.getElementById('calTitle');
const calGrid = document.getElementById('calGrid');
const calClear = document.getElementById('calClear');
let calMonth = null; // { year, month0 }
let calSelectedISO = '';
let calOnSelect = null;
let activeCalInput = null;

function openCalendar(input, onSelect) {
  // close other open menus
  document.getElementById('listDropdown').classList.add('hidden');
  document.getElementById('listCtxMenu').classList.add('hidden');
  document.getElementById('ctxMenu').classList.add('hidden');

  activeCalInput = input;
  const initialISO = input.value && isValidISO(input.value) ? input.value : '';
  const base = initialISO ? fromISO(initialISO) : new Date();
  calMonth = { year: base.getFullYear(), month: base.getMonth() };
  calSelectedISO = initialISO;
  calOnSelect = (iso) => {
    if (onSelect) onSelect(iso);
    closeCalendar();
  };

  // Position
  const rect = input.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 4;
  // Clamp horizontally
  const width = 280;
  if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
  if (left < 8) left = 8;
  // Vertical fallback above
  if (top + 320 > window.innerHeight) top = rect.top - 326;
  calPopup.style.left = left + 'px';
  calPopup.style.top = top + 'px';

  renderCalendar();
  calPopup.classList.remove('hidden');
}
function closeCalendar() {
  calPopup.classList.add('hidden');
  calOnSelect = null;
  activeCalInput = null;
}
function isCalOpen() { return !calPopup.classList.contains('hidden'); }

function renderCalendar() {
  const { year, month } = calMonth;
  calTitle.textContent = MONTH_NAMES[month] + ' ' + year;

  calGrid.innerHTML = '';
  // First-day-of-month, weeks start Monday
  const first = new Date(year, month, 1);
  const dow = first.getDay(); // 0=Sun
  const startOffset = (dow === 0) ? 6 : dow - 1;
  const start = new Date(year, month, 1 - startOffset);
  const todayISO = toISO(new Date());

  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cal-day';
    cell.textContent = String(d.getDate());
    const iso = toISO(d);
    cell.dataset.iso = iso;
    if (d.getMonth() !== month) cell.classList.add('faded');
    if (iso === todayISO) cell.classList.add('today');
    if (iso === calSelectedISO) cell.classList.add('selected');
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      if (calOnSelect) calOnSelect(iso);
    });
    calGrid.appendChild(cell);
  }
}

calPopup.addEventListener('mousedown', (e) => {
  // Keep focus on the date input so blur doesn't fire while picking
  if (e.target !== activeCalInput) e.preventDefault();
});
calPopup.querySelector('[data-act="prev"]').addEventListener('click', (e) => {
  e.stopPropagation();
  calMonth.month--;
  if (calMonth.month < 0) { calMonth.month = 11; calMonth.year--; }
  renderCalendar();
});
calPopup.querySelector('[data-act="next"]').addEventListener('click', (e) => {
  e.stopPropagation();
  calMonth.month++;
  if (calMonth.month > 11) { calMonth.month = 0; calMonth.year++; }
  renderCalendar();
});
calClear.addEventListener('click', (e) => {
  e.stopPropagation();
  if (calOnSelect) calOnSelect('');
});

// ============================================================
// Date input helper
// ============================================================
function makeDateInput(initialISO, onCommit) {
  // onCommit(iso) is called on blur, Enter, or calendar pick.
  const wrap = document.createElement('div');
  wrap.style.position = 'relative';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'YYYY-MM-DD';
  input.value = initialISO || '';
  input.autocomplete = 'off';
  wrap.appendChild(input);

  const open = () => {
    if (isCalOpen() && activeCalInput === input) return;
    openCalendar(input, (iso) => {
      input.value = iso;
      onCommit(iso);
    });
  };

  input.addEventListener('focus', open);
  input.addEventListener('click', (e) => { e.stopPropagation(); open(); });
  input.addEventListener('blur', () => {
    const v = input.value.trim();
    if (v === '' || isValidISO(v)) onCommit(v);
    else input.value = initialISO || '';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = input.value.trim();
      if (v === '' || isValidISO(v)) {
        onCommit(v);
        if (isCalOpen()) closeCalendar();
        input.blur();
      }
    }
  });
  return { wrap, input };
}

// ============================================================
// Render
// ============================================================
const subjectsEl = document.getElementById('subjects');
const listCurrentEl = document.getElementById('listCurrent');
const listDropdownEl = document.getElementById('listDropdown');

function render() {
  // List selector text
  const list = getList();
  listCurrentEl.textContent = list ? list.name : '—';

  // Subjects
  subjectsEl.innerHTML = '';
  if (!list) return;
  checkSubjectResets(list);
  checkTaskResets(list);

  if (list.subjects.length === 0) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No subjects yet. Tap + to add one.';
    subjectsEl.appendChild(e);
    return;
  }

  const sorted = [...list.subjects].sort((a, b) => {
    const aDone = a.tasks.length > 0 && a.tasks.every(t => t.done);
    const bDone = b.tasks.length > 0 && b.tasks.every(t => t.done);
    if (aDone === bDone) return 0;
    return aDone ? 1 : -1;
  });
  sorted.forEach(sub => subjectsEl.appendChild(renderSubject(sub)));
}

function renderSubject(sub) {
  const wrap = document.createElement('div');
  wrap.className = 'subject';
  wrap.dataset.subjectId = sub.id;

  const stat = subjectStatus(sub);
  if (stat.kind === 'overdue') wrap.classList.add('has-overdue');
  else if (stat.kind === 'soon') wrap.classList.add('has-soon');
  else if (stat.kind === 'done') wrap.classList.add('all-done');

  const header = document.createElement('div');
  header.className = 'subject-header';

  const arrow = document.createElement('span');
  arrow.className = 'arrow' + (sub.open ? ' open' : '');
  arrow.textContent = '▶';
  header.appendChild(arrow);

  const name = document.createElement('div');
  name.className = 'subject-name';
  name.textContent = sub.name || 'Untitled subject';
  header.appendChild(name);

  if (stat.kind === 'overdue') {
    const pill = document.createElement('span');
    pill.className = 'pill pill-overdue';
    pill.textContent = stat.count + (stat.count === 1 ? ' task overdue !' : ' tasks overdue !');
    header.appendChild(pill);
  } else if (stat.kind === 'soon') {
    const pill = document.createElement('span');
    pill.className = 'pill pill-soon';
    pill.textContent = stat.count + (stat.count === 1 ? ' task due soon' : ' tasks due soon');
    header.appendChild(pill);
  } else if (stat.kind === 'done') {
    const pill = document.createElement('span');
    pill.className = 'pill pill-done';
    pill.textContent = 'Completed';
    header.appendChild(pill);
  }

  attachHeaderHandlers(sub, header);
  wrap.appendChild(header);

  if (sub.open) {
    const body = document.createElement('div');
    body.className = 'subject-body';
    const sortedTasks = [...sub.tasks].sort((a, b) => {
      if (a.done === b.done) return 0;
      return a.done ? 1 : -1;
    });
    if (sortedTasks.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty'; e.style.padding = '14px';
      e.textContent = 'No tasks. Right-click the subject to add one.';
      body.appendChild(e);
    } else {
      sortedTasks.forEach(t => body.appendChild(renderTask(sub, t)));
    }
    wrap.appendChild(body);
  }
  return wrap;
}

function attachHeaderHandlers(sub, header) {
  let timer = null;
  header.addEventListener('click', (e) => {
    // ignore right-click
    if (e.button === 2) return;
    if (timer) {
      clearTimeout(timer); timer = null;
      return;
    }
    timer = setTimeout(() => {
      timer = null;
      sub.open = !sub.open;
      save(); render();
    }, 230);
  });
  header.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (timer) { clearTimeout(timer); timer = null; }
    commitOpenTaskPanel(); // ensure no panel open
    openSubjectSettingsModal(sub);
  });
  header.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (timer) { clearTimeout(timer); timer = null; }
    showSubjectCtxMenu(e.clientX, e.clientY, sub);
  });
}

function renderTask(sub, task) {
  const stat = statusFor(task);
  const due = taskEffectiveDue(task);

  const el = document.createElement('div');
  el.className = 'task';
  el.dataset.taskId = task.id;
  if (stat === 'overdue') el.classList.add('tone-overdue');
  else if (stat === 'soon') el.classList.add('tone-soon');
  else if (stat === 'done') el.classList.add('tone-done');

  const row = document.createElement('div');
  row.className = 'task-row';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !!task.done;
  cb.addEventListener('click', e => e.stopPropagation());
  cb.addEventListener('change', () => {
    task.done = cb.checked;
    if (task.done && task.repeatSchedule && task.repeatSchedule !== 'none') {
      task.lastCompletedDate = toISO(new Date());
    } else if (!task.done) {
      task.lastCompletedDate = '';
    }
    save(); render();
  });
  row.appendChild(cb);

  const title = document.createElement('div');
  title.className = 'task-title';
  title.textContent = task.title || 'Untitled task';
  row.appendChild(title);

  if (stat === 'overdue') {
    const pill = document.createElement('span');
    pill.className = 'pill pill-overdue'; pill.textContent = 'Overdue !'; row.appendChild(pill);
  } else if (stat === 'soon') {
    const pill = document.createElement('span');
    pill.className = 'pill pill-soon'; pill.textContent = 'Due soon'; row.appendChild(pill);
  } else if (stat === 'done') {
    const pill = document.createElement('span');
    pill.className = 'pill pill-done'; pill.textContent = 'Completed'; row.appendChild(pill);
  } else if (due) {
    const pill = document.createElement('span');
    pill.className = 'pill pill-neutral'; pill.textContent = formatDue(due); row.appendChild(pill);
  }

  const arrow = document.createElement('span');
  arrow.className = 'task-arrow';
  arrow.textContent = task.expanded ? '▲' : '▼';
  arrow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (task.expanded) {
      commitOpenTaskPanel();
    } else {
      openTaskPanel(task, sub);
    }
  });
  row.appendChild(arrow);

  el.appendChild(row);

  if (task.expanded) {
    el.appendChild(renderTaskPanel(sub, task));
  }
  return el;
}

function renderTaskPanel(sub, task) {
  const det = document.createElement('div');
  det.className = 'task-details';
  // Stop clicks inside from closing the panel
  det.addEventListener('click', (e) => e.stopPropagation());

  // Title
  const titleWrap = document.createElement('div'); titleWrap.className = 'full';
  titleWrap.innerHTML = `<label>Task name</label>`;
  const titleI = document.createElement('input');
  titleI.type = 'text'; titleI.placeholder = 'Task name';
  titleI.dataset.f = 'title'; titleI.value = task.title || '';
  titleWrap.appendChild(titleI);
  det.appendChild(titleWrap);

  // Notes
  const notesWrap = document.createElement('div'); notesWrap.className = 'full';
  notesWrap.innerHTML = `<label>Notes</label>`;
  const notesI = document.createElement('textarea');
  notesI.placeholder = 'Notes'; notesI.dataset.f = 'notes';
  notesI.value = task.notes || '';
  notesWrap.appendChild(notesI);
  det.appendChild(notesWrap);

  // Manual due date
  const dueWrap = document.createElement('div');
  dueWrap.innerHTML = `<label>Manual Due Date</label>`;
  const { wrap: dueFieldWrap, input: dueI } = makeDateInput(task.manualDue || '', (iso) => {
    task.manualDue = iso || '';
    save();
  });
  dueI.dataset.f = 'manualDue';
  dueWrap.appendChild(dueFieldWrap);
  det.appendChild(dueWrap);

  // Repeat schedule
  const rsWrap = document.createElement('div');
  rsWrap.innerHTML = `<label>Repeat Schedule</label>`;
  const rsSel = document.createElement('select');
  rsSel.dataset.f = 'repeatSchedule';
  REPEAT_OPTIONS.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt.value; o.textContent = opt.label;
    rsSel.appendChild(o);
  });
  rsSel.value = task.repeatSchedule || 'none';
  rsWrap.appendChild(rsSel);
  det.appendChild(rsWrap);

  // Action row
  const actions = document.createElement('div');
  actions.className = 'actions-row';

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-danger'; delBtn.textContent = 'Delete';
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openConfirmModal({
      title: 'Delete Task',
      message: 'Delete task "' + (task.title || 'untitled') + '"?',
      okLabel: 'Delete', danger: true,
      onConfirm: () => {
        sub.tasks = sub.tasks.filter(x => x.id !== task.id);
        save(); render();
      }
    });
  });

  const right = document.createElement('div');
  right.className = 'actions-right';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-soft'; cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    cancelOpenTaskPanel();
  });
  const doneBtn = document.createElement('button');
  doneBtn.className = 'btn'; doneBtn.textContent = 'Done';
  doneBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    commitOpenTaskPanel();
  });
  right.appendChild(cancelBtn);
  right.appendChild(doneBtn);

  actions.appendChild(delBtn);
  actions.appendChild(right);
  det.appendChild(actions);

  return det;
}

// ============================================================
// Task panel open/commit/cancel
// ============================================================
function getOpenTask() {
  const list = getList();
  if (!list) return null;
  for (const s of list.subjects) {
    for (const t of s.tasks) {
      if (t.expanded) return { task: t, sub: s };
    }
  }
  return null;
}
function openTaskPanel(task, sub) {
  // Close others (commit any open one first)
  commitOpenTaskPanel();
  const list = getList();
  list.subjects.forEach(s => s.tasks.forEach(t => { t.expanded = false; }));
  task.expanded = true;
  sub.open = true;
  save(); render();
}
function readPanelIntoTask(task) {
  const taskEl = document.querySelector('[data-task-id="' + task.id + '"]');
  if (!taskEl) return;
  const det = taskEl.querySelector('.task-details');
  if (!det) return;
  const titleVal = (det.querySelector('[data-f="title"]').value || '').trim();
  task.title = titleVal || task.title;
  task.notes = det.querySelector('[data-f="notes"]').value || '';
  task.manualDue = det.querySelector('[data-f="manualDue"]').value || '';
  task.repeatSchedule = det.querySelector('[data-f="repeatSchedule"]').value || 'none';
}
function commitOpenTaskPanel() {
  const o = getOpenTask();
  if (!o) return;
  if (isCalOpen()) closeCalendar();
  readPanelIntoTask(o.task);
  o.task.expanded = false;
  save(); render();
}
function cancelOpenTaskPanel() {
  const o = getOpenTask();
  if (!o) return;
  if (isCalOpen()) closeCalendar();
  o.task.expanded = false;
  save(); render();
}

// ============================================================
// Subject context menu
// ============================================================
const ctxMenu = document.getElementById('ctxMenu');
let ctxSubject = null;
function showSubjectCtxMenu(x, y, sub) {
  hideListCtxMenu();
  hideListDropdown();
  ctxSubject = sub;
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top = y + 'px';
  ctxMenu.classList.remove('hidden');
  requestAnimationFrame(() => {
    const r = ctxMenu.getBoundingClientRect();
    if (r.right > window.innerWidth)  ctxMenu.style.left = (window.innerWidth - r.width - 8) + 'px';
    if (r.bottom > window.innerHeight) ctxMenu.style.top = (window.innerHeight - r.height - 8) + 'px';
  });
}
function hideSubjectCtxMenu() {
  ctxMenu.classList.add('hidden');
  ctxSubject = null;
}
ctxMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  const act = e.target.dataset.act;
  if (!act || !ctxSubject) return;
  const sub = ctxSubject;
  hideSubjectCtxMenu();
  if (act === 'add-task') {
    openInputModal({
      title: 'New Task', placeholder: 'Task name', okLabel: 'Add',
      onSave: (name) => {
        sub.tasks.push({
          id: uid(), title: name, done: false, expanded: false,
          notes: '', manualDue: '', repeatSchedule: 'none', lastCompletedDate: ''
        });
        sub.open = true;
        save(); render();
      }
    });
  } else if (act === 'rename') {
    openInputModal({
      title: 'Rename Subject', placeholder: 'Subject name', initial: sub.name,
      onSave: (name) => { sub.name = name; save(); render(); }
    });
  } else if (act === 'delete') {
    openConfirmModal({
      title: 'Delete Subject',
      message: 'Delete subject "' + sub.name + '" and all its tasks?',
      okLabel: 'Delete', danger: true,
      onConfirm: () => {
        const list = getList();
        list.subjects = list.subjects.filter(s => s.id !== sub.id);
        save(); render();
      }
    });
  }
});

// ============================================================
// List selector — current name, dropdown, dblclick rename, ctx menu
// ============================================================
const listCtxMenu = document.getElementById('listCtxMenu');
function showListDropdown() {
  hideListCtxMenu();
  listDropdownEl.innerHTML = '';
  data.lists.forEach(l => {
    const b = document.createElement('button');
    b.textContent = l.name;
    if (l.id === data.currentListId) b.classList.add('active');
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      data.currentListId = l.id;
      hideListDropdown();
      save(); render();
    });
    listDropdownEl.appendChild(b);
  });
  listDropdownEl.classList.remove('hidden');
}
function hideListDropdown() { listDropdownEl.classList.add('hidden'); }
function showListCtxMenu(x, y) {
  hideListDropdown();
  hideSubjectCtxMenu();
  // Disable delete if last list
  const delBtn = listCtxMenu.querySelector('[data-act="delete"]');
  delBtn.disabled = data.lists.length <= 1;
  listCtxMenu.style.left = x + 'px';
  listCtxMenu.style.top = y + 'px';
  listCtxMenu.classList.remove('hidden');
  requestAnimationFrame(() => {
    const r = listCtxMenu.getBoundingClientRect();
    if (r.right > window.innerWidth)  listCtxMenu.style.left = (window.innerWidth - r.width - 8) + 'px';
    if (r.bottom > window.innerHeight) listCtxMenu.style.top = (window.innerHeight - r.height - 8) + 'px';
  });
}
function hideListCtxMenu() { listCtxMenu.classList.add('hidden'); }

(function initListSelector() {
  let timer = null;
  listCurrentEl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (timer) { clearTimeout(timer); timer = null; return; }
    timer = setTimeout(() => {
      timer = null;
      // Toggle dropdown
      if (listDropdownEl.classList.contains('hidden')) showListDropdown();
      else hideListDropdown();
    }, 230);
  });
  listCurrentEl.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (timer) { clearTimeout(timer); timer = null; }
    hideListDropdown();
    const list = getList();
    if (!list) return;
    openInputModal({
      title: 'Rename List', placeholder: 'List name', initial: list.name,
      onSave: (name) => { list.name = name; save(); render(); }
    });
  });
  listCurrentEl.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (timer) { clearTimeout(timer); timer = null; }
    showListCtxMenu(e.clientX, e.clientY);
  });
})();

listCtxMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  const act = e.target.dataset.act;
  if (!act) return;
  hideListCtxMenu();
  if (act === 'new') {
    openInputModal({
      title: 'New List', placeholder: 'List name', okLabel: 'Create',
      onSave: (name) => {
        const id = uid();
        data.lists.push({ id, name, subjects: [] });
        data.currentListId = id;
        save(); render();
      }
    });
  } else if (act === 'rename') {
    const list = getList(); if (!list) return;
    openInputModal({
      title: 'Rename List', placeholder: 'List name', initial: list.name,
      onSave: (name) => { list.name = name; save(); render(); }
    });
  } else if (act === 'delete') {
    if (data.lists.length <= 1) return;
    const list = getList();
    openConfirmModal({
      title: 'Delete List',
      message: 'Delete "' + list.name + '" and everything in it?',
      okLabel: 'Delete', danger: true,
      onConfirm: () => {
        data.lists = data.lists.filter(l => l.id !== list.id);
        data.currentListId = data.lists[0].id;
        save(); render();
      }
    });
  }
});

// ============================================================
// Settings button
// ============================================================
document.getElementById('settingsBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  commitOpenTaskPanel();
  hideListDropdown();
  hideListCtxMenu();
  hideSubjectCtxMenu();
  openSettingsModal();
});

// ============================================================
// FAB — new subject
// ============================================================
document.getElementById('fab').addEventListener('click', (e) => {
  e.stopPropagation();
  commitOpenTaskPanel();
  hideListDropdown();
  hideListCtxMenu();
  hideSubjectCtxMenu();
  openInputModal({
    title: 'New Subject', placeholder: 'Subject name', okLabel: 'Create',
    onSave: (name) => {
      const list = getList(); if (!list) return;
      list.subjects.push({
        id: uid(), name: name, open: true, tasks: [],
        resetSchedule: 'None', resetDay: 'None', lastResetDate: ''
      });
      save(); render();
    }
  });
});

// ============================================================
// Global outside-click + Escape
// ============================================================
document.addEventListener('click', (e) => {
  // Calendar outside-click
  if (isCalOpen()
      && !calPopup.contains(e.target)
      && e.target !== activeCalInput) {
    closeCalendar();
  }
  // List dropdown outside-click
  if (!listDropdownEl.classList.contains('hidden')
      && !listDropdownEl.contains(e.target)
      && e.target !== listCurrentEl) {
    hideListDropdown();
  }
  // List ctx menu outside-click
  if (!listCtxMenu.classList.contains('hidden') && !listCtxMenu.contains(e.target)) {
    hideListCtxMenu();
  }
  // Subject ctx menu outside-click
  if (!ctxMenu.classList.contains('hidden') && !ctxMenu.contains(e.target)) {
    hideSubjectCtxMenu();
  }
  // Task panel outside-click → commit
  const o = getOpenTask();
  if (o) {
    const taskEl = document.querySelector('[data-task-id="' + o.task.id + '"]');
    if (taskEl
        && !taskEl.contains(e.target)
        && !calPopup.contains(e.target)
        && !overlayEl.contains(e.target)
        && !ctxMenu.contains(e.target)
        && !listCtxMenu.contains(e.target)
        && !listDropdownEl.contains(e.target)) {
      commitOpenTaskPanel();
    }
  }
});

document.addEventListener('contextmenu', (e) => {
  // Close other floating menus when right-clicking elsewhere
  if (!ctxMenu.classList.contains('hidden') && !ctxMenu.contains(e.target)) hideSubjectCtxMenu();
  if (!listCtxMenu.classList.contains('hidden') && !listCtxMenu.contains(e.target)) hideListCtxMenu();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && isModalOpen() && modalState && !modalState.isSettings) {
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if (modalState.onOk) modalState.onOk();
    return;
  }
  if (e.key !== 'Escape') return;
  // Priority order
  if (isCalOpen()) { closeCalendar(); return; }
  if (isModalOpen()) {
    if (modalState && modalState.onCancel) modalState.onCancel();
    else closeModal();
    return;
  }
  if (!ctxMenu.classList.contains('hidden')) { hideSubjectCtxMenu(); return; }
  if (!listCtxMenu.classList.contains('hidden')) { hideListCtxMenu(); return; }
  if (!listDropdownEl.classList.contains('hidden')) { hideListDropdown(); return; }
  if (getOpenTask()) { cancelOpenTaskPanel(); return; }
});

// First paint
render();
</script>
