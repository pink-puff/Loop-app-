<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loop</title>
<style>
  /* Theme */
  :root{
    --theme:#b8a890;
    --theme-hover:color-mix(in srgb, var(--theme) 84%, #000);
    --theme-soft:color-mix(in srgb, var(--theme) 22%, transparent);
    --theme-faint:color-mix(in srgb, var(--theme) 12%, transparent);
    --theme-border:color-mix(in srgb, var(--theme) 38%, transparent);
    --on-theme:#fff;
    --bg:#f5f3ef; --card:#fff; --card-soft:#faf8f4;
    --text:#2e2c28; --muted:#7a7468;
    --border:#e2ddd5; --border-soft:#efeae0;
    --soft:#ece6dc; --soft-hover:#ddd5c8;
    --accent:var(--theme); --accent-hover:var(--theme-hover);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 6px 22px rgba(0,0,0,0.10);
    --shadow-lg:0 12px 40px rgba(0,0,0,0.22);
    --pill-overdue:#d44a4a; --pill-soon:#e08a2a; --pill-done:#4d9a4d;
    --pill-neutral-bg:#ece6dc; --pill-neutral-fg:#5a554d;
    --tone-overdue:#fdecec; --tone-overdue-b:#f1c5c5;
    --tone-soon:#fdf2e2;    --tone-soon-b:#efd6ae;
    --tone-done:#eef6ec;    --tone-done-b:#cee0c9;
    --task-overdue:#fbdada; --task-soon:#faebd0; --task-done:#e6f1e3;
    --selected:var(--theme); --selected-fg:var(--on-theme); --today-ring:var(--theme);
    --drop-line:var(--theme);
    --sel-hl:var(--theme-soft);
  }
  [data-theme="dark"]{
    --theme-hover:color-mix(in srgb, var(--theme) 82%, #fff);
    --theme-soft:color-mix(in srgb, var(--theme) 20%, transparent);
    --theme-faint:color-mix(in srgb, var(--theme) 11%, transparent);
    --theme-border:color-mix(in srgb, var(--theme) 34%, transparent);
    --on-theme:#1c1a18;
    --bg:#1c1a18; --card:#2a2724; --card-soft:#322f2c;
    --text:#ece6dc; --muted:#a8a298;
    --border:#3d3833; --border-soft:#34302c;
    --soft:#3a3631; --soft-hover:#4a453f;
    --accent:var(--theme); --accent-hover:var(--theme-hover);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:0 6px 22px rgba(0,0,0,0.5);
    --shadow-lg:0 12px 40px rgba(0,0,0,0.6);
    --pill-overdue:#b94040; --pill-soon:#b97525; --pill-done:#4a8a4a;
    --pill-neutral-bg:#3d3833; --pill-neutral-fg:#d8d2c6;
    --tone-overdue:#3a2424; --tone-overdue-b:#4d2c2c;
    --tone-soon:#3a2e1c;    --tone-soon-b:#4d3a22;
    --tone-done:#233022;    --tone-done-b:#2c3d2b;
    --task-overdue:#4a2c2c; --task-soon:#4a3a22; --task-done:#2c3d2b;
    --selected:var(--theme); --selected-fg:var(--on-theme); --today-ring:var(--theme-hover);
    --drop-line:var(--theme-hover);
    --sel-hl:var(--theme-soft);
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}

  /* ===== Subtle focus outlines (no loud orange/brown ring) ===== */
  button:focus,
  input:focus,
  select:focus,
  textarea:focus { outline: none; }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 1px solid var(--theme-border);
    outline-offset: 2px;
    box-shadow: none;
  }
  [data-theme="dark"] button:focus-visible,
  [data-theme="dark"] input:focus-visible,
  [data-theme="dark"] select:focus-visible,
  [data-theme="dark"] textarea:focus-visible,
  [data-theme="dark"] [tabindex]:focus-visible {
    outline: 1px solid var(--theme-border);
    outline-offset: 2px;
    box-shadow: none;
  }
  html, body { height:100vh; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text); padding:18px 18px 0 18px;
    transition:background .2s,color .2s; user-select:none;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .topbar, .page-header { flex-shrink:0; }
  /* When any overlay is open the background must not scroll or swipe */
  body.overlay-open{ overflow:hidden; }
  input,textarea{user-select:text}
  select,button,input,textarea{font-family:inherit;font-size:14px;color:var(--text)}

  /* topbar */
  .topbar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; margin-bottom:6px}
  .topbar .left{display:flex;align-items:center}
  .topbar .center{display:flex;justify-content:center}
  .topbar .right{display:flex;justify-content:flex-end;gap:6px}
  .app-title{font-size:18px;font-weight:700;letter-spacing:.2px}
  .list-selector{position:relative}
  .list-current{
    width:280px; text-align:center; padding:9px 14px; background:transparent;
    border:1px solid var(--border-soft); border-radius:12px; font-size:14px;
    color:var(--text); cursor:pointer; transition:background .15s;
  }
  .list-current:hover{background:var(--soft)}
  .btn-icon{
    background:transparent; border:1px solid var(--border-soft); color:var(--muted);
    cursor:pointer; padding:7px 11px; font-size:15px; border-radius:10px;
    transition:background .15s;
  }
  .btn-icon:hover{background:var(--soft)}

  /* page header */
  .page-header{
    display:flex; align-items:center; justify-content:space-between;
    margin:14px 0 14px;
  }
  .page-title{font-size:22px; font-weight:700}
  .header-row-left{display:flex; align-items:center; gap:10px}
  .header-row-right{display:flex; align-items:center; gap:8px}
  #sortToggleHost{display:flex; align-items:center; gap:8px}

  /* segmented sort control */
  .seg-track{
    position:relative; display:inline-flex;
    background:var(--soft); border-radius:999px; padding:3px;
  }
  .seg-indicator{
    position:absolute; top:3px; bottom:3px;
    border-radius:999px; background:var(--accent);
    transition:transform 200ms cubic-bezier(.2,.7,.2,1), width 200ms cubic-bezier(.2,.7,.2,1);
  }
  .seg-track button{
    position:relative; z-index:1; background:transparent; border:none;
    padding:6px 16px; cursor:pointer; font-size:13px; color:var(--muted);
    border-radius:999px;
  }
  .seg-track button.active{color:#fff}

  /* info tooltip button */
  .info-btn{
    background:transparent; border:none; color:var(--muted);
    cursor:pointer; font-size:12px; line-height:1; padding:2px 4px; border-radius:6px;
  }
  .info-btn:hover{color:var(--text); background:var(--soft)}

  #tooltip{
    position:fixed; z-index:800; background:var(--card);
    border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:12px; color:var(--text);
    box-shadow:var(--shadow-md); max-width:240px; line-height:1.4;
  }
  #tooltip.hidden{display:none}

  /* menus */
  .menu,.ctx-menu{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow-md); padding:6px; display:flex; flex-direction:column;
    min-width:200px;
  }
  .menu.hidden,.ctx-menu.hidden{display:none}
  .menu button,.ctx-menu button{
    background:none; border:none; text-align:left; padding:8px 10px;
    font-size:14px; color:var(--text); cursor:pointer; border-radius:6px;
  }
  .menu button:hover,.ctx-menu button:hover{background:var(--soft)}
  .menu button:disabled{color:var(--muted); cursor:not-allowed}
  .menu button.danger,.ctx-menu button.danger{color:#c75050}
  .menu button.active{background:var(--soft)}
  #listDropdown{position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); z-index:110; min-width:280px}
  .ctx-menu{position:fixed; z-index:200}

  /* Subject card */
  .subject{
    background:var(--card); border:1px solid var(--border-soft); border-radius:14px;
    margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm);
  }
  .subject.has-overdue{background:var(--tone-overdue); border-color:var(--tone-overdue-b)}
  .subject.has-soon   {background:var(--tone-soon);    border-color:var(--tone-soon-b)}
  .subject.all-done   {background:var(--tone-done);    border-color:var(--tone-done-b)}
  .subject.dragging{opacity:0.5}
  .subject-header{display:flex; align-items:center; padding:12px 14px; gap:10px; cursor:pointer}
  .arrow{display:inline-block; width:14px; text-align:center; transition:transform .15s; color:var(--muted)}
  .arrow.open{transform:rotate(90deg)}
  .subject-name{flex:1; font-weight:600}
  .due-label{font-size:12px; color:var(--muted); margin-right:6px}
  .subject-body{padding:0 14px 8px 30px}

  /* tasks */
  .task{background:var(--card-soft); border-radius:10px; padding:8px 10px; margin-top:8px; transition:opacity .35s ease}
  .task.tone-overdue{background:var(--task-overdue)}
  .task.tone-soon   {background:var(--task-soon)}
  .task.tone-done   {background:var(--task-done)}
  .task.fading{opacity:0.25}
  .task.dragging{opacity:0.4}
  .task.selected{box-shadow:0 0 0 2px var(--accent); background:var(--sel-hl)}
  .task-row{display:flex; align-items:center; gap:10px}
  .task-row input[type="checkbox"]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}
  .task-title{flex:1; font-size:14px}
  .task.tone-done .task-title{text-decoration:line-through; color:var(--muted)}
  .task-arrow{cursor:pointer; color:var(--muted); padding:2px 6px; border-radius:6px}
  .task-arrow:hover{background:var(--soft)}
  .subject-pill{font-size:11px; color:var(--muted); margin-right:6px}

  /* Important "!" toggle */
  .task-important-btn{
    background:transparent; border:none; color:var(--muted);
    cursor:pointer; padding:6px 8px; border-radius:8px;
    font-size:14px; line-height:1; font-weight:700;
  }
  .task-important-btn:hover{ background:var(--soft); color:var(--text); }
  .task-important-btn.active{ color:var(--pill-overdue); }
  .task.important{ border-left:3px solid var(--pill-overdue); padding-left:7px; }
  .today-task.important{ border-left:4px solid var(--pill-overdue); }
  .today-task.important .name::before{
    content:'! '; color:var(--pill-overdue); font-weight:700;
  }
  .task.important .task-title::before{
    content:'! '; color:var(--pill-overdue); font-weight:700;
  }

  /* edit pen button on tasks/subjects */
  .task-edit-btn, .subject-edit-btn{
    background:transparent; border:none; color:var(--muted);
    cursor:pointer; padding:6px 9px; border-radius:8px;
    font-size:14px; line-height:1;
  }
  .task-edit-btn:hover, .subject-edit-btn:hover{ background:var(--soft); color:var(--text); }

  /* drag handle (grip) — only this triggers drag */
  .task-grip{
    cursor:grab; padding:4px 4px; color:var(--muted);
    font-size:14px; line-height:1; letter-spacing:-1px;
    user-select:none; flex-shrink:0;
  }
  .task-grip:active{ cursor:grabbing; }
  .task-grip:hover{ color:var(--text); }
  .task-title{ user-select:text; }

  /* drag badge for group moves */
  .drag-badge{
    position:fixed; left:-9999px; top:-9999px;
    background:var(--accent); color:var(--on-theme);
    padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:600;
    box-shadow:var(--shadow-md);
  }

  /* mode-change feedback toast */
  .sort-feedback{
    position:fixed; left:50%; top:84px; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border-soft);
    padding:6px 12px; border-radius:8px;
    font-size:12px; color:var(--muted);
    box-shadow:var(--shadow-sm); z-index:55; pointer-events:none;
    transition:opacity 250ms ease;
  }

  /* tag filter chips (Today / Upcoming / Organize) */
  .filter-chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
  .filter-chip{
    background:transparent; border:1px solid var(--border-soft);
    color:var(--muted); cursor:pointer; padding:5px 12px;
    border-radius:999px; font-size:13px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .filter-chip:hover{ background:var(--soft); color:var(--text); }
  .filter-chip.active{ background:var(--accent); color:var(--on-theme); border-color:var(--accent); }

  /* tag pills shown inside task rows */
  .tag-pill-mini{
    display:inline-block; font-size:10px; font-weight:600;
    padding:2px 8px; border-radius:999px;
    background:var(--soft); color:var(--muted);
    text-transform:uppercase; letter-spacing:0.4px;
    margin-left:4px; vertical-align:middle;
  }
  /* tag picker inside edit modal */
  .tag-picker{display:flex; gap:6px; flex-wrap:wrap}
  .tag-picker .tag-pill{
    background:var(--soft); color:var(--text);
    border:none; padding:6px 12px; border-radius:999px;
    cursor:pointer; font-size:13px;
  }
  .tag-picker .tag-pill.active{ background:var(--accent); color:var(--on-theme); }

  /* select-mode toggle */
  .select-toggle{
    background:transparent; border:1px solid var(--border-soft);
    color:var(--muted); cursor:pointer; padding:5px 12px;
    border-radius:999px; font-size:12px;
  }
  .select-toggle:hover{ background:var(--soft); color:var(--text); }
  .select-toggle.active{ background:var(--accent); color:var(--on-theme); border-color:var(--accent); }

  /* pills */
  .pill{display:inline-block; font-size:12px; padding:3px 9px; border-radius:999px; white-space:nowrap; font-weight:500}
  .pill-neutral{background:var(--pill-neutral-bg); color:var(--pill-neutral-fg)}
  .pill-overdue{background:var(--pill-overdue); color:#fff}
  .pill-soon   {background:var(--pill-soon);    color:#fff}
  .pill-done   {background:var(--pill-done);    color:#fff}

  /* edit panels */
  .edit-panel{
    margin:6px 14px 12px 30px; padding:14px;
    background:var(--card); border:1px solid var(--border-soft); border-radius:10px;
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .edit-panel .full{grid-column:1 / -1}
  .edit-panel label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; margin-bottom:4px}
  .edit-panel input,.edit-panel select,.edit-panel textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--card); color:var(--text);
  }
  .edit-panel textarea{resize:vertical; min-height:60px}
  .edit-panel .actions-row{grid-column:1/-1; display:flex; justify-content:space-between; gap:8px; margin-top:4px}
  .edit-panel .actions-right{display:flex; gap:8px}

  /* buttons */
  .btn{background:var(--accent); color:var(--on-theme); border:none; padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:500}
  .btn:hover{background:var(--accent-hover)}
  .btn-soft{background:var(--soft); color:var(--text); border:none; padding:8px 14px; border-radius:10px; cursor:pointer}
  .btn-soft:hover{background:var(--soft-hover)}
  .btn-danger{background:var(--pill-overdue); color:#fff; border:none; padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:500}
  .btn-danger:hover{filter:brightness(0.95)}
  .btn-link{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:4px 8px; border-radius:6px}
  .btn-link:hover{color:var(--text); background:var(--soft)}

  /* nav island + add */
  .nav-island{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; gap:4px; background:var(--card); border:1px solid var(--border);
    border-radius:999px; padding:5px; box-shadow:var(--shadow-md); z-index:100;
  }
  .nav-island button{
    border:none; background:transparent; padding:8px 18px; border-radius:999px;
    cursor:pointer; color:var(--muted); font-size:13px; font-weight:500;
    transition:background .15s, color .15s;
  }
  .nav-island button:hover{color:var(--text)}
  .nav-island button.active{background:var(--accent); color:var(--on-theme)}

  .fab-add{
    position:fixed; bottom:84px; left:50%; transform:translateX(-50%);
    width:48px; height:48px; border-radius:50%;
    background:var(--accent); color:var(--on-theme); font-size:24px; line-height:1;
    border:none; cursor:pointer; box-shadow:var(--shadow-md); z-index:99;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-add:hover{background:var(--accent-hover)}

  /* quick add input */
  .quick-add{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%);
    width:min(440px, 90vw); display:flex; gap:6px; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:8px; box-shadow:var(--shadow-lg); z-index:101;
  }
  .quick-add.hidden{display:none}
  .quick-add input{
    flex:1; padding:9px 11px; border:1px solid var(--border);
    border-radius:10px; background:var(--card); color:var(--text);
  }

  /* selection bar */
  .sel-bar{
    position:fixed; top:0; left:0; right:0; z-index:90;
    background:var(--card); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    align-items:center; gap:8px; padding:10px 18px;
    transform:translateY(-100%); transition:transform 200ms ease;
    pointer-events:none;
  }
  .sel-bar.hidden{display:none}
  .sel-bar.visible{display:flex; transform:translateY(0); pointer-events:auto}
  .sel-bar .count{font-weight:600; margin-right:6px}
  .sel-bar .spacer{flex:1}

  /* toast */
  .toast{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; box-shadow:var(--shadow-md); z-index:95;
    display:flex; align-items:center; gap:10px; font-size:13px;
  }
  .toast.hidden{display:none}
  .toast button{background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer}

  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px}

  /* modal (still used for some popups) */
  .overlay{position:fixed; inset:0; background:rgba(20,18,16,0.45); display:flex; align-items:center; justify-content:center; z-index:500}
  .overlay.hidden{display:none}
  .modal{
    position:relative; background:var(--card); border-radius:14px;
    padding:20px 22px;
    min-width:min(360px, calc(100vw - 32px));
    max-width:calc(100vw - 32px);
    max-height:calc(100vh - 48px);
    box-shadow:var(--shadow-lg); color:var(--text);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .modal > .modal-body{ overflow-y:auto; min-height:0; flex:1 1 auto; }
  .modal > .modal-body.settings-body{
    padding-right:14px;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:var(--theme-border) transparent;
  }
  .modal > .modal-body.settings-body::-webkit-scrollbar{width:6px}
  .modal > .modal-body.settings-body::-webkit-scrollbar-track{background:transparent}
  .modal > .modal-body.settings-body::-webkit-scrollbar-thumb{
    background:var(--theme-border); border-radius:999px;
  }
  .modal > .modal-body.settings-body::-webkit-scrollbar-thumb:hover{background:var(--theme)}
  .modal > .modal-actions{ flex-shrink:0; padding-top:6px; }
  @media (max-height: 560px){
    .modal{ padding:14px 16px; max-height:calc(100vh - 24px); }
  }
  .modal-title{font-size:16px; font-weight:600; margin-bottom:14px}
  .modal-close{position:absolute; top:10px; right:10px; width:28px; height:28px; background:transparent; border:none; border-radius:8px; color:var(--muted); cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center}
  .modal-close:hover{background:var(--soft)}
  .modal-body{margin-bottom:16px}
  .modal-body input[type="text"],.modal-body input[type="date"],.modal-body select,.modal-body textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text);
  }
  .modal-message{font-size:14px; color:var(--text); line-height:1.45}
  .form-row{margin-bottom:12px}
  .form-row label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px}

  /* settings rows */
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-soft); gap:12px}
  .settings-row:last-child{border-bottom:none}
  .settings-group{
    font-size:11px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.6px;
    padding:14px 0 6px; border-bottom:1px solid var(--border-soft);
    margin-top:4px;
  }
  .settings-group:first-child{padding-top:0}
  .settings-row .label-block{display:flex; flex-direction:column}
  .settings-row .label-block .small{font-size:12px; color:var(--muted); margin-top:2px}
  .toggle{position:relative; width:40px; height:22px; flex-shrink:0}
  .toggle input{opacity:0; width:0; height:0; position:absolute}
  .toggle .slider{position:absolute; inset:0; background:var(--soft); border-radius:22px; cursor:pointer; transition:background .15s}
  .toggle .slider::before{content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.18s; box-shadow:0 1px 2px rgba(0,0,0,0.18)}
  .toggle input:checked + .slider{background:var(--accent)}
  .toggle input:checked + .slider::before{transform:translateX(18px)}
  .toggle input:disabled + .slider{cursor:not-allowed; opacity:.52}

  /* calendar */
  .cal-popup{
    position:fixed; z-index:600; width:280px; max-width:calc(100vw - 24px);
    max-height:calc(100vh - 24px); overflow-y:auto;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow-md); padding:10px; color:var(--text);
  }
  .cal-popup.hidden{display:none}
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .cal-title{font-weight:600; font-size:14px}
  .cal-nav{background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:18px; padding:2px 8px; border-radius:6px}
  .cal-nav:hover{background:var(--soft)}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px}
  .cal-weekdays div{text-align:center; font-size:11px; color:var(--muted); padding:4px 0}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
  .cal-day{background:transparent; border:1px solid transparent; border-radius:8px; color:var(--text); padding:6px 0; font-size:13px; cursor:pointer; text-align:center}
  .cal-day:hover{background:var(--soft)}
  .cal-day.faded{color:var(--muted); opacity:0.5}
  .cal-day.today{border-color:var(--today-ring); font-weight:600}
  .cal-day.selected{background:var(--selected); color:var(--selected-fg); border-color:var(--selected)}
  .cal-day.selected:hover{background:var(--accent-hover)}
  .cal-clear{margin-top:8px; width:100%; background:transparent; border:1px dashed var(--border); color:var(--muted); border-radius:8px; padding:6px; cursor:pointer; font-size:12px}
  .cal-clear:hover{background:var(--soft); color:var(--text)}

  /* drag drop */
  #dropLine{position:fixed; z-index:700; height:3px; background:var(--drop-line); border-radius:2px; pointer-events:none}
  #dropLine.hidden{display:none}

  /* defensive: any element with .hidden should never block clicks */
  .hidden{display:none !important}

  /* Horizontal page strip — viewport clips, track slides. */
  .page-viewport{
    position:relative; overflow:hidden; width:100%;
    flex:1 1 auto; min-height:0;
  }
  .page-track{
    display:flex; width:300%; height:100%;
    transform: translateX(0);
    will-change: transform;
  }
  .page-track.animating{ transition: transform 320ms cubic-bezier(.2,.7,.2,1); }
  .page-panel{
    flex:0 0 33.3333%; min-width:0;
    height:100%;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .page-panel-chips{ flex:0 0 auto; }
  .page-panel-scroll{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    padding-right:10px;
    padding-bottom:170px;       /* clears typing bar + nav island */
    scrollbar-gutter:stable;
  }

  /* === Profile setup card === */
  .profile-overlay{ position:fixed; inset:0; z-index:1100; background:rgba(28,26,24,0.55); display:flex; align-items:center; justify-content:center; padding:20px; }
  .profile-overlay.hidden{ display:none }
  .profile-card{
    background:var(--card); border-radius:16px; padding:28px 28px;
    width:min(440px, 92vw); box-shadow:var(--shadow-lg);
  }
  .profile-title{ font-size:20px; font-weight:700; margin-bottom:8px }
  .profile-sub{ font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:18px }
  .profile-options{ display:flex; flex-direction:column; gap:8px }
  .profile-opt{
    background:var(--card-soft); border:1px solid var(--border-soft);
    color:var(--text); padding:12px 14px; border-radius:10px;
    font-size:14px; font-weight:500; cursor:pointer; text-align:left;
    transition:background .15s, border-color .15s;
  }
  .profile-opt:hover{ background:var(--soft); border-color:var(--border); }

  /* === Tutorial === */
  .tutorial-overlay{ position:fixed; inset:0; z-index:1050; pointer-events:none; }
  .tutorial-overlay.hidden{ display:none }
  .tutorial-dim{ position:absolute; inset:0; background:rgba(20,18,16,0.55); pointer-events:auto; }
  .tutorial-skip{
    position:absolute; top:18px; right:18px; pointer-events:auto;
    background:transparent; border:1px solid rgba(255,255,255,0.4);
    color:#fff; padding:6px 12px; border-radius:999px; cursor:pointer;
    font-size:12px;
  }
  .tutorial-skip:hover{ background:rgba(255,255,255,0.1); }
  .tutorial-card{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    width:min(440px, calc(100vw - 32px));
    max-height:calc(100vh - 200px);
    overflow-y:auto;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; box-shadow:var(--shadow-lg); pointer-events:auto;
  }
  @media (max-height: 560px){
    .tutorial-card{ padding:12px; bottom:14px; max-height:calc(100vh - 140px) }
    .tutorial-reel{ height:72px }
  }
  .tutorial-step{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px }
  .tutorial-text{ font-size:15px; line-height:1.45; color:var(--text); margin-bottom:14px }
  .tutorial-actions{ display:flex; justify-content:space-between; gap:8px }
  .tutorial-actions .btn-soft, .tutorial-actions .btn { padding:7px 14px; font-size:13px }

  /* Element being highlighted for the tutorial */
  .tutorial-highlight{
    position:relative; z-index:1060 !important;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.18), 0 0 0 7px var(--theme-border);
    border-radius:12px;
  }

  /* Rotating example reel */
  .tutorial-reel{
    position:relative; height:96px; margin-bottom:14px;
    overflow:hidden; -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);
  }
  .tutorial-reel.hidden{ display:none }
  .tutorial-reel .reel-prev,
  .tutorial-reel .reel-current,
  .tutorial-reel .reel-next{
    position:absolute; left:0; right:0; text-align:center;
    transition: transform 320ms cubic-bezier(.2,.7,.2,1), opacity 320ms ease;
    font-family:inherit;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 10px;
  }
  .tutorial-reel .reel-current{ top:50%; transform:translateY(-50%); font-size:15px; font-weight:600; color:var(--text); opacity:1 }
  .tutorial-reel .reel-prev{    top:0;    transform:translateY(0);    font-size:13px; color:var(--muted); opacity:0.55 }
  .tutorial-reel .reel-next{    bottom:0; transform:translateY(0);    font-size:13px; color:var(--muted); opacity:0.55 }

  /* Teleport flash on a subject card */
  @keyframes teleportFlash {
    0%   { box-shadow:0 0 0 0 var(--theme); }
    50%  { box-shadow:0 0 0 6px var(--theme-soft); }
    100% { box-shadow:0 0 0 0 transparent; }
  }
  .teleport-flash{ animation: teleportFlash 1100ms ease-out; }

  /* ===== Persistent typing bar + parse panel ===== */
  .typing-bar{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    width:min(680px, calc(100vw - 36px));
    background:var(--card); border:1px solid var(--border-soft); border-radius:16px;
    padding:6px 10px; box-shadow:var(--shadow-md); z-index:96;
    display:flex; align-items:center;
  }
  .typing-bar input{
    flex:1; border:none; background:transparent; outline:none;
    padding:10px 6px; font-size:14px; color:var(--text);
  }
  .typing-bar input::placeholder{ color:var(--muted); opacity:0.7 }

  .parse-panel{
    position:fixed; bottom:138px; left:50%; transform:translateX(-50%);
    width:min(680px, calc(100vw - 36px));
    background:var(--card); border:1px solid var(--border-soft); border-radius:14px;
    padding:10px 12px; box-shadow:var(--shadow-md); z-index:95;
    display:flex; flex-direction:column; gap:6px;
    animation:parsePanelIn 180ms ease;
  }
  @keyframes parsePanelIn {
    from { opacity:0; transform:translate(-50%, 8px); }
    to   { opacity:1; transform:translate(-50%, 0); }
  }
  .parse-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px}
  .parse-row.no-label{padding-left:62px}
  .parse-label{font-size:11px; color:var(--muted); width:54px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.4px}
  .parse-value{color:var(--text); font-weight:500}
  .parse-sub{font-size:11px; color:var(--muted)}
  .parse-panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:22px}
  .parse-caption{font-size:10px; color:var(--muted); letter-spacing:0.4px; text-transform:uppercase; margin-bottom:2px}
  .parse-reset{
    background:transparent; border:none; color:var(--accent); cursor:pointer;
    padding:3px 7px; border-radius:7px; font-size:11px;
  }
  .parse-reset:hover{background:var(--theme-faint)}
  .parse-row.manual-edited::after{
    content:'Edited'; margin-left:auto; color:var(--accent); font-size:10px;
    letter-spacing:.3px; text-transform:uppercase;
  }
  .parse-row.no-label.manual-edited::after{display:none}
  .parse-suggestion-row{ align-items:center }
  .parse-suggestion-content{
    flex:1; display:flex; align-items:center; gap:10px;
    background:var(--card-soft); border:1px dashed var(--border-soft);
    border-radius:8px; padding:5px 10px;
  }
  .parse-suggestion-text{ font-size:12px; color:var(--text); flex:1 }
  .parse-suggestion-text b{ color:var(--accent) }
  .parse-suggestion-actions{ display:flex; gap:4px; flex-shrink:0 }
  .parse-suggest-btn{
    background:transparent; border:1px solid var(--border-soft);
    color:var(--muted); cursor:pointer; padding:3px 9px;
    border-radius:999px; font-size:11px;
  }
  .parse-suggest-btn:hover{ color:var(--text); background:var(--soft) }
  .parse-suggest-btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-theme) }
  .parse-suggest-btn.primary:hover{ background:var(--accent-hover); color:#fff }
  .parse-edit{
    flex:1; min-width:140px; background:transparent;
    border:1px solid transparent; border-radius:8px;
    padding:5px 8px; color:var(--text); font-weight:500; font-size:13px;
  }
  .parse-edit:hover{ border-color:var(--border-soft); background:var(--card-soft); }
  .parse-edit:focus{ border-color:var(--border); background:var(--card); }
  .parse-edit.muted{ color:var(--muted); font-style:italic; font-weight:400; }

  .quick-pills{display:flex; gap:6px; flex-wrap:wrap}
  .quick-pills button{
    background:var(--soft); border:none; padding:4px 11px; border-radius:999px;
    font-size:12px; color:var(--text); cursor:pointer; transition:background .15s;
  }
  .quick-pills button:hover{background:var(--soft-hover)}
  .quick-pills button.active{background:var(--accent); color:var(--on-theme)}

  /* upcoming groups */
  .day-group{margin:18px 0 6px}
  .day-group-title{font-size:13px; font-weight:600; color:var(--muted); padding:0 4px 6px}

  /* today list */
  .today-task{
    background:var(--card); border:1px solid var(--border-soft);
    border-radius:14px; padding:16px 16px; margin-bottom:11px;
    display:flex; align-items:center; gap:12px; cursor:pointer;
    transition:opacity .35s ease, background .25s ease, transform .25s ease;
    border-left:4px solid transparent;
  }
  .today-task.fading{opacity:0.25}
  .today-task:hover{background:var(--card-soft)}
  .today-task .check-circle{
    width:18px; height:18px; border:2px solid var(--muted); border-radius:50%;
    flex-shrink:0;
  }
  .today-task .body{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0}
  .today-task .subject-tag{
    font-size:13px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .today-task .name{font-size:18px; font-weight:600; line-height:1.25}
  .today-task .meta{font-size:13px; color:var(--muted)}

  /* Urgency emphasis on Today/Upcoming rows */
  .today-task.is-overdue{
    background:var(--tone-overdue); border-color:var(--tone-overdue-b);
    border-left-color:var(--pill-overdue);
  }
  .today-task.is-overdue .subject-tag{ color:var(--pill-overdue); }
  .today-task.is-today{
    background:var(--tone-soon); border-color:var(--tone-soon-b);
    border-left-color:var(--pill-soon);
  }
  .today-task.is-today .subject-tag{ color:var(--pill-soon); }
  .today-task.is-tomorrow{
    border-left-color:var(--pill-soon);
  }
  .today-task.is-soon{
    border-left-color:var(--accent);
  }

  /* Upcoming page group headers — clearer */
  .day-group-title{font-size:14px !important; font-weight:600 !important; color:var(--text) !important; padding:0 4px 8px !important}

  /* completing state — strike-through + green tint */
  .task.completing, .today-task.completing{
    background:var(--task-done) !important;
  }
  .task.completing .task-title,
  .today-task.completing .name{
    text-decoration:line-through;
    color:var(--muted);
  }
  .task.completion-leaving, .today-task.completion-leaving{
    overflow:hidden;
    box-sizing:border-box;
    will-change:height, margin, padding, opacity, transform;
    pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){
    .task.completion-leaving, .today-task.completion-leaving{transform:none !important; will-change:auto}
  }

  /* task appear animation */
  @keyframes taskAppear {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .task.appearing, .today-task.appearing{
    animation: taskAppear 220ms ease-out;
  }

  /* "Task added" toast */
  .add-toast{
    position:fixed; bottom:200px; left:50%; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border);
    padding:8px 14px; border-radius:999px;
    font-size:12px; color:var(--text);
    box-shadow:var(--shadow-md); z-index:97; pointer-events:none;
    opacity:0; transition:opacity 200ms ease, transform 200ms ease;
  }
  .add-toast.visible{ opacity:1; transform:translateX(-50%) translateY(-4px); }
</style>
</head>
<body>

<!-- Selection bar -->
<div id="selBar" class="sel-bar hidden">
  <button class="btn-soft" data-act="cancel" type="button">Cancel</button>
  <span class="spacer"></span>
  <span class="count" id="selCount">0 selected</span>
  <span class="spacer"></span>
  <button class="btn-soft" data-act="complete" type="button">Complete</button>
  <button class="btn-soft" data-act="delete" type="button">Delete</button>
  <button class="btn-soft" data-act="duplicate" type="button">Duplicate</button>
  <button class="btn-soft" data-act="move" type="button">Move</button>
</div>

<!-- Topbar -->
<div class="topbar">
  <div class="left"><div class="app-title">Loop</div></div>
  <div class="center">
    <div class="list-selector">
      <div id="listCurrent" class="list-current"></div>
      <div id="listDropdown" class="menu hidden"></div>
    </div>
  </div>
  <div class="right">
    <button id="settingsBtn" class="btn-icon" title="Settings" aria-label="Open settings">⚙</button>
  </div>
</div>

<!-- Page header (title + sort toggle on subjects page) -->
<div class="page-header">
  <div class="header-row-left">
    <div class="page-title" id="pageTitle">Today</div>
    <div id="sortToggleHost"></div>
  </div>
  <div class="header-row-right" id="selectHost"></div>
</div>

<!-- Page content -->
<div id="pageContent" class="page-viewport">
  <div id="pageTrack" class="page-track">
    <section class="page-panel" data-page="today">
      <div class="page-panel-chips" data-host="chips"></div>
      <div class="page-panel-scroll" data-host="scroll"></div>
    </section>
    <section class="page-panel" data-page="upcoming">
      <div class="page-panel-chips" data-host="chips"></div>
      <div class="page-panel-scroll" data-host="scroll"></div>
    </section>
    <section class="page-panel" data-page="subjects">
      <div class="page-panel-chips" data-host="chips"></div>
      <div class="page-panel-scroll" data-host="scroll"></div>
    </section>
  </div>
</div>

<!-- Persistent bottom typing bar + live parse panel -->
<div id="parsePanel" class="parse-panel hidden">
  <div class="parse-panel-head">
    <div class="parse-caption">This is what will be added</div>
    <button class="parse-reset hidden" id="parseResetAll" type="button">Reset changes</button>
  </div>
  <div class="parse-row" data-parse-field="task">
    <span class="parse-label">Task</span>
    <input type="text" class="parse-edit" id="parseTaskName" data-field="task" />
  </div>
  <div class="parse-row" data-parse-field="subject">
    <span class="parse-label">Subject</span>
    <input type="text" class="parse-edit" id="parseSubject" data-field="subject" />
    <span class="parse-sub" id="parseSubjectSub">Task can be organized later</span>
  </div>
  <div class="parse-row parse-suggestion-row hidden" id="parseSuggestionRow">
    <span class="parse-label"></span>
    <div class="parse-suggestion-content">
      <span class="parse-suggestion-text">Did you mean <b id="parseSuggestionName">—</b>?</span>
      <div class="parse-suggestion-actions">
        <button type="button" class="parse-suggest-btn primary" data-act="use">Use</button>
        <button type="button" class="parse-suggest-btn" data-act="keep">Keep typed</button>
      </div>
    </div>
  </div>
  <div class="parse-row" data-parse-field="tags">
    <span class="parse-label">Tags</span>
    <div class="quick-pills" id="parseTagsRow">
      <button type="button" data-tag="School">School</button>
      <button type="button" data-tag="Tutor">Tutor</button>
      <button type="button" data-tag="Home">Home</button>
    </div>
  </div>
  <div class="parse-row" data-parse-field="due">
    <span class="parse-label" id="parseDueLabel">Due</span>
    <span class="parse-value" id="parseDue">None</span>
  </div>
  <div class="parse-row no-label" data-parse-field="due">
    <div class="quick-pills" id="quickDueRow">
      <button type="button" data-due="today">Today</button>
      <button type="button" data-due="tomorrow">Tomorrow</button>
      <button type="button" data-due="weekend">Weekend</button>
      <button type="button" data-due="none">No due</button>
    </div>
  </div>
  <div class="parse-row" data-parse-field="repeat">
    <span class="parse-label">Repeats</span>
    <div class="quick-pills" id="repeatRow">
      <button type="button" data-rep="none">No</button>
      <button type="button" data-rep="daily">Daily</button>
      <button type="button" data-rep="weekly">Weekly</button>
      <button type="button" data-rep="fortnightly">Fortnightly</button>
    </div>
  </div>
  <div class="parse-row" id="parseTimeRow" data-parse-field="time">
    <span class="parse-label">Time</span>
    <input type="text" class="parse-edit" id="parseTime" data-field="time" placeholder="None" />
  </div>
</div>

<div id="typingBar" class="typing-bar">
  <input id="typingInput" type="text" autocomplete="off" placeholder="" aria-label="Capture a task" />
</div>
<div class="nav-island" id="navIsland">
  <button data-page="today" type="button">Today</button>
  <button data-page="upcoming" type="button">Upcoming</button>
  <button data-page="subjects" type="button">Organize</button>
</div>

<!-- Subject ctx menu -->
<div id="ctxMenu" class="ctx-menu hidden">
  <button data-act="add-task">Add Task</button>
  <button data-act="rename">Edit Subject</button>
  <button data-act="duplicate">Duplicate Subject</button>
  <button data-act="delete" class="danger">Delete Subject</button>
</div>

<!-- List ctx menu -->
<div id="listCtxMenu" class="ctx-menu hidden">
  <button data-act="new">New List</button>
  <button data-act="rename">Rename List</button>
  <button data-act="delete" class="danger">Delete List</button>
</div>

<!-- Profile setup card (first run) -->
<div id="profileOverlay" class="profile-overlay hidden">
  <div class="profile-card">
    <div class="profile-title">Who is this planner for?</div>
    <div class="profile-sub">Loop will customize your experience to make everything feel smoother, clearer, and better suited to you.</div>
    <div class="profile-options">
      <button type="button" class="profile-opt" data-profile="student">Student</button>
      <button type="button" class="profile-opt" data-profile="work">Work</button>
      <button type="button" class="profile-opt" data-profile="other">Other</button>
    </div>
  </div>
</div>

<!-- Tutorial overlay -->
<div id="tutorialOverlay" class="tutorial-overlay hidden">
  <div class="tutorial-dim"></div>
  <button class="tutorial-skip" id="tutorialSkip" type="button">Skip tutorial</button>
  <div class="tutorial-card" id="tutorialCard">
    <div class="tutorial-step" id="tutorialStep">1 of 8</div>
    <div class="tutorial-text" id="tutorialText"></div>
    <div class="tutorial-reel hidden" id="tutorialReel">
      <div class="reel-prev"></div>
      <div class="reel-current"></div>
      <div class="reel-next"></div>
    </div>
    <div class="tutorial-actions">
      <button class="btn-soft" id="tutorialBack" type="button">Back</button>
      <button class="btn" id="tutorialNext" type="button">Next</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modalOverlay" class="overlay hidden">
  <div class="modal">
    <button id="modalClose" class="modal-close" aria-label="Close dialog">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Calendar -->
<div id="calPopup" class="cal-popup hidden">
  <div class="cal-header">
    <button class="cal-nav" data-act="prev" type="button">‹</button>
    <div class="cal-title" id="calTitle"></div>
    <button class="cal-nav" data-act="next" type="button">›</button>
  </div>
  <div class="cal-weekdays">
    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <button class="cal-clear" id="calClear" type="button">Clear date</button>
</div>

<!-- Drop line + tooltip + toast -->
<div id="dropLine" class="hidden"></div>
<div id="tooltip" class="hidden"></div>
<div id="toast" class="toast hidden">
  <span id="toastMsg"></span>
  <button id="toastUndo">Undo</button>
</div>
<div id="addToast" class="add-toast"></div>

<script>
// ============================================================
// Constants used throughout (hoisted above ensureSeed/render)
// ============================================================
const DAY_MS = 24 * 60 * 60 * 1000;
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ============================================================
// Storage / migration
// ============================================================
const STORAGE_KEY = 'loopAppData';
let data = load();
ensureSeed();
applyTheme();

// Fresh launches always start on Today
let currentPage = 'today';
const PAGES = ['today', 'upcoming', 'subjects'];

// Selection / undo state
let selectedTaskIds = new Set();
let lastSelectedId = null;
let lastDeleted = null;
let toastTimer = null;
let isSelectMode = false;
let recentlyCreatedId = null;
// Multi-select tag filters. Empty Set = "All".
let currentFilters = new Set();
const TAG_OPTIONS = ['School', 'Tutor', 'Home'];

function load(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); }
  catch(e){ console.error(e); }
  return { lists:[], currentListId:null, settings:null };
}
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){ console.error(e); } }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function emptyDue(){ return { type:'none', date:'', frequency:'', day:'' }; }

function ensureSeed(){
  if (!data.lists) data.lists = [];
  if (data.lists.length === 0) data.lists.push({ id: uid(), name:'My List', subjects:[], sortMode:'smart' });
  data.lists.forEach(l => {
    if (!Array.isArray(l.subjects)) l.subjects = [];
    // Rename sort mode
    if (l.sortMode === 'custom') l.sortMode = 'manual';
    else if (l.sortMode === 'due') l.sortMode = 'smart';
    if (l.sortMode !== 'manual' && l.sortMode !== 'smart') l.sortMode = 'smart';
    l.subjects.forEach(migrateSubject);
  });
  if (!data.currentListId || !data.lists.find(l => l.id === data.currentListId)) data.currentListId = data.lists[0].id;
  if (!data.settings) data.settings = {};
  if (data.settings.darkMode === undefined) data.settings.darkMode = false;
  if (data.settings.notifications === undefined) data.settings.notifications = false;
  if (data.settings.menuBarMode === undefined) data.settings.menuBarMode = false;
  if (!data.settings.clearCompletedAfter) data.settings.clearCompletedAfter = 'weekly';
  if (!data.settings.currentPage) data.settings.currentPage = 'today';
  if (!data.settings.dateFormat) data.settings.dateFormat = detectDateFormat();
  if (!data.settings.dateDisplayStyle) {
    // Migrate existing users: keep their numeric/written choice if set on dateFormat
    if (data.settings.dateFormat === 'written') data.settings.dateDisplayStyle = 'written';
    else data.settings.dateDisplayStyle = 'written'; // new default
  }
  if (data.settings.enableSwipe === undefined) data.settings.enableSwipe = true;
  if (data.settings.enableArrowSort === undefined) data.settings.enableArrowSort = false;
  if (data.settings.animatedSuggestions === undefined) data.settings.animatedSuggestions = true;
  if (data.settings.profile === undefined) data.settings.profile = null; // 'student' | 'work' | 'other'
  if (data.settings.onboardingComplete === undefined) data.settings.onboardingComplete = false;
  save();
  // After migration, attempt auto-clear
  autoClearCompleted();
}

function detectDateFormat(){
  try {
    const lang = navigator.language || 'en-US';
    const region = (lang.split('-')[1] || '').toUpperCase();
    const ddmmRegions = ['AU','GB','UK','NZ','IE','IN','SG','MY','HK','ZA','KE','FR','DE','IT','ES','NL','PT','SE','NO','FI','DK','PL'];
    if (ddmmRegions.includes(region)) return 'DD/MM';
    if (region === 'US' || region === 'CA') return 'MM/DD';
    // Fallback: probe Intl
    const parts = new Intl.DateTimeFormat(lang).formatToParts(new Date(2020, 0, 5));
    const dayIdx = parts.findIndex(p => p.type === 'day');
    const monthIdx = parts.findIndex(p => p.type === 'month');
    if (dayIdx >= 0 && monthIdx >= 0 && dayIdx < monthIdx) return 'DD/MM';
    return 'MM/DD';
  } catch { return 'DD/MM'; }
}

// ===== Auto-capitalization for task / subject text =====
function cleanTitle(text){
  if (!text) return text;
  const trimmed = text.trim().replace(/\s+/g, ' ');
  if (!trimmed) return trimmed;
  return trimmed.split(' ').map(w => {
    if (!w) return w;
    if (/^p\d+$/i.test(w)) return w.toUpperCase();
    if (/^[A-Z0-9][A-Z0-9-]*$/.test(w) && /[A-Z]/.test(w) && w.length > 1) return w; // existing acronym
    if (/^[\d][\d\-/.]*$/.test(w)) return w; // numeric tokens like 24-36, 15/5
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function migrateSubject(sub){
  if (sub.open === undefined) sub.open = true;
  if (sub.showCompleted === undefined) sub.showCompleted = false;
  if (!Array.isArray(sub.tasks)) sub.tasks = [];
  if (sub.lastResetDate === undefined) sub.lastResetDate = '';
  // Flatten any sections back into tasks
  if (Array.isArray(sub.sections)) {
    sub.sections.forEach(sec => {
      if (Array.isArray(sec.tasks)) sub.tasks.push(...sec.tasks);
    });
    delete sub.sections;
  }
  // Subject due
  if (!sub.due || typeof sub.due !== 'object' || sub.due.type === undefined) {
    let due = emptyDue();
    if (sub.resetSchedule === 'Weekly' && sub.resetDay && sub.resetDay !== 'None')
      due = { type:'repeats', frequency:'weekly', day: sub.resetDay, date:'' };
    else if (sub.resetSchedule === 'Fortnightly' && sub.resetDay && sub.resetDay !== 'None')
      due = { type:'repeats', frequency:'fortnightly', day: sub.resetDay, date:'' };
    sub.due = due;
  }
  sub.tasks.forEach(migrateTask);
}
function migrateTask(t){
  if (t.title === undefined) t.title = '';
  if (t.notes === undefined) t.notes = '';
  if (t.done === undefined) t.done = false;
  if (t.expanded === undefined) t.expanded = false;
  if (t.lastCompletedDate === undefined) t.lastCompletedDate = '';
  if (t.completedAt === undefined) t.completedAt = null;
  if (!Array.isArray(t.tags) || t.tags.length === 0) t.tags = ['School'];
  if (t.important === undefined) t.important = false;
  if (!t.due || typeof t.due !== 'object' || t.due.type === undefined) {
    let due = emptyDue();
    if (t.manualDue) due = { type:'once', date: t.manualDue, frequency:'', day:'' };
    else if (t.repeatSchedule && t.repeatSchedule !== 'none') {
      const parts = String(t.repeatSchedule).split(':');
      if (parts.length === 2) due = { type:'repeats', frequency: parts[0]==='weekly'?'weekly':'fortnightly', day: parts[1], date:'' };
    }
    t.due = due;
  }
}

function getList(){ return data.lists.find(l => l.id === data.currentListId); }
function getDefaultSubject(){
  const list = getList();
  if (!list) return null;
  if (list.subjects.length === 0) {
    list.subjects.push({ id:uid(), name:'My Tasks', open:true, tasks:[], due:emptyDue(), lastResetDate:'', showCompleted:false });
    save();
  }
  return list.subjects[0];
}

// ============================================================
// Theme
// ============================================================
function applyTheme(){
  if (data.settings && data.settings.darkMode) document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}

// ============================================================
// Date helpers
// ============================================================
function startOfDay(d){ const r=new Date(d); r.setHours(0,0,0,0); return r; }
function todayLocal(){ return startOfDay(new Date()); }
function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function fromISO(s){ if(!s) return null; const p=s.split('-').map(Number); if(p.length!==3||p.some(isNaN)) return null; return new Date(p[0],p[1]-1,p[2]); }
function isValidISO(s){ if(!s) return true; if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const d=fromISO(s); if(!d) return false; return toISO(d)===s; }
function nextWeekday(idx, from, minDays=0){ const start=startOfDay(from); let diff=idx-start.getDay(); while(diff<minDays) diff+=7; const r=new Date(start); r.setDate(start.getDate()+diff); return r; }
function mostRecentPastWeekday(idx, from){ const start=startOfDay(from); let diff=start.getDay()-idx; if(diff<0) diff+=7; const r=new Date(start); r.setDate(start.getDate()-diff); return r; }
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO_SHORT  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Get an optional relative source ({unit, amount}) from a task or due-object.
function getRelativeSource(source){
  if (!source) return null;
  if (source.due && source.due.relativeUnit) return { unit: source.due.relativeUnit, amount: source.due.relativeAmount || 1 };
  if (source.relativeUnit) return { unit: source.relativeUnit, amount: source.relativeAmount || 1 };
  return null;
}
function formatRelativePast(rel, today, target){
  if (rel.unit === 'day') {
    const days = Math.abs(Math.round((startOfDay(target) - today) / DAY_MS));
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    return days + ' Days Ago';
  }
  if (rel.unit === 'week') {
    const days = Math.abs(Math.round((startOfDay(target) - today) / DAY_MS));
    const weeks = Math.max(1, Math.round(days / 7));
    return weeks === 1 ? 'Last Week' : weeks + ' Weeks Ago';
  }
  if (rel.unit === 'month') {
    const m = (today.getFullYear() - target.getFullYear()) * 12 + (today.getMonth() - target.getMonth());
    const months = Math.max(1, m);
    return months === 1 ? 'Last Month' : months + ' Months Ago';
  }
  if (rel.unit === 'year') {
    const y = today.getFullYear() - target.getFullYear();
    const years = Math.max(1, y);
    return years === 1 ? 'Last Year' : years + ' Years Ago';
  }
  return '';
}
function formatByStyle(d, style){
  if (style === 'numeric') {
    const fmt = (data && data.settings && data.settings.dateFormat) || 'DD/MM';
    const day = d.getDate(), month = d.getMonth()+1;
    if (fmt === 'MM/DD') return DOW_SHORT[d.getDay()] + ', ' + month + '/' + day;
    return DOW_SHORT[d.getDay()] + ', ' + day + '/' + month;
  }
  // written (default)
  return DOW_SHORT[d.getDay()] + ', ' + d.getDate() + ' ' + MO_SHORT[d.getMonth()];
}
function formatDue(iso, source){
  const d=fromISO(iso); if(!d) return '';
  const today=todayLocal();
  const diff=Math.round((startOfDay(d)-today)/DAY_MS);
  // Near future natural labels are always preserved.
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  // Past relative source overrides display style.
  const rel = getRelativeSource(source);
  if (diff < 0 && rel) return formatRelativePast(rel, today, d);
  if (diff === -1) return 'Yesterday';
  const style = (data && data.settings && data.settings.dateDisplayStyle) || 'written';
  if (diff < 0) {
    if (style === 'relative') return Math.abs(diff) + ' Days Ago';
    return formatByStyle(d, style);
  }
  // Future > 1 day
  if (style === 'numeric') return formatByStyle(d, 'numeric');
  return formatByStyle(d, 'written');
}
function formatDateLong(iso){
  const d=fromISO(iso); if(!d) return '';
  const today=todayLocal();
  const diff=Math.round((startOfDay(d)-today)/DAY_MS);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  return DOW_LONG[d.getDay()] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
}

// ============================================================
// Due / repeat / status
// ============================================================
function computeDueISO(item){
  if(!item || !item.due) return '';
  const d = item.due;
  if (d.type === 'none') return '';
  if (d.type === 'once') return d.date || '';
  if (d.type === 'repeats') {
    const today = todayLocal();
    // Honor optional start date — first occurrence is the start date if it's in future.
    if (d.startDate) {
      const start = fromISO(d.startDate);
      if (start && start > today) return d.startDate;
      if (start && d.frequency === 'daily') return toISO(today);
      if (start && (d.frequency === 'weekly' || d.frequency === 'fortnightly')) {
        const cycleDays = d.frequency === 'weekly' ? 7 : 14;
        const daysSince = Math.round((startOfDay(today) - startOfDay(start)) / DAY_MS);
        const cyclesPassed = Math.max(0, Math.floor(daysSince / cycleDays));
        const next = new Date(start);
        next.setDate(start.getDate() + (daysSince % cycleDays === 0 ? cyclesPassed * cycleDays : (cyclesPassed + 1) * cycleDays));
        return toISO(next);
      }
    }
    if (d.frequency === 'daily') return toISO(today);
    if (d.frequency === 'weekly' || d.frequency === 'fortnightly') {
      const idx = DAY_NAMES.indexOf(d.day);
      if (idx < 0) return '';
      if (d.frequency === 'weekly') return toISO(nextWeekday(idx, today, 0));
      const anchorISO = item.lastCompletedDate || item.lastResetDate || '';
      if (anchorISO) {
        const base = fromISO(anchorISO);
        if (base) { base.setDate(base.getDate()+14); return toISO(nextWeekday(idx, base, 0)); }
      }
      return toISO(nextWeekday(idx, today, 0));
    }
    return '';
  }
  return '';
}
function effectiveTaskDue(task, sub){
  const own = computeDueISO(task);
  if (own) return own;
  if (sub) { const sd = computeDueISO(sub); if (sd) return sd; }
  return '';
}
function dueLabelText(item){
  if (!item || !item.due) return '';
  const d = item.due;
  if (d.type === 'once' && d.date) return 'Due ' + formatDue(d.date);
  if (d.type === 'repeats') {
    if (d.frequency === 'daily') return 'Repeats daily';
    if (d.frequency === 'weekly') return 'Repeats weekly on ' + (d.day || '—');
    if (d.frequency === 'fortnightly') return 'Repeats fortnightly on ' + (d.day || '—');
    if (d.frequency === 'custom') return 'Custom repeat';
  }
  return '';
}
function statusFromDue(due, done){
  if (done) return 'done';
  if (!due) return 'normal';
  const d=fromISO(due); if(!d) return 'normal';
  const today=todayLocal();
  const diff=Math.round((startOfDay(d)-today)/DAY_MS);
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'soon';
  return 'normal';
}
function taskEndISO(task){ return (task && task.due && task.due.endDate) || null; }
function statusForTask(task, sub){
  if (task.done) return 'done';
  const startISO = effectiveTaskDue(task, sub); if (!startISO) return 'normal';
  const endISO = taskEndISO(task) || startISO;
  const start = fromISO(startISO), end = fromISO(endISO);
  if (!start) return 'normal';
  const today = todayLocal();
  const diffStart = Math.round((startOfDay(start) - today) / DAY_MS);
  const diffEnd   = Math.round((startOfDay(end) - today) / DAY_MS);
  if (diffEnd < 0) return 'overdue';
  if (diffStart <= 0 && diffEnd >= 0) return 'soon'; // active range / today
  if (diffStart <= 3) return 'soon';
  return 'normal';
}
function summaryStatus(tasks, sub){
  if (!tasks || tasks.length === 0) return { kind:'normal' };
  let overdue=0, soon=0, done=0;
  tasks.forEach(t => {
    const s = statusForTask(t, sub);
    if (s === 'overdue') overdue++;
    else if (s === 'soon') soon++;
    if (t.done) done++;
  });
  if (overdue > 0) return { kind:'overdue', count: overdue };
  if (soon > 0)    return { kind:'soon',    count: soon };
  if (done === tasks.length) return { kind:'done' };
  return { kind:'normal' };
}

// Urgency rank for a single task (Smart mode).
// 0 overdue · 1 today (or active range) · 2 tomorrow · 3 in 2 days
// 4 soon (3 days) · 5 future · 6 no due · 7 completed
// Important is NOT folded into this rank — comparators apply important after
// urgency so important Today never outranks Overdue.
function urgencyRankTask(task, sub){
  if (task.done) return 7;
  const eff = effectiveTaskDue(task, sub);
  if (!eff) return 6;
  const d = fromISO(eff); if (!d) return 6;
  const endISO = taskEndISO(task);
  const endD = endISO ? fromISO(endISO) : d;
  const today = todayLocal();
  const diffStart = Math.round((startOfDay(d) - today) / DAY_MS);
  const diffEnd   = endD ? Math.round((startOfDay(endD) - today) / DAY_MS) : diffStart;
  if (diffEnd < 0) return 0;                        // range ended (or single date in past)
  if (diffStart <= 0 && diffEnd >= 0) return 1;     // today / active range
  if (diffStart === 1) return 2;
  if (diffStart === 2) return 3;
  if (diffStart === 3) return 4;
  return 5;
}

// Compare two tasks within the same subject in Smart mode.
function compareTasksSmart(a, b, sub){
  const ar = urgencyRankTask(a, sub), br = urgencyRankTask(b, sub);
  if (ar !== br) return ar - br;
  // Important first within the same urgency group
  if (!!a.important !== !!b.important) return a.important ? -1 : 1;
  // Earlier date first
  const ad = effectiveTaskDue(a, sub) || '';
  const bd = effectiveTaskDue(b, sub) || '';
  if (ad && bd) { if (ad !== bd) return ad < bd ? -1 : 1; }
  else if (ad) return -1;
  else if (bd) return 1;
  return 0;
}

// Subject's best (most-urgent) rank, computed from filtered + incomplete tasks only.
// Returns { rank, important, date } where rank uses the same scale as
// urgencyRankTask plus 8 = fully completed subject (bottom).
function getSubjectBestRank(sub){
  const visible = sub.tasks.filter(t => taskMatchesFilter(t));
  const incomplete = visible.filter(t => !t.done);
  if (visible.length > 0 && incomplete.length === 0) return { rank: 8, important:false, date:'' };
  if (incomplete.length === 0) return { rank: 7, important:false, date:'' };
  let best = null;
  for (const t of incomplete) {
    const r = urgencyRankTask(t, sub);
    const d = effectiveTaskDue(t, sub) || '';
    const imp = !!t.important;
    if (!best
        || r < best.rank
        || (r === best.rank && imp && !best.important)
        || (r === best.rank && imp === best.important && d && (!best.date || d < best.date))) {
      best = { rank: r, important: imp, date: d };
    }
  }
  return best;
}

function compareSubjectsSmart(a, b){
  const ai = getSubjectBestRank(a), bi = getSubjectBestRank(b);
  if (ai.rank !== bi.rank) return ai.rank - bi.rank;
  if (ai.important !== bi.important) return ai.important ? -1 : 1;
  if (ai.date && bi.date) { if (ai.date !== bi.date) return ai.date < bi.date ? -1 : 1; }
  else if (ai.date) return -1;
  else if (bi.date) return 1;
  return 0;
}

// ============================================================
// Reset cycles + auto-clear
// ============================================================
function cycleDays(due){
  if (!due || due.type !== 'repeats') return 0;
  if (due.frequency === 'daily') return 1;
  if (due.frequency === 'weekly') return 7;
  if (due.frequency === 'fortnightly') return 14;
  return 0;
}
function pastAnchor(due, today){
  if (due.frequency === 'daily') return toISO(today);
  const idx = DAY_NAMES.indexOf(due.day);
  if (idx < 0) return toISO(today);
  return toISO(mostRecentPastWeekday(idx, today));
}
function checkResets(list){
  const today = todayLocal();
  list.subjects.forEach(sub => {
    if (sub.due && sub.due.type === 'repeats') {
      const cd = cycleDays(sub.due);
      if (cd > 0) {
        if (!sub.lastResetDate) sub.lastResetDate = pastAnchor(sub.due, today);
        else {
          const last = fromISO(sub.lastResetDate);
          if (last) {
            let next = new Date(startOfDay(last));
            next.setDate(next.getDate() + cd);
            if (today >= next) {
              while (true) { const f = new Date(next); f.setDate(f.getDate()+cd); if (today >= f) next = f; else break; }
              sub.tasks.forEach(t => { if (!t.due || t.due.type === 'none') { t.done=false; t.lastCompletedDate=''; t.completedAt=null; } });
              sub.lastResetDate = toISO(next);
            }
          }
        }
      }
    }
    sub.tasks.forEach(t => {
      if (!t.done) return;
      if (!t.due || t.due.type !== 'repeats') return;
      const cd = cycleDays(t.due); if (cd <= 0 || !t.lastCompletedDate) return;
      const last = fromISO(t.lastCompletedDate); if (!last) return;
      if ((today - startOfDay(last)) / DAY_MS >= cd) { t.done = false; t.lastCompletedDate=''; t.completedAt=null; }
    });
  });
}
function autoClearCompleted(){
  const setting = data && data.settings && data.settings.clearCompletedAfter;
  if (!setting || setting === 'never') return;
  const ONE_DAY = 24 * 60 * 60 * 1000;
  let cutoff;
  if (setting === 'daily') cutoff = ONE_DAY;
  else if (setting === 'weekly') cutoff = 7 * ONE_DAY;
  else if (setting === 'monthly') cutoff = 30 * ONE_DAY;
  else return;
  const now = Date.now();
  let removed = 0;
  data.lists.forEach(list => {
    list.subjects.forEach(sub => {
      const before = sub.tasks.length;
      sub.tasks = sub.tasks.filter(t => {
        if (!t.done) return true;
        if (!t.completedAt) return true;
        return (now - t.completedAt) < cutoff;
      });
      removed += before - sub.tasks.length;
    });
  });
  if (removed > 0) save();
}

// ============================================================
// Modal infrastructure
// ============================================================
const overlayEl = document.getElementById('modalOverlay');
const modalTitleEl = document.getElementById('modalTitle');
const modalBodyEl = document.getElementById('modalBody');
const modalActionsEl = document.getElementById('modalActions');
const modalCloseBtn = document.getElementById('modalClose');
let modalState = null;

// Recompute the body.overlay-open class based on any active overlay.
function syncOverlayLock(){
  const anyOpen =
    !overlayEl.classList.contains('hidden') ||
    (typeof calPopup !== 'undefined' && calPopup && !calPopup.classList.contains('hidden')) ||
    (typeof tutorialOverlay !== 'undefined' && tutorialOverlay && !tutorialOverlay.classList.contains('hidden')) ||
    (typeof profileOverlay !== 'undefined' && profileOverlay && !profileOverlay.classList.contains('hidden'));
  document.body.classList.toggle('overlay-open', anyOpen);
}
function closeModal(){
  overlayEl.classList.add('hidden');
  modalBodyEl.classList.remove('settings-body');
  modalBodyEl.innerHTML=''; modalActionsEl.innerHTML=''; modalState=null; syncOverlayLock();
}
function isModalOpen(){ return !overlayEl.classList.contains('hidden'); }
function setupActions(okLabel, cancelLabel, onOk, onCancel, danger){
  modalActionsEl.innerHTML = '';
  if (cancelLabel) {
    const c = document.createElement('button'); c.className='btn-soft'; c.textContent=cancelLabel;
    c.addEventListener('click', onCancel); modalActionsEl.appendChild(c);
  }
  const ok = document.createElement('button'); ok.className = danger?'btn-danger':'btn'; ok.textContent = okLabel;
  ok.addEventListener('click', onOk); modalActionsEl.appendChild(ok);
  return ok;
}
function openInputModal({ title, placeholder, initial, okLabel, onSave }){
  modalTitleEl.textContent = title;
  modalBodyEl.innerHTML = '';
  const input = document.createElement('input');
  input.type='text'; input.placeholder=placeholder||''; input.value=initial||'';
  modalBodyEl.appendChild(input);
  const onOk = () => { const v = input.value.trim(); if (!v) return; closeModal(); onSave(v); };
  const onCancel = () => closeModal();
  setupActions(okLabel||'Save','Cancel',onOk,onCancel);
  modalState = { onOk, onCancel };
  overlayEl.classList.remove('hidden'); syncOverlayLock();
  setTimeout(()=>{input.focus(); input.select();},0);
}
function openConfirmModal({ title, message, okLabel, danger, onConfirm }){
  modalTitleEl.textContent = title;
  modalBodyEl.innerHTML = '';
  const p = document.createElement('div'); p.className='modal-message'; p.textContent=message||'';
  modalBodyEl.appendChild(p);

function isCalOpen(){ return !calPopup.classList.contains('hidden'); }
function openCalendar(input, onSelect){
  hideListDropdown(); hideListCtxMenu(); hideSubjectCtxMenu(); hideTooltip();
  activeCalInput = input;
  const initialISO = input.value && isValidISO(input.value) ? input.value : '';
  const base = initialISO ? fromISO(initialISO) : new Date();
  calMonth = { year: base.getFullYear(), month: base.getMonth() };
  calSelectedISO = initialISO;
  calOnSelect = (iso) => { onSelect && onSelect(iso); closeCalendar(); };

}

function renderCalendar(){
  const { year, month } = calMonth;
  calTitle.textContent = MONTH_NAMES[month] + ' ' + year;
  calGrid.innerHTML = '';
  const first = new Date(year, month, 1);
  const dow = first.getDay();
  const startOffset = (dow === 0) ? 6 : dow - 1;
  const start = new Date(year, month, 1 - startOffset);
  const todayISO = toISO(new Date());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const cell = document.createElement('button');
    cell.type='button'; cell.className='cal-day'; cell.textContent=String(d.getDate());
    const iso = toISO(d); cell.dataset.iso = iso;
    if (d.getMonth() !== month) cell.classList.add('faded');
    if (iso === todayISO) cell.classList.add('today');
    if (iso === calSelectedISO) cell.classList.add('selected');
    cell.addEventListener('click', (e) => { e.stopPropagation(); calOnSelect && calOnSelect(iso); });
    calGrid.appendChild(cell);
  }

function makeDateInput(initialISO, onCommit){
  const wrap = document.createElement('div'); wrap.style.position='relative';
  const input = document.createElement('input');
  input.type='text'; input.placeholder='YYYY-MM-DD'; input.value=initialISO||''; input.autocomplete='off';
  wrap.appendChild(input);
  const open = () => { if (isCalOpen() && activeCalInput === input) return; openCalendar(input, (iso) => { input.value = iso; onCommit(iso); }); };
  input.addEventListener('focus', open);
  input.addEventListener('click', (e) => { e.stopPropagation(); open(); });
  input.addEventListener('blur', () => { const v=input.value.trim(); if(v===''||isValidISO(v)) onCommit(v); else input.value = initialISO||''; });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = input.value.trim();
      if (v === '' || isValidISO(v)) { onCommit(v); if (isCalOpen()) closeCalendar(); input.blur(); }
    }
  });
  return { wrap, input };
}

// Completion batching: acknowledge each click immediately, then wait for a
// short pause before removing every newly completed row and reflowing once.
const COMPLETION_IDLE_MS = 600;
const COMPLETION_LEAVE_MS = 480;
let activeCompletionBatch = null;

function activeTaskPositions(){
  if (typeof panelScroll !== 'function') return new Map();
  const host = panelScroll(currentPage); if (!host) return new Map();
  const out = new Map();
  host.querySelectorAll('[data-task-id]').forEach(el => {
    if (el.offsetParent === null) return;
    const id = el.dataset.taskId;
    if (id && !out.has(id)) out.set(id, el.getBoundingClientRect().top);
  });
  return out;
}
function renderWithTaskMotion(){
  const before = activeTaskPositions();
  render();
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = typeof panelScroll === 'function' ? panelScroll(currentPage) : null;
  if (!host) return;
  host.querySelectorAll('[data-task-id]').forEach(el => {
    const oldTop = before.get(el.dataset.taskId); if (oldTop == null) return;
    const dy = oldTop - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 1 || typeof el.animate !== 'function') return;
    el.animate([{ transform:`translateY(${dy}px)` }, { transform:'translateY(0)' }], {
      duration:260, easing:'cubic-bezier(.2,.7,.2,1)'
    });
  });
}
function undoCompletionBatch(batch){
  if (!batch || batch.cancelled) return;
  batch.cancelled = true;
  if (batch.timer) clearTimeout(batch.timer);
  if (batch.removeTimer) clearTimeout(batch.removeTimer);
  batch.records.forEach(r => {
    r.task.done = r.wasDone;
    r.task.completedAt = r.completedAt;
    r.task.lastCompletedDate = r.lastCompletedDate;
  });
  if (activeCompletionBatch === batch) activeCompletionBatch = null;
  save(); renderWithTaskMotion();
}
function collapseCompletedElement(el, duration){
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const cs = getComputedStyle(el);
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  Object.assign(el.style, {
    boxSizing:'border-box',
    overflow:'hidden',
    height:rect.height + 'px',
    marginTop:cs.marginTop,
    marginBottom:cs.marginBottom,
    paddingTop:cs.paddingTop,
    paddingBottom:cs.paddingBottom,
    borderTopWidth:cs.borderTopWidth,
    borderBottomWidth:cs.borderBottomWidth,
    opacity:cs.opacity,
    transform:'translateX(0)',
    transition:'none'
  });
  el.classList.add('completion-leaving');
  // Lock the measured start geometry before beginning the layout collapse.
  void el.offsetHeight;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ms = reduced ? 80 : duration;
    const move = 'cubic-bezier(.45,0,.55,1)';
    el.style.transition = [
      `height ${ms}ms ${move}`,
      `margin-top ${ms}ms ${move}`,
      `margin-bottom ${ms}ms ${move}`,
      `padding-top ${ms}ms ${move}`,
      `padding-bottom ${ms}ms ${move}`,
      `border-top-width ${ms}ms ${move}`,
      `border-bottom-width ${ms}ms ${move}`,
      `opacity ${Math.min(ms, 210)}ms ease`,
      reduced ? '' : `transform ${Math.min(ms, 260)}ms ${move}`
    ].filter(Boolean).join(', ');
    el.style.height = '0px';
    el.style.marginTop = '0px';
    el.style.marginBottom = '0px';
    el.style.paddingTop = '0px';
    el.style.paddingBottom = '0px';
    el.style.borderTopWidth = '0px';
    el.style.borderBottomWidth = '0px';
    el.style.opacity = '0';
    if (!reduced) el.style.transform = 'translateX(14px)';
  }));
}
function flushCompletionBatch(batch){
  if (!batch || batch.cancelled || batch.flushed) return;
  batch.flushed = true;
  if (activeCompletionBatch === batch) activeCompletionBatch = null;
  const host = typeof panelScroll === 'function' ? panelScroll(currentPage) : null;
  batch.records.forEach(r => {
    const el = host && host.querySelector('[data-task-id="' + r.task.id + '"]');
    if (el && el.classList.contains('completing')) collapseCompletedElement(el, COMPLETION_LEAVE_MS);
  });
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  batch.removeTimer = setTimeout(() => {
    if (!batch.cancelled) renderWithTaskMotion();
  }, (reduced ? 80 : COMPLETION_LEAVE_MS) + 50);
}
function queueTaskCompletion(task, el){
  if (!task || task.done) return;
  let batch = activeCompletionBatch;
  if (!batch) batch = activeCompletionBatch = { records:[], timer:null, removeTimer:null, flushed:false, cancelled:false };
  if (batch.records.some(r => r.task.id === task.id)) return;
  batch.records.push({
    task,
    wasDone:task.done,
    completedAt:task.completedAt,
    lastCompletedDate:task.lastCompletedDate
  });
  task.done = true;
  task.completedAt = Date.now();
  if (task.due && task.due.type === 'repeats') task.lastCompletedDate = toISO(new Date());
  save();
  if (el) el.classList.add('completing');
  if (batch.timer) clearTimeout(batch.timer);
  batch.timer = setTimeout(() => flushCompletionBatch(batch), COMPLETION_IDLE_MS);
  const n = batch.records.length;
  showToast(n + ' task' + (n === 1 ? '' : 's') + ' completed', () => undoCompletionBatch(batch));
}

const selBar = document.getElementById('selBar');

function updateSelectionBar(){
  if (isSelectMode) {

function setSelectMode(on){
  isSelectMode = !!on;
  if (!on) { selectedTaskIds.clear(); lastSelectedId = null; }
  updateSelectionBar();
  render();
}
function clearSelection(){ setSelectMode(false); }
selBar.addEventListener('click', (e) => {
  const act = e.target.dataset.act; if (!act) return;
  console.log('selection bar →', act);
  if (act === 'cancel') { setSelectMode(false); return; }
  if (act === 'complete') {
    const ids = [...selectedTaskIds];
    if (ids.length === 0) return;
    isSelectMode = false;
    selectedTaskIds.clear(); lastSelectedId = null;
    updateSelectionBar();
    document.querySelectorAll('.task.selected,.today-task.selected').forEach(el => el.classList.remove('selected'));
    ids.forEach(id => {
      const loc = findTask(id); if (!loc || loc.task.done) return;
      const el = document.querySelector('.page-panel[data-page="' + currentPage + '"] [data-task-id="' + id + '"]');
      queueTaskCompletion(loc.task, el);
    });
  } else if (act === 'delete') {
    const ids = [...selectedTaskIds];
    if (ids.length === 0) return;
    const removed = [];
    ids.forEach(id => {
      const loc = findTask(id); if (!loc) return;
      removed.push({ task: loc.task, parent: loc.parent, idx: loc.idx });
      loc.parent.splice(loc.idx, 1);
    });
    setSelectMode(false);
    save(); render();
    showToast(removed.length + ' task' + (removed.length===1?'':'s') + ' deleted', () => {
      removed.sort((a,b) => a.idx - b.idx);
      removed.forEach(r => r.parent.splice(Math.min(r.idx, r.parent.length), 0, r.task));
      save(); render();
    });
  } else if (act === 'duplicate') {
    const ids = [...selectedTaskIds];
    ids.forEach(id => {
      const loc = findTask(id); if (!loc) return;
      const copy = JSON.parse(JSON.stringify(loc.task)); copy.id = uid(); copy.completedAt = null;
      loc.parent.splice(loc.idx + 1, 0, copy);
    });
    setSelectMode(false);
    save(); render();
  } else if (act === 'move') {
    openMoveModal([...selectedTaskIds]);
  }
});

function handleTaskClickForSelection(e, task){
  if (e.metaKey || e.ctrlKey) {
    e.preventDefault(); e.stopPropagation();
    if (selectedTaskIds.has(task.id)) selectedTaskIds.delete(task.id);
    else selectedTaskIds.add(task.id);
    lastSelectedId = task.id;
    updateSelectionBar(); render();
    return true;
  }
  if (e.shiftKey && lastSelectedId) {
    e.preventDefault(); e.stopPropagation();
    const orderedIds = currentVisibleTaskIdsInOrder();
    const i1 = orderedIds.indexOf(lastSelectedId);
    const i2 = orderedIds.indexOf(task.id);
    if (i1 >= 0 && i2 >= 0) {
      const [s,end] = i1<i2 ? [i1,i2] : [i2,i1];
      for (let k=s;k<=end;k++) selectedTaskIds.add(orderedIds[k]);
    }
    lastSelectedId = task.id;
    updateSelectionBar(); render();
    return true;
  }
  return false;
}
function currentVisibleTaskIdsInOrder(){
  const list = getList(); if (!list) return [];
  const order = [];
  list.subjects.forEach(sub => sub.tasks.forEach(t => order.push(t.id)));
  return order;
}

// ----- Today page -----
function renderTodayPage(list){
  if (!list) return;
  const today = todayLocal();
  const items = [];
  list.subjects.forEach(sub => {
    sub.tasks.forEach(task => {
      if (task.done) return;
      if (!taskMatchesFilter(task)) return;
      const eff = effectiveTaskDue(task, sub); if (!eff) return;
      const d = fromISO(eff); if (!d) return;
      const endISO = taskEndISO(task);
      const endD = endISO ? fromISO(endISO) : d;
      const diffStart = Math.round((startOfDay(d) - today) / DAY_MS);
      const diffEnd   = endD ? Math.round((startOfDay(endD) - today) / DAY_MS) : diffStart;
      if (diffEnd < 0) items.push({ task, sub, eff, diff: diffStart });
      else if (diffStart <= 0 && diffEnd >= 0) items.push({ task, sub, eff, diff: 0 });
      else if (diffStart <= 2) items.push({ task, sub, eff, diff: diffStart });
    });
  });
  items.sort((a,b) => {
    if (a.diff !== b.diff) return a.diff - b.diff;
    const ai = a.task.important ? 0 : 1, bi = b.task.important ? 0 : 1;
    if (ai !== bi) return ai - bi;
    return (a.eff < b.eff ? -1 : (a.eff > b.eff ? 1 : 0));
  });
  if (items.length === 0) {
    const e = document.createElement('div'); e.className='empty';
    if (currentFilters && currentFilters.size > 0) {
      e.textContent = currentFilters.size === 1
        ? 'No ' + [...currentFilters][0] + ' tasks here'
        : 'No tasks match these filters';
    } else {
      e.textContent = 'Nothing urgent. Enjoy the breathing room.';
    }
    subjectsContainer.appendChild(e); return;
  }
  items.forEach(it => subjectsContainer.appendChild(renderTodayItem(it)));
}
