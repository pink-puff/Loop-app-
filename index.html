let parsing = {
  text:'', parsed:null,
  override:{ due: undefined, repeat: undefined, subject: undefined, task: undefined, time: undefined },
  manual:{ task:false, subject:false, due:false, repeat:false, time:false }
};

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function capitalize(s){ return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s; }

function parseTaskInput(text){
  const list = getList();
  const knownSubjects = list ? list.subjects.filter(s => s.name).map(s => ({ id:s.id, name:s.name })) : [];
  const result = { title:'', subject:null, due:null, dueEnd:null, dueLabel:'', repeat:'none', repeatDay:'', time:'' };

  // Pre-pass: expand common abbreviations on a working copy
  let preText = text;
  preText = preText.replace(/\b(tmr|tmrw)\b/gi, 'tomorrow');
  preText = preText.replace(/\bhw\b/gi, 'homework');
  // weekday short forms
  const dayShort = { mon:'Monday', tue:'Tuesday', tues:'Tuesday', wed:'Wednesday', weds:'Wednesday',
                     thu:'Thursday', thur:'Thursday', thurs:'Thursday',
                     fri:'Friday', sat:'Saturday', sun:'Sunday' };
  preText = preText.replace(/\b(mon|tues?|weds?|thur?s?|fri|sat|sun)\b/gi, m => dayShort[m.toLowerCase()] || m);
  // Period dot form: "p.6" → "p6"
  preText = preText.replace(/\bp\.(\d{1,2})\b/gi, 'p$1');

  let working = ' ' + preText + ' ';
  const today = todayLocal();

  // Period / lesson detection: "period 6", "p6", "lesson 6"
  let pm = working.match(/\b(?:period\s*(\d{1,2})|p(\d{1,2})|lesson\s*(\d{1,2}))\b/i);
  if (pm) {
    const num = pm[1] || pm[2] || pm[3];
    result.time = 'Period ' + num;
    working = working.replace(pm[0], ' ');
  }
  // Clock time: "at 11am", "11am", "at 3:30pm", "9:00 am", "noon", "midday"
  if (!result.time) {
    let tm = working.match(/\b(?:at\s+)?(\d{1,2}(?::\d{2})?\s*(?:am|pm))\b/i);
    if (tm) {
      result.time = tm[1].toLowerCase().replace(/\s+/g, '');
      working = working.replace(tm[0], ' ');
    } else {
      let nm = working.match(/\b(?:at\s+)?(noon|midday)\b/i);
      if (nm) {
        result.time = '12pm';
        working = working.replace(nm[0], ' ');
      }
    }
  }

  // ===== Date range detection (must run before single-date) =====
  const today0 = todayLocal();
  const dnamesArr = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  function nextWeekdayFor(name, fromDate){
    const idx = dnamesArr.indexOf(name.toLowerCase());
    if (idx < 0) return null;
    const start = new Date(fromDate); start.setHours(0,0,0,0);
    let diff = idx - start.getDay(); if (diff <= 0) diff += 7;
    const r = new Date(start); r.setDate(start.getDate()+diff); return r;
  }
  function parseSimpleDate(s){
    // Use existing tryDateExpr-like logic; reuse via small wrapper
    return tryDateExprStandalone(s);
  }
  function tryDateExprStandalone(s){
    s = s.trim().toLowerCase();
    if (!s) return null;
    if (s === 'today') return toISO(today0);
    if (s === 'tomorrow') { const d=new Date(today0); d.setDate(d.getDate()+1); return toISO(d); }
    let mm = s.match(/^(?:next\s+|this\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/);
    if (mm) {
      const idx = dnamesArr.indexOf(mm[1]);
      let diff = idx - today0.getDay(); if (diff <= 0) diff += 7;
      const d = new Date(today0); d.setDate(d.getDate()+diff); return toISO(d);
    }
    mm = s.match(/^([A-Za-z]+)\s+(\d{1,2})$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[1].toLowerCase()));
      const day = parseInt(mm[2]);
      if (monthIdx >= 0 && day >= 1 && day <= 31) {
        let y = today0.getFullYear(); let c = new Date(y, monthIdx, day);
        if (c < today0) c = new Date(y+1, monthIdx, day);
        return toISO(c);
      }
    }
    mm = s.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[2].toLowerCase()));
      const day = parseInt(mm[1]);
      if (monthIdx >= 0 && day >= 1 && day <= 31) {
        let y = today0.getFullYear(); let c = new Date(y, monthIdx, day);
        if (c < today0) c = new Date(y+1, monthIdx, day);
        return toISO(c);
      }
    }
    mm = s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
    if (mm) {
      const a = parseInt(mm[1]), b = parseInt(mm[2]);
      const fmt = (data.settings && data.settings.dateFormat) || 'DD/MM';
      const day   = fmt === 'MM/DD' ? b : a;
      const month = fmt === 'MM/DD' ? a : b;
      if (day >= 1 && day <= 31 && month >= 1 && month <= 12) {
        let year = mm[3] ? (mm[3].length === 2 ? 2000 + parseInt(mm[3]) : parseInt(mm[3])) : today0.getFullYear();
        let c = new Date(year, month-1, day);
        if (!mm[3] && c < today0) c = new Date(year+1, month-1, day);
        return toISO(c);
      }
    }
    return null;
  }

  // Range patterns
  let rangeMatch = null, rangeStart = null, rangeEnd = null;

  // "May 11-12" / "May 11 - 12" — same month, day-day
  rangeMatch = working.match(/\b([A-Za-z]+)\s+(\d{1,2})\s*[-–—]\s*(\d{1,2})\b/);
  if (rangeMatch) {
    rangeStart = parseSimpleDate(rangeMatch[1] + ' ' + rangeMatch[2]);
    rangeEnd   = parseSimpleDate(rangeMatch[1] + ' ' + rangeMatch[3]);
  }
  // "11/5-12/5" / "11-5 to 12-5"
  if (!rangeStart) {
    rangeMatch = working.match(/\b(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\s*[-–—]\s*(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/);
    if (rangeMatch) {
      rangeStart = parseSimpleDate(rangeMatch[1]);
      rangeEnd   = parseSimpleDate(rangeMatch[2]);
    }
  }
  // "May 11 to May 12" / "May 11 through 12" / "from May 11 to May 12"
  if (!rangeStart) {
    rangeMatch = working.match(/\b(?:from\s+)?([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\s+(?:to|through|until|-|–|—)\s+([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/i);
    if (rangeMatch) {
      rangeStart = parseSimpleDate(rangeMatch[1]);
      rangeEnd   = parseSimpleDate(rangeMatch[2]);
    }
  }
  // Weekday range: "Friday to Monday", "next Monday to Wednesday"
  if (!rangeStart) {
    rangeMatch = working.match(/\b(?:from\s+)?((?:next\s+|this\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\s+(?:to|through|until|-|–|—)\s+((?:next\s+|this\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b/i);
    if (rangeMatch) {
      const startISO = parseSimpleDate(rangeMatch[1]);
      if (startISO) {
        rangeStart = startISO;
        const startDate = fromISO(startISO);
        // End weekday must be ON or AFTER start date
        const endName = rangeMatch[2].toLowerCase().replace(/^(?:next|this)\s+/, '');
        const endIdx = dnamesArr.indexOf(endName);
        if (endIdx >= 0) {
          let diff = endIdx - startDate.getDay();
          if (diff < 0) diff += 7;
          if (diff === 0 && /^(next|this)\s+/i.test(rangeMatch[2])) diff = 7;
          const endDate = new Date(startDate); endDate.setDate(startDate.getDate() + diff);
          rangeEnd = toISO(endDate);
        }
      }
    }
  }
  if (rangeStart && rangeEnd && rangeStart <= rangeEnd) {
    result.due = rangeStart;
    result.dueEnd = rangeEnd;
    working = working.replace(rangeMatch[0], ' ');
  }
  // ===== End date range detection =====

  // Repeat with weekday: "weekly on Friday", "fortnightly on Sat"
  let m = working.match(/\b(weekly|fortnightly)\s+on\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
  if (m) {
    result.repeat = m[1].toLowerCase();
    result.repeatDay = capitalize(m[2]);
    working = working.replace(m[0], ' ');
  }
  // "every <day>"
  if (result.repeat === 'none') {
    m = working.match(/\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (m) {
      result.repeat = 'weekly';
      result.repeatDay = capitalize(m[1]);
      working = working.replace(m[0], ' ');
    }
  }
  // "every fortnight <day>" / "every fortnight Thursday"
  if (result.repeat === 'none') {
    let mfn = working.match(/\b(?:every\s+)?fortnight(?:ly)?\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (mfn) {
      result.repeat = 'fortnightly';
      result.repeatDay = capitalize(mfn[1]);
      working = working.replace(mfn[0], ' ');
    }
  }
  // generic repeat keywords
  if (result.repeat === 'none') {
    if (/\b(fortnightly|every\s*(?:2|two)\s*weeks?|every\s+fortnight)\b/i.test(working)) {
      result.repeat = 'fortnightly';
      working = working.replace(/\b(fortnightly|every\s*(?:2|two)\s*weeks?|every\s+fortnight)\b/i, ' ');
    } else if (/\b(weekly|every\s*week)\b/i.test(working)) {
      result.repeat = 'weekly';
      working = working.replace(/\b(weekly|every\s*week)\b/i, ' ');
    } else if (/\b(daily|every\s*day)\b/i.test(working)) {
      result.repeat = 'daily';
      working = working.replace(/\b(daily|every\s*day)\b/i, ' ');
    }
  }

  function tryDateExpr(expr){
    expr = expr.trim().toLowerCase();
    if (!expr) return null;
    if (expr === 'today') return toISO(today);
    if (expr === 'tomorrow') { const d=new Date(today); d.setDate(d.getDate()+1); return toISO(d); }
    if (expr === 'weekend') { let diff=6-today.getDay(); if(diff<0) diff+=7; const d=new Date(today); d.setDate(d.getDate()+diff); return toISO(d); }
    const dnames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    let mm = expr.match(/^(?:next\s+|this\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/);
    if (mm) {
      const idx = dnames.indexOf(mm[1]);
      let diff = idx - today.getDay(); if (diff <= 0) diff += 7;
      const d = new Date(today); d.setDate(d.getDate()+diff); return toISO(d);
    }
    mm = expr.match(/^([A-Za-z]+)\s+(\d{1,2})$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[1].toLowerCase()));
      const dayNum = parseInt(mm[2]);
      if (monthIdx >= 0 && dayNum >= 1 && dayNum <= 31) {
        let y = today.getFullYear(); let c = new Date(y, monthIdx, dayNum);
        if (c < today) c = new Date(y+1, monthIdx, dayNum);
        return toISO(c);
      }
    }
    mm = expr.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[2].toLowerCase()));
      const dayNum = parseInt(mm[1]);
      if (monthIdx >= 0 && dayNum >= 1 && dayNum <= 31) {
        let y = today.getFullYear(); let c = new Date(y, monthIdx, dayNum);
        if (c < today) c = new Date(y+1, monthIdx, dayNum);
        return toISO(c);
      }
    }
    // Numeric "5/6" / "5-6" / "15/5/2026" → respect dateFormat setting
    mm = expr.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
    if (mm) {
      const a = parseInt(mm[1]), b = parseInt(mm[2]);
      const fmt = (data.settings && data.settings.dateFormat) || 'DD/MM';
      const day   = fmt === 'MM/DD' ? b : a;
      const month = fmt === 'MM/DD' ? a : b;
      if (day >= 1 && day <= 31 && month >= 1 && month <= 12) {
        let year;
        if (mm[3]) year = mm[3].length === 2 ? 2000 + parseInt(mm[3]) : parseInt(mm[3]);
        else { year = today.getFullYear(); }
        let c = new Date(year, month-1, day);
        if (!mm[3] && c < today) c = new Date(year+1, month-1, day);
        return toISO(c);
      }
    }
    return null;
  }

  // "each <weekday>" → weekly + day
  if (result.repeat === 'none') {
    m = working.match(/\beach\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (m) {
      result.repeat = 'weekly';
      result.repeatDay = capitalize(m[1]);
      working = working.replace(m[0], ' ');
    }
  }
  // "due X" — accepts numeric, written, or named (supports "this", "next", "on")
  const dueRe = /\bdue\s+(?:on\s+|this\s+|next\s+)*((?:this\s+|next\s+)?(?:today|tomorrow|weekend|sunday|monday|tuesday|wednesday|thursday|friday|saturday)|[A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/i;
  m = working.match(dueRe);
  if (m) {
    const iso = tryDateExpr(m[1]);
    if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
  }
  // "on May 15"
  if (!result.due) {
    m = working.match(/\bon\s+([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/i);
    if (m) {
      const iso = tryDateExpr(m[1]);
      if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
    }
  }
  // bare keywords (also absorbs leading "on", "this", "next")
  if (!result.due) {
    m = working.match(/\b(?:on\s+)?((?:this\s+|next\s+)?(?:today|tomorrow|weekend|sunday|monday|tuesday|wednesday|thursday|friday|saturday))\b/i);
    if (m) {
      const iso = tryDateExpr(m[1]);
      if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
    }
  }
  // bare written or numeric date e.g. "May 20" / "15/5"
  if (!result.due) {
    m = working.match(/\b([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/);
    if (m) {
      const iso = tryDateExpr(m[1]);
      if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
    }
  }

  // Detect existing subject
  let detected = null, detectedMatch = null;
  for (const s of knownSubjects) {
    const re = new RegExp('\\b' + escapeRegex(s.name) + '\\b', 'i');
    const mm = working.match(re);
    if (mm) { detected = s; detectedMatch = mm[0]; break; }
  }
  if (detected) {
    result.subject = { id: detected.id, name: detected.name, isExisting: true };
    working = working.replace(new RegExp('\\b' + escapeRegex(detected.name) + '\\b', 'i'), ' ');
  } else {
    // Heuristic: first non-stopword token (any case) → new subject candidate (cleaned)
    const stop = new Set(['today','tomorrow','weekend','monday','tuesday','wednesday','thursday','friday','saturday','sunday','every','each','weekly','daily','fortnightly','due','next','on','the','a','an','and','or','for','with','at','in','of','i','my','do','buy','make','finish','study','review','read','write']);
    const tokens = text.split(/\s+/).filter(Boolean);
    for (const t of tokens) {
      const lc = t.toLowerCase();
      if (stop.has(lc)) continue;
      if (!/^[A-Za-z][A-Za-z]+$/.test(t)) continue; // skip numbers/punctuation
      // Only treat as subject if first word is capitalized OR clearly looks like a subject
      // For now: only if input begins with a capitalized word
      if (tokens[0] === t && /^[A-Z]/.test(t)) {
        const clean = cleanTitle(t);
        result.subject = { name: clean, isExisting: false, isNew: true };
        working = working.replace(new RegExp('\\b' + escapeRegex(t) + '\\b'), ' ');
      }
      break;
    }
  }

  // Strip any leftover orphan date/time scaffolding words
  working = working.replace(/\b(?:due|on|this|next|at|to|from|through|until)\b/gi, ' ');
  const rawTitle = working.replace(/\s+/g, ' ').trim();
  result.title = cleanTitle(rawTitle);
  if (result.due) {
    const d = fromISO(result.due);
    if (d) result.dueLabel = formatDue(result.due);
  }
  return result;
}

function effectiveParse(){
  const p = parsing.parsed || { title:'', subject:null, due:null, dueEnd:null, repeat:'none', repeatDay:'', time:'' };
  return {
    title:   parsing.override.task    !== undefined ? parsing.override.task    : p.title,
    subject: parsing.override.subject !== undefined ? parsing.override.subject : p.subject,
    due:     parsing.override.due     !== undefined ? parsing.override.due     : p.due,
    dueEnd:  parsing.override.dueEnd  !== undefined ? parsing.override.dueEnd  : (p.dueEnd || null),
    repeat:  parsing.override.repeat  !== undefined ? parsing.override.repeat  : p.repeat,
    repeatDay: p.repeatDay,
    time:    parsing.override.time    !== undefined ? parsing.override.time    : (p.time || '')
  };
}

function showParsePanel(){ parsePanel.classList.remove('hidden'); }
function hideParsePanel(){ parsePanel.classList.add('hidden'); }
function isParsePanelOpen(){ return !parsePanel.classList.contains('hidden'); }

function renderParsePanel(){
  const eff = effectiveParse();
  // Task name preview (don't clobber while user is editing it)
  if (!parsing.manual.task && document.activeElement !== parseTaskName) {
    parseTaskName.value = eff.title || (parsing.text.trim() || '');
  }
  // Subject (don't clobber while editing)
  if (!parsing.manual.subject && document.activeElement !== parseSubject) {
    if (eff.subject && eff.subject.isExisting) {
      parseSubject.value = eff.subject.name;
      parseSubjectSub.textContent = '';
    } else if (eff.subject && eff.subject.isNew) {
      parseSubject.value = eff.subject.name;
      parseSubjectSub.textContent = 'New subject will be created';
    } else {
      parseSubject.value = '';
      parseSubject.placeholder = 'Unsorted';
      parseSubjectSub.textContent = 'Task can be organized later';
    }
  }
  // Due
  if (eff.due && eff.dueEnd && eff.dueEnd !== eff.due) {
    parseDue.textContent = formatDue(eff.due) + ' – ' + formatDue(eff.dueEnd);
  } else if (eff.due) {
    parseDue.textContent = formatDue(eff.due);
  } else {
    parseDue.textContent = 'None';
  }
  // Time
  const timeRow = document.getElementById('parseTimeRow');
  const timeEl = document.getElementById('parseTime');
  if (eff.time) {
    timeRow.style.display = '';
    timeEl.textContent = eff.time;
  } else {
    timeRow.style.display = 'none';
  }
  // Quick due actives
  quickDueRow.querySelectorAll('button').forEach(b => {
    const k = b.dataset.due;
    let isActive = false;
    if (k === 'today' && eff.due === toISO(todayLocal())) isActive = true;
    else if (k === 'tomorrow') {
      const t = new Date(todayLocal()); t.setDate(t.getDate()+1);
      if (eff.due === toISO(t)) isActive = true;
    } else if (k === 'weekend') {
      const t = todayLocal(); let diff = 6 - t.getDay(); if (diff < 0) diff += 7;
      const d = new Date(t); d.setDate(d.getDate()+diff);
      if (eff.due === toISO(d)) isActive = true;
    } else if (k === 'none' && !eff.due) isActive = true;
    b.classList.toggle('active', isActive);
  });
  // Repeats
  repeatRow.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.rep === (eff.repeat || 'none'));
  });
}

}

function commitTypingBar(){
  const text = typingInput.value.trim();
  if (!text) { hideParsePanel(); return; }
  // ensure parsed reflects current text
  parsing.text = text;
  parsing.parsed = parseTaskInput(text);
  const eff = effectiveParse();
  const list = getList(); if (!list) return;

  // Resolve target subject
  let targetSub;
  if (eff.subject && eff.subject.isExisting) {
    targetSub = list.subjects.find(s => s.id === eff.subject.id);
  } else if (eff.subject && eff.subject.isNew && eff.subject.name) {
    targetSub = { id:uid(), name: eff.subject.name, open:true, tasks:[], due:emptyDue(), lastResetDate:'', showCompleted:false };
    list.subjects.push(targetSub);
  } else {
    targetSub = list.subjects.find(s => (s.name||'').toLowerCase() === 'unsorted');
    if (!targetSub) {
      targetSub = { id:uid(), name:'Unsorted', open:true, tasks:[], due:emptyDue(), lastResetDate:'', showCompleted:false };
      list.subjects.push(targetSub);
    }
  }

  // Build due
  let due = emptyDue();
  if (eff.repeat && eff.repeat !== 'none') {
    due = { type:'repeats', frequency: eff.repeat, day:'', date:'' };
    if (eff.repeat === 'weekly' || eff.repeat === 'fortnightly') {
      if (eff.repeatDay) due.day = capitalize(eff.repeatDay);
      else if (eff.due) {
        const d = fromISO(eff.due);
        if (d) due.day = DAY_NAMES[d.getDay()];
      } else {
        due.day = DAY_NAMES[todayLocal().getDay()];
      }
    }
  } else if (eff.due) {
    due = { type:'once', date: eff.due, frequency:'', day:'' };
    if (eff.dueEnd && eff.dueEnd !== eff.due) due.endDate = eff.dueEnd;
  }

  const taskTitle = cleanTitle((eff.title || text).trim());
  if (!taskTitle) return;
  const notesPrefix = eff.time ? eff.time + '\n' : '';
  const newTaskId = uid();
  targetSub.tasks.push({
    id: newTaskId, title: taskTitle, notes: notesPrefix, done:false, expanded:false,
    due, lastCompletedDate:'', completedAt: null
  });
  // Clean subject names too (only newly created)
  if (targetSub && targetSub.name) targetSub.name = cleanTitle(targetSub.name);
  console.log('task created via typing →', taskTitle, '/ subj:', targetSub.name, '/ due:', JSON.stringify(due), '/ time:', eff.time);
  save();
  // Build "Added to …" toast message
  showAddedToast(buildAddedMessage(due, targetSub));
  // Mark for appear animation; clear after one render
  recentlyCreatedId = newTaskId;
  setTimeout(() => { recentlyCreatedId = null; }, 400);
  // Clear and refocus for rapid entry
  clearTypingBar();
  render();
  setTimeout(() => typingInput.focus(), 0);
}

function buildAddedMessage(due, sub){
  // Where did the task land?
  const today = todayLocal();
  if (due.type === 'once' && due.date) {
    const d = fromISO(due.date);
    const endISO = due.endDate;
    const diff = Math.round((startOfDay(d) - today) / DAY_MS);
    if (diff <= 0 || (endISO && fromISO(endISO) >= today)) return 'Added to Today';
    if (diff <= 2) return 'Added to Today';
    return 'Added to Upcoming · ' + (endISO && endISO !== due.date ? formatDue(due.date) + ' – ' + formatDue(endISO) : formatDue(due.date));
  }
  if (due.type === 'repeats') {
    return 'Added to ' + (sub ? sub.name : 'Unsorted');
  }
  return 'Added to ' + (sub ? sub.name : 'Unsorted');
}

// ===== Placeholder typing animation =====
const PH_PREFIX = 'Add task: ';
let phIdx = 0, phPos = 0, phMode = 'typing';
function phTick(){
  // Off if disabled in settings
  const animOff = !data.settings || data.settings.animatedSuggestions === false;
  if (animOff) {
    typingInput.placeholder = PH_PREFIX;
    setTimeout(phTick, 1500);
    return;
  }
  // Stop ONLY when focused / has text / parse panel is open. Hover does NOT stop.
  if (document.activeElement === typingInput || typingInput.value !== '' || isParsePanelOpen()) {
    typingInput.placeholder = PH_PREFIX;
    setTimeout(phTick, 500);
    return;
  }
  const target = PLACEHOLDERS[phIdx];
  let delay = 20;
  if (phMode === 'typing') {
    phPos++;
    typingInput.placeholder = PH_PREFIX + target.slice(0, phPos);
    if (phPos >= target.length) { phMode = 'pause'; delay = 800; }
  } else if (phMode === 'pause') {
    phMode = 'deleting'; delay = 30;
  } else {
    phPos--;
    typingInput.placeholder = PH_PREFIX + target.slice(0, phPos);
    if (phPos <= 0) { phMode = 'typing'; phIdx = (phIdx + 1) % PLACEHOLDERS.length; delay = 180; }
    else delay = 10;
  }
  setTimeout(phTick, delay);
}
setTimeout(phTick, 400);

document.addEventListener('touchend', (e) => {

function attachSubjectDragHandlers(wrap, sub){
  wrap.addEventListener('dragstart', (e) => { e.stopPropagation(); startDrag(e, { kind:'subject', subjectId: sub.id }, wrap); });
  wrap.addEventListener('dragend', endDrag);
  wrap.addEventListener('dragover', (e) => {
    if (!dragInfo || dragInfo.kind !== 'subject' || dragInfo.subjectId === sub.id) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    showDropLine(r, e.clientY < r.top + r.height/2);
  });
  wrap.addEventListener('drop', (e) => {
    if (!dragInfo || dragInfo.kind !== 'subject') return;
    e.preventDefault();
    const list = getList();
    const fromIdx = list.subjects.findIndex(s => s.id === dragInfo.subjectId);
    let toIdx = list.subjects.findIndex(s => s.id === sub.id);
    if (fromIdx < 0 || toIdx < 0) return;
    const r = wrap.getBoundingClientRect();
    const above = e.clientY < r.top + r.height/2;
    const [moved] = list.subjects.splice(fromIdx, 1);
    if (fromIdx < toIdx) toIdx--;
    list.subjects.splice(above ? toIdx : toIdx+1, 0, moved);
    endDrag(); save(); render();
  });
}
function attachTaskDragHandlers(el, sub, task){
  // dragstart now lives on the grip handle; only register drop targets here
  el.addEventListener('dragover', (e) => {
    if (!dragInfo) return;
    if (dragInfo.kind !== 'task' && dragInfo.kind !== 'group') return;
    if (dragInfo.kind === 'task' && dragInfo.taskId === task.id) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    showDropLine(r, e.clientY < r.top + r.height/2);
  });
  el.addEventListener('drop', (e) => {
    if (!dragInfo) return;
    if (dragInfo.kind === 'group') {
      e.preventDefault(); e.stopPropagation();
      // Move all selected tasks into this subject (after the dropped target)
      const ids = dragInfo.taskIds || [];
      const target = sub.tasks;
      let toIdx = target.findIndex(t => t.id === task.id);
      const r = el.getBoundingClientRect();
      const above = e.clientY < r.top + r.height/2;
      const insertAt = above ? toIdx : toIdx + 1;
      const moved = [];
      ids.forEach(id => {
        const loc = findTask(id); if (!loc) return;
        loc.parent.splice(loc.idx, 1);
        moved.push(loc.task);
      });
      // Re-find target sub since indices shifted
      target.splice(Math.min(insertAt, target.length), 0, ...moved);
      setSelectMode(false);
      endDrag(); save(); render();
      return;
    }
    if (dragInfo.kind !== 'task' || dragInfo.taskId === task.id) return;
    e.preventDefault(); e.stopPropagation();
    const fromLoc = findTask(dragInfo.taskId); if (!fromLoc) return;
    const target = sub.tasks;
    let toIdx = target.findIndex(t => t.id === task.id);
    const r = el.getBoundingClientRect();
    const above = e.clientY < r.top + r.height/2;
    fromLoc.parent.splice(fromLoc.idx, 1);
    if (fromLoc.parent === target && fromLoc.idx < toIdx) toIdx--;
    target.splice(above ? toIdx : toIdx+1, 0, fromLoc.task);
    endDrag(); save(); render();
  });
}

// Group drag start — set drag image to a small badge
function startGroupDrag(e, taskIds){
  // Force select mode is on
  dragInfo = { kind:'group', taskIds, srcEl: null };
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', JSON.stringify({kind:'group', count:taskIds.length})); } catch{}
  // Apply dragging class to all selected
  taskIds.forEach(id => {
    const tEl = document.querySelector('[data-task-id="' + id + '"]');
    if (tEl) tEl.classList.add('dragging');
  });
  // Create badge as drag image
  const badge = document.createElement('div');
  badge.className = 'drag-badge';
  badge.textContent = taskIds.length + (taskIds.length === 1 ? ' task' : ' tasks');
  document.body.appendChild(badge);
  try { e.dataTransfer.setDragImage(badge, 12, 12); } catch{}
  setTimeout(() => badge.remove(), 0);
}

document.addEventListener('click', (e) => {
  if (isCalOpen() && !calPopup.contains(e.target) && e.target !== activeCalInput) closeCalendar();
  if (!listDropdownEl.classList.contains('hidden') && !listDropdownEl.contains(e.target) && e.target !== listCurrentEl) hideListDropdown();
  if (!listCtxMenu.classList.contains('hidden') && !listCtxMenu.contains(e.target)) hideListCtxMenu();
  if (!ctxMenu.classList.contains('hidden') && !ctxMenu.contains(e.target)) hideSubjectCtxMenu();
  if (tooltipAnchor && !tooltipEl.contains(e.target) && e.target !== tooltipAnchor) hideTooltip();
  // Parse panel: hide when clicking outside the typing bar / panel (keep input value)
  if (isParsePanelOpen() && !typingBar.contains(e.target) && !parsePanel.contains(e.target)) {
    hideParsePanel();
  }
  // Task panel outside-click → commit
  const o = getOpenTask();
  if (o) {
    const taskEl = document.querySelector('[data-task-id="' + o.task.id + '"]');
    if (taskEl
        && !taskEl.contains(e.target)
        && !calPopup.contains(e.target)
        && !overlayEl.contains(e.target)
        && !ctxMenu.contains(e.target)
        && !listCtxMenu.contains(e.target)
        && !listDropdownEl.contains(e.target)) {
      commitOpenTaskPanel();
      return;
    }
  }
  // Subject edit panel outside-click → save & close
  const list = getList();
  if (list) {
    for (const sub of list.subjects) {
      if (sub.editing) {
        const subEl = document.querySelector('[data-subject-id="' + sub.id + '"]');
        if (subEl && !subEl.contains(e.target) && !calPopup.contains(e.target) && !overlayEl.contains(e.target)) {
          const panel = subEl.querySelector('.edit-panel');
          if (panel) {
            const nameI = panel.querySelector('[data-f="name"]');
            const t = panel.querySelector('[data-f="sub-type"]').value;
            const due = { type:t, date:'', frequency:'', day:'' };
            if (t === 'once') due.date = (panel.querySelector('[data-f="sub-date-host"] input').value || '');
            if (t === 'repeats') {
              due.frequency = panel.querySelector('[data-f="sub-frequency"]').value;
              if (due.frequency === 'weekly' || due.frequency === 'fortnightly') due.day = panel.querySelector('[data-f="sub-day"]').value || '';
            }
            const changed = JSON.stringify(sub.due) !== JSON.stringify(due);
            if ((nameI.value || '').trim()) sub.name = nameI.value.trim();
            sub.due = due;
            if (changed) sub.lastResetDate = '';
          }
          sub.editing = false; save(); render();
          return;
        }
      }
    }
  }
  // Click outside any task → clear selection (unless modifier)
  if (selectedTaskIds.size > 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    const inTask = e.target.closest && e.target.closest('[data-task-id]');
    const inSel = selBar.contains(e.target);
    const inOverlay = overlayEl.contains(e.target);
    if (!inTask && !inSel && !inOverlay) clearSelection();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && isModalOpen() && modalState && !modalState.isSettings) {
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if (modalState.onOk) modalState.onOk();
    return;
  }
  if (e.key === 'Escape') {
    if (isCalOpen()) { closeCalendar(); return; }
    if (isModalOpen()) { (modalState && modalState.onCancel) ? modalState.onCancel() : closeModal(); return; }
    if (tooltipAnchor) { hideTooltip(); return; }
    if (!ctxMenu.classList.contains('hidden')) { hideSubjectCtxMenu(); return; }
    if (!listCtxMenu.classList.contains('hidden')) { hideListCtxMenu(); return; }
    if (!listDropdownEl.classList.contains('hidden')) { hideListDropdown(); return; }
    if (selectedTaskIds.size > 0) { clearSelection(); return; }
    if (getOpenTask()) { cancelOpenTaskPanel(); return; }
    const list = getList();
    if (list) {
      let any=false;
      list.subjects.forEach(sub => { if (sub.editing) { sub.editing=false; any=true; } });
      if (any) { save(); render(); }
    }
    return;
  }
  // Arrow keys: only switch sort mode (gated by setting; only on Organize page)
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (!data.settings.enableArrowSort) return;
    if (currentPage !== 'subjects') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (isModalOpen() || isCalOpen() || isParsePanelOpen()) return;
    if (isSelectMode || dragInfo) return;
    const list = getList(); if (!list) return;
    const target = e.key === 'ArrowLeft' ? 'manual' : 'smart';
    if (list.sortMode === target) return; // no edge wrap
    const btn = sortToggleHost.querySelector('button[data-sort="' + target + '"]');
    if (btn) { btn.click(); return; }
    list.sortMode = target; save(); render();
  }
});

// ============================================================
// Sort-change feedback toast (typing-style)
// ============================================================
let sortFeedbackEl = null;
function showSortFeedback(text){
  if (sortFeedbackEl) { sortFeedbackEl.remove(); sortFeedbackEl = null; }
  const el = document.createElement('div');
  el.className = 'sort-feedback';
  document.body.appendChild(el);
  sortFeedbackEl = el;
  let i = 0;
  function tick(){
    if (sortFeedbackEl !== el) return; // a newer toast replaced this one
    el.textContent = text.slice(0, i);
    if (i < text.length) { i++; setTimeout(tick, 22); }
    else {
      setTimeout(() => {
        if (sortFeedbackEl !== el) return;
        el.style.opacity = '0';
        setTimeout(() => { if (el.parentNode) el.remove(); if (sortFeedbackEl === el) sortFeedbackEl = null; }, 280);
      }, 1200);
    }
  }
  tick();
}

// ============================================================
// Trackpad two-finger swipe → page navigation
// ============================================================
let swipeCooldown = false;
let wheelAccumX = 0;
let wheelTimer = null;
document.addEventListener('wheel', (e) => {
  if (!data.settings.enableSwipe) return;
  if (swipeCooldown) return;
  // Skip when any input/calendar/modal/panel is open
  if (isModalOpen() || isCalOpen()) return;
  if (isParsePanelOpen()) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if (isSelectMode) return;
  if (dragInfo) return;
  // Heuristic: horizontal trackpad scroll
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) * 1.2) { wheelAccumX = 0; return; }
  wheelAccumX += e.deltaX;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => { wheelAccumX = 0; }, 200);
  if (Math.abs(wheelAccumX) > 80) {
    swipeCooldown = true;
    setTimeout(() => { swipeCooldown = false; }, 600);
    if (wheelAccumX > 0) nextPage();
    else prevPage();
    wheelAccumX = 0;
  }
}, { passive: true });

// Auto-exit selection mode if user focuses the typing bar
typingInput.addEventListener('focus', () => {
  if (isSelectMode) {
    console.log('typing bar focused → exit selection mode');
    setSelectMode(false);
  }
});

// ============================================================
// Global type-to-add: route keystrokes to typing bar when no input focused
// ============================================================
document.addEventListener('keydown', (e) => {
  // Only normal printable characters (length 1) or Backspace
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length !== 1) return;
  // Skip if focus is already in an input/textarea/contenteditable
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
  // Skip if any panel/menu/calendar/modal is open or selection is active
  if (isModalOpen() || isCalOpen()) return;
  if (!ctxMenu.classList.contains('hidden')
      || !listCtxMenu.classList.contains('hidden') || !listDropdownEl.classList.contains('hidden')) return;
  if (isSelectMode) return;
  // Focus typing bar and let the keystroke land there
  e.preventDefault();
  typingInput.focus();
  typingInput.value += e.key;
  typingInput.dispatchEvent(new Event('input'));
});

// First paint
render();
</script>
