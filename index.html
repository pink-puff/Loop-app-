    if (dragInfo.kind === 'task' && dragInfo.taskId === task.id) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    showDropLine(r, e.clientY < r.top + r.height/2);
  });
  el.addEventListener('drop', (e) => {
    if (!dragInfo) return;
    if (dragInfo.kind === 'group') {
      e.preventDefault(); e.stopPropagation();
      // Move all selected tasks into this subject (after the dropped target)
      const ids = dragInfo.taskIds || [];
      const target = sub.tasks;
      let toIdx = target.findIndex(t => t.id === task.id);
      const r = el.getBoundingClientRect();
      const above = e.clientY < r.top + r.height/2;
      const insertAt = above ? toIdx : toIdx + 1;
      const moved = [];
      ids.forEach(id => {
        const loc = findTask(id); if (!loc) return;
        loc.parent.splice(loc.idx, 1);
        moved.push(loc.task);
      });
      // Re-find target sub since indices shifted
      target.splice(Math.min(insertAt, target.length), 0, ...moved);
      setSelectMode(false);
      endDrag(); save(); render();
      return;
    }
    if (dragInfo.kind !== 'task' || dragInfo.taskId === task.id) return;
    e.preventDefault(); e.stopPropagation();
    const fromLoc = findTask(dragInfo.taskId); if (!fromLoc) return;
    const target = sub.tasks;
    let toIdx = target.findIndex(t => t.id === task.id);
    const r = el.getBoundingClientRect();
    const above = e.clientY < r.top + r.height/2;
    fromLoc.parent.splice(fromLoc.idx, 1);
    if (fromLoc.parent === target && fromLoc.idx < toIdx) toIdx--;
    target.splice(above ? toIdx : toIdx+1, 0, fromLoc.task);
    endDrag(); save(); render();
  });
}

// Group drag start — set drag image to a small badge
function startGroupDrag(e, taskIds){
  // Force select mode is on
  dragInfo = { kind:'group', taskIds, srcEl: null };
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', JSON.stringify({kind:'group', count:taskIds.length})); } catch{}
  // Apply dragging class to all selected
  taskIds.forEach(id => {
    const tEl = document.querySelector('[data-task-id="' + id + '"]');
    if (tEl) tEl.classList.add('dragging');
  });
  // Create badge as drag image
  const badge = document.createElement('div');
  badge.className = 'drag-badge';
  badge.textContent = taskIds.length + (taskIds.length === 1 ? ' task' : ' tasks');
  document.body.appendChild(badge);
  try { e.dataTransfer.setDragImage(badge, 12, 12); } catch{}
  setTimeout(() => badge.remove(), 0);
}

// ============================================================
// Global outside-click + Escape + arrow keys
// ============================================================
document.addEventListener('click', (e) => {
  if (isCalOpen() && !calPopup.contains(e.target) && e.target !== activeCalInput) closeCalendar();
  if (!listDropdownEl.classList.contains('hidden') && !listDropdownEl.contains(e.target) && e.target !== listCurrentEl) hideListDropdown();
  if (!listCtxMenu.classList.contains('hidden') && !listCtxMenu.contains(e.target)) hideListCtxMenu();
  if (!ctxMenu.classList.contains('hidden') && !ctxMenu.contains(e.target)) hideSubjectCtxMenu();
  if (tooltipAnchor && !tooltipEl.contains(e.target) && e.target !== tooltipAnchor) hideTooltip();
  // (Parse panel close is handled via mousedown/mouseup pair below so text
  //  selections that start inside the bar/panel don't close it.)
  // Task panel outside-click → commit
  const o = getOpenTask();
  if (o) {
    const taskEl = document.querySelector('[data-task-id="' + o.task.id + '"]');
    if (taskEl
        && !taskEl.contains(e.target)
        && !calPopup.contains(e.target)
        && !overlayEl.contains(e.target)
        && !ctxMenu.contains(e.target)
        && !listCtxMenu.contains(e.target)
        && !listDropdownEl.contains(e.target)) {
      commitOpenTaskPanel();
      return;
    }
  }
  // Subject edit panel outside-click → save & close
  const list = getList();
  if (list) {
    for (const sub of list.subjects) {
      if (sub.editing) {
        const subEl = document.querySelector('[data-subject-id="' + sub.id + '"]');
        if (subEl && !subEl.contains(e.target) && !calPopup.contains(e.target) && !overlayEl.contains(e.target)) {
          const panel = subEl.querySelector('.edit-panel');
          if (panel) {
            const nameI = panel.querySelector('[data-f="name"]');
            const t = panel.querySelector('[data-f="sub-type"]').value;
            const due = { type:t, date:'', frequency:'', day:'' };
            if (t === 'once') due.date = (panel.querySelector('[data-f="sub-date-host"] input').value || '');
            if (t === 'repeats') {
              due.frequency = panel.querySelector('[data-f="sub-frequency"]').value;
              if (due.frequency === 'weekly' || due.frequency === 'fortnightly') due.day = panel.querySelector('[data-f="sub-day"]').value || '';
            }
            const changed = JSON.stringify(sub.due) !== JSON.stringify(due);
            if ((nameI.value || '').trim()) sub.name = nameI.value.trim();
            sub.due = due;
            if (changed) sub.lastResetDate = '';
          }
          sub.editing = false; save(); render();
          return;
        }
      }
    }
  }
  // Click outside any task → clear selection (unless modifier)
  if (selectedTaskIds.size > 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    const inTask = e.target.closest && e.target.closest('[data-task-id]');
    const inSel = selBar.contains(e.target);
    const inOverlay = overlayEl.contains(e.target);
    if (!inTask && !inSel && !inOverlay) clearSelection();
  }
});

document.addEventListener('contextmenu', (e) => {
  if (!ctxMenu.classList.contains('hidden') && !ctxMenu.contains(e.target)) hideSubjectCtxMenu();
  if (!listCtxMenu.classList.contains('hidden') && !listCtxMenu.contains(e.target)) hideListCtxMenu();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && isModalOpen() && modalState && !modalState.isSettings) {
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if (modalState.onOk) modalState.onOk();
    return;
  }
  if (e.key === 'Escape') {
    if (isCalOpen()) { closeCalendar(); return; }
    if (isModalOpen()) { (modalState && modalState.onCancel) ? modalState.onCancel() : closeModal(); return; }
    if (tooltipAnchor) { hideTooltip(); return; }
    if (!ctxMenu.classList.contains('hidden')) { hideSubjectCtxMenu(); return; }
    if (!listCtxMenu.classList.contains('hidden')) { hideListCtxMenu(); return; }
    if (!listDropdownEl.classList.contains('hidden')) { hideListDropdown(); return; }
    if (selectedTaskIds.size > 0) { clearSelection(); return; }
    if (getOpenTask()) { cancelOpenTaskPanel(); return; }
    const list = getList();
    if (list) {
      let any=false;
      list.subjects.forEach(sub => { if (sub.editing) { sub.editing=false; any=true; } });
      if (any) { save(); render(); }
    }
    return;
  }
  // Arrow keys: only switch sort mode (gated by setting; only on Organize page)
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (!data.settings.enableArrowSort) return;
    if (currentPage !== 'subjects') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (isModalOpen() || isCalOpen() || isParsePanelOpen()) return;
    if (isSelectMode || dragInfo) return;
    const list = getList(); if (!list) return;
    const target = e.key === 'ArrowLeft' ? 'manual' : 'smart';
    if (list.sortMode === target) return; // no edge wrap
    const btn = sortToggleHost.querySelector('button[data-sort="' + target + '"]');
    if (btn) { btn.click(); return; }
    list.sortMode = target; save(); render();
  }
});

// ============================================================
// Sort-change feedback toast (typing-style)
// ============================================================
let sortFeedbackEl = null;
function showSortFeedback(text){
  if (sortFeedbackEl) { sortFeedbackEl.remove(); sortFeedbackEl = null; }
  const el = document.createElement('div');
  el.className = 'sort-feedback';
  document.body.appendChild(el);
  sortFeedbackEl = el;
  let i = 0;
  function tick(){
    if (sortFeedbackEl !== el) return; // a newer toast replaced this one
    el.textContent = text.slice(0, i);
    if (i < text.length) { i++; setTimeout(tick, 22); }
    else {
      setTimeout(() => {
        if (sortFeedbackEl !== el) return;
        el.style.opacity = '0';
        setTimeout(() => { if (el.parentNode) el.remove(); if (sortFeedbackEl === el) sortFeedbackEl = null; }, 280);
      }, 1200);
    }
  }
  tick();
}

// ============================================================
// Trackpad two-finger swipe → ONE page per gesture, gesture-following
// ============================================================
let gestureDeltaX = 0;
let gestureActive = false;
let gestureStartIndex = -1;
let gestureLockedTarget = -1; // -1 = not yet locked
let gestureIdleTimer = null;
const WHEEL_DELTA_MULT = 0.55;

function shouldIgnoreSwipe(e){
  if (!data.settings.enableSwipe) return true;
  if (isModalOpen() || isCalOpen() || isParsePanelOpen()) return true;
  if (isSelectMode || dragInfo) return true;
  if (tutorialActive) return true;
  if (activeTrackAnim) return true;
  if (document.body.classList.contains('overlay-open')) return true;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return true;
  const t = e.target;
  if (t && t.closest) {
    if (t.closest('#typingBar') || t.closest('#parsePanel')) return true;
    if (t.closest('.modal') || t.closest('.cal-popup')) return true;
    if (t.closest('.ctx-menu') || t.closest('.menu')) return true;
    if (t.closest('#tutorialOverlay') || t.closest('.tutorial-card')) return true;
    if (t.closest('#tooltip')) return true;
  }
  return false;
}

function endGesture(forceSnapBack){
  if (!gestureActive) return;
  const w = pageViewport.offsetWidth || 0;
  const startI = gestureStartIndex;
  const threshold = w * 0.28;
  let target = currentPage;
  if (!forceSnapBack && gestureLockedTarget >= 0 && gestureLockedTarget !== startI
      && Math.abs(gestureDeltaX) > threshold) {
    target = PAGES[gestureLockedTarget];
  }
  gestureActive = false;
  gestureDeltaX = 0;
  gestureStartIndex = -1;
  gestureLockedTarget = -1;
  if (target !== currentPage) {
    setPage(target);
  } else {
    pageTrack.classList.add('animating');
    pageTrack.style.transform = `translateX(${-startI * w}px)`;
    setTimeout(() => pageTrack.classList.remove('animating'), 320);
  }
}

document.addEventListener('wheel', (e) => {
  if (shouldIgnoreSwipe(e)) { if (gestureActive) endGesture(true); return; }
  // Horizontal must clearly dominate vertical, with a small noise threshold
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) * 1.3) {
    // Vertical scrolling → end any in-flight gesture cleanly
    if (gestureActive) endGesture(true);
    return;
  }

  pageTrack.classList.remove('animating');
  pageTrack.style.transitionDuration = '';

  if (!gestureActive) {
    gestureActive = true;
    gestureStartIndex = PAGES.indexOf(currentPage);
    gestureLockedTarget = -1;
    gestureDeltaX = 0;
  }

  // Apply sensitivity multiplier so a fast flick can't drag past one page
  gestureDeltaX += e.deltaX * WHEEL_DELTA_MULT;

  // Lock direction after small initial movement
  if (gestureLockedTarget < 0 && Math.abs(gestureDeltaX) > 6) {
    if (gestureDeltaX > 0 && gestureStartIndex < PAGES.length - 1) {
      gestureLockedTarget = gestureStartIndex + 1;
    } else if (gestureDeltaX < 0 && gestureStartIndex > 0) {
      gestureLockedTarget = gestureStartIndex - 1;
    } else {
      // At edge in that direction — give a soft rubber-band feel, no target
      gestureLockedTarget = gestureStartIndex;
    }
  }

  const w = pageViewport.offsetWidth || 0;
  let offset = -gestureDeltaX;

  if (gestureLockedTarget === gestureStartIndex + 1) {
    // Forward (toward next page) — offset is negative, clamp to [-w, 0]
    offset = Math.min(0, Math.max(-w, offset));
  } else if (gestureLockedTarget === gestureStartIndex - 1) {
    // Backward — offset is positive, clamp to [0, w]
    offset = Math.max(0, Math.min(w, offset));
  } else {
    // At edge: small rubber-band, capped
    offset = offset * 0.25;
    if (gestureStartIndex === 0) offset = Math.max(0, Math.min(w * 0.12, offset));
    if (gestureStartIndex === PAGES.length - 1) offset = Math.max(-w * 0.12, Math.min(0, offset));
  }

  pageTrack.style.transform = `translateX(${-gestureStartIndex * w + offset}px)`;

  clearTimeout(gestureIdleTimer);
  gestureIdleTimer = setTimeout(() => endGesture(false), 120);
}, { passive: true });

// Window resize → re-align track to current page (no animation)
window.addEventListener('resize', () => {
  if (!gestureActive) applyTrackTransform(false);
});

// Auto-exit selection mode if user focuses the typing bar
typingInput.addEventListener('focus', () => {
  if (isSelectMode) {
    console.log('typing bar focused → exit selection mode');
    setSelectMode(false);
  }
});

// ============================================================
// Global type-to-add: route keystrokes to typing bar when no input focused
// ============================================================
document.addEventListener('keydown', (e) => {
  // Only normal printable characters (length 1) or Backspace
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length !== 1) return;
  // Skip if focus is already in an input/textarea/contenteditable
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
  // Skip if any panel/menu/calendar/modal is open or selection is active
  if (isModalOpen() || isCalOpen()) return;
  if (!ctxMenu.classList.contains('hidden')
      || !listCtxMenu.classList.contains('hidden') || !listDropdownEl.classList.contains('hidden')) return;
  if (isSelectMode) return;
  // Focus typing bar and let the keystroke land there
  e.preventDefault();
  typingInput.focus();
  typingInput.value += e.key;
  typingInput.dispatchEvent(new Event('input'));
});

// ============================================================
// First-run profile question + tutorial overlay
// ============================================================
const profileOverlay = document.getElementById('profileOverlay');
const tutorialOverlay = document.getElementById('tutorialOverlay');
const tutorialText = document.getElementById('tutorialText');
const tutorialStep = document.getElementById('tutorialStep');
const tutorialReel = document.getElementById('tutorialReel');
const reelPrev = tutorialReel.querySelector('.reel-prev');
const reelCurrent = tutorialReel.querySelector('.reel-current');
const reelNext = tutorialReel.querySelector('.reel-next');
const tutorialBack = document.getElementById('tutorialBack');
const tutorialNext = document.getElementById('tutorialNext');
const tutorialSkip = document.getElementById('tutorialSkip');

let tutorialActive = false;
let tutorialIdx = 0;
let reelTimer = null;
let reelItems = [];
let reelPos = 0;

const TUTORIAL_STEPS = [
  {
    target: '#typingBar',
    text: 'Type naturally to add a task. Loop can recognize dates, times, repeats, and subjects.',
    reel: ['Math worksheet due tomorrow', 'Dentist Thursday at 4pm', 'Practice violin every Tuesday']
  },
  {
    target: '#typingBar',
    text: 'Type a task here. Loop previews it before you save.',
    autofillByProfile: { student: 'Math worksheet due tomorrow', work: 'Report due Friday', other: 'Task due tomorrow' }
  },
  {
    target: '#typingBar',
    text: 'Check the preview, edit anything you want, then save.'
  },
  {
    target: '#toast',
    text: 'Loop tells you where your task was added. Click a task when it’s done. Use Undo if needed.'
  },
  {
    target: 'button[data-page="today"]',
    page: 'today',
    text: 'Today shows what needs attention now.'
  },
  {
    target: 'button[data-page="upcoming"]',
    page: 'upcoming',
    text: 'Upcoming shows later tasks.'
  },
  {
    target: 'button[data-page="subjects"]',
    page: 'subjects',
    text: 'Organize groups everything by subject.'
  },
  {
    target: '#sortToggleHost',
    page: 'subjects',
    text: 'Smart sorts urgent subjects first. Manual lets you reorder.'
  }
];

function showProfileQuestion(){
  profileOverlay.classList.remove('hidden'); syncOverlayLock();
}
function hideProfileQuestion(){
  profileOverlay.classList.add('hidden'); syncOverlayLock();
}
profileOverlay.addEventListener('click', (e) => {
  const b = e.target.closest('.profile-opt'); if (!b) return;
  data.settings.profile = b.dataset.profile;
  save();
  hideProfileQuestion();
  startTutorial(false);
});

function startTutorial(replay){
  tutorialActive = true;
  tutorialIdx = 0;
  tutorialOverlay.classList.remove('hidden');
  syncOverlayLock();
  applyTutorialStep();
}
function endTutorial(skipped){
  tutorialActive = false;
  clearTutorialHighlight();
  stopReel();
  tutorialOverlay.classList.add('hidden');
  syncOverlayLock();
  data.settings.onboardingComplete = true;
  save();
  if (skipped) {
    showToast('To replay the tutorial, type "replay tutorial" or open it in Settings.', null);
  } else {
    showToast('Tutorial complete. Type "replay tutorial" anytime, or open Settings.', null);
  }
}
function clearTutorialHighlight(){
  document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
}
function applyTutorialStep(){
  if (!tutorialActive) return;
  const step = TUTORIAL_STEPS[tutorialIdx];
  if (!step) { endTutorial(false); return; }
  // Switch page first if needed
  if (step.page && currentPage !== step.page) {
    setPage(step.page);
    setTimeout(applyTutorialStepNow, 320);
  } else {
    applyTutorialStepNow();
  }
}
function applyTutorialStepNow(){
  const step = TUTORIAL_STEPS[tutorialIdx];
  if (!step) return;
  clearTutorialHighlight();
  if (step.target) {
    const el = document.querySelector(step.target);
    if (el) el.classList.add('tutorial-highlight');
  }
  tutorialStep.textContent = (tutorialIdx + 1) + ' of ' + TUTORIAL_STEPS.length;
  tutorialText.textContent = step.text;
  // Last-step button label
  tutorialNext.textContent = (tutorialIdx === TUTORIAL_STEPS.length - 1) ? 'Finish tutorial' : 'Next';
  tutorialBack.style.visibility = (tutorialIdx === 0) ? 'hidden' : 'visible';
  // Reel
  stopReel();
  if (Array.isArray(step.reel) && step.reel.length) {
    reelItems = step.reel.slice();
    reelPos = 0;
    tutorialReel.classList.remove('hidden');
    paintReel();
    reelTimer = setInterval(() => { reelPos = (reelPos + 1) % reelItems.length; paintReel(); }, 2200);
  } else {
    tutorialReel.classList.add('hidden');
  }
  // Step 2 autofill
  if (step.autofillByProfile) {
    const fill = step.autofillByProfile[data.settings.profile || 'other'] || step.autofillByProfile.other;
    if (typingInput && !typingInput.value) {
      typingInput.value = fill;
      typingInput.focus();
      typingInput.dispatchEvent(new Event('input'));
    }
  }
}
function paintReel(){
  if (!reelItems.length) return;
  const n = reelItems.length;
  reelPrev.textContent    = reelItems[(reelPos - 1 + n) % n];
  reelCurrent.textContent = reelItems[reelPos];
  reelNext.textContent    = reelItems[(reelPos + 1) % n];
}
function stopReel(){
  if (reelTimer) { clearInterval(reelTimer); reelTimer = null; }
}

tutorialNext.addEventListener('click', () => {
  if (tutorialIdx >= TUTORIAL_STEPS.length - 1) { endTutorial(false); return; }
  tutorialIdx++;
  applyTutorialStep();
});
tutorialBack.addEventListener('click', () => {
  if (tutorialIdx === 0) return;
  tutorialIdx--;
  applyTutorialStep();
});
tutorialSkip.addEventListener('click', () => endTutorial(true));
// Esc closes the tutorial
document.addEventListener('keydown', (e) => {
  if (tutorialActive && e.key === 'Escape') { e.preventDefault(); endTutorial(true); }
});

// Decide whether to show profile / tutorial on launch
(function maybeStartOnboarding(){
  if (!data.settings.profile) {
    showProfileQuestion();
  } else if (!data.settings.onboardingComplete) {
    startTutorial(false);
  }
})();

// First paint
render();
</script>
</body>
