      const tp = document.createElement('span'); tp.className = 'tag-pill-mini'; tp.textContent = tg;
      meta.appendChild(tp);
    });
  }
  body.appendChild(meta);
  el.appendChild(body);
  // Important toggle
  const impBtnU = document.createElement('button');
  impBtnU.type='button';
  impBtnU.className = 'task-important-btn' + (task.important ? ' active' : '');
  impBtnU.textContent = '!';
  impBtnU.title = 'Mark important assignments';
  impBtnU.setAttribute('aria-label', (task.important ? 'Remove important from ' : 'Mark important: ') + (task.title || 'Untitled task'));
  impBtnU.addEventListener('click', (e) => {
    e.stopPropagation();
    task.important = !task.important;
    save(); render();
  });
  el.appendChild(impBtnU);
  // Pen edit
  const penBtn = document.createElement('button');
  penBtn.type='button'; penBtn.className='task-edit-btn'; penBtn.textContent='✎'; penBtn.title='Edit task';
  penBtn.setAttribute('aria-label', 'Edit ' + (task.title || 'Untitled task'));
  penBtn.addEventListener('click', (e) => {
    console.log('upcoming pen clicked →', task.title);
    e.stopPropagation();
    openTaskEditModal(task);
  });
  el.appendChild(penBtn);
  el.dataset.taskId = task.id;
  if (selectedTaskIds.has(task.id)) el.classList.add('selected');
  el.addEventListener('click', (e) => {
    if (isSelectMode) {
      console.log('task clicked (upcoming, select) →', task.title);
      if (selectedTaskIds.has(task.id)) selectedTaskIds.delete(task.id);
      else selectedTaskIds.add(task.id);
      lastSelectedId = task.id;
      updateSelectionBar(); render();
      return;
    }
    console.log('task clicked (upcoming) →', task.title);
    queueTaskCompletion(task, el);
  });
  return el;
}

// ----- Subjects page -----
function renderSubjectsPage(list){
  if (!list) return;
  if (list.subjects.length === 0) {
    const e = document.createElement('div'); e.className='empty';
    e.textContent = 'No subjects. Tap + to add one.';
    subjectsContainer.appendChild(e); return;
  }
  let subjects = [...list.subjects];
  // When a specific tag filter is active, hide subjects with no matching task
  if (currentFilters && currentFilters.size > 0) {
    subjects = subjects.filter(s => {
      const visibleTasks = (s.tasks || []).filter(t => taskMatchesFilter(t) && (s.showCompleted || !t.done));
      return visibleTasks.length > 0;
    });
    if (subjects.length === 0) {
      const e = document.createElement('div'); e.className='empty';
      if (currentFilters.size === 1) e.textContent = 'No ' + [...currentFilters][0] + ' tasks here';
      else e.textContent = 'No tasks match these filters';
      subjectsContainer.appendChild(e); return;
    }
  }
  if (list.sortMode === 'smart') {
    subjects.sort(compareSubjectsSmart);
  } else {
    // Manual mode: keep order, but fully completed subjects sink
    subjects.sort((a,b) => {
      const aDone = a.tasks.length > 0 && a.tasks.every(t => t.done);
      const bDone = b.tasks.length > 0 && b.tasks.every(t => t.done);
      if (aDone === bDone) return 0; return aDone ? 1 : -1;
    });
  }
  subjects.forEach(sub => subjectsContainer.appendChild(renderSubject(sub)));
}

function renderSubject(sub){
  const list = getList();
  const wrap = document.createElement('div'); wrap.className = 'subject';
  wrap.dataset.subjectId = sub.id;
  if (list.sortMode === 'manual') wrap.draggable = true;

  const stat = summaryStatus(sub.tasks, sub);
  if (stat.kind === 'overdue') wrap.classList.add('has-overdue');
  else if (stat.kind === 'soon') wrap.classList.add('has-soon');
  else if (stat.kind === 'done') wrap.classList.add('all-done');

  const header = document.createElement('div'); header.className = 'subject-header';
  const arrow = document.createElement('span'); arrow.className = 'arrow' + (sub.open?' open':''); arrow.textContent = '▶';
  header.appendChild(arrow);
  const name = document.createElement('div'); name.className = 'subject-name'; name.textContent = sub.name || 'Untitled subject';
  header.appendChild(name);
  const dueLabel = dueLabelText(sub);
  if (dueLabel) { const lbl = document.createElement('span'); lbl.className='due-label'; lbl.textContent = dueLabel; header.appendChild(lbl); }
  if (stat.kind === 'overdue') { const p=document.createElement('span'); p.className='pill pill-overdue'; p.textContent = stat.count + (stat.count===1?' task overdue':' tasks overdue'); header.appendChild(p); }
  else if (stat.kind === 'soon') { const p=document.createElement('span'); p.className='pill pill-soon'; p.textContent = stat.count + (stat.count===1?' task soon':' tasks soon'); header.appendChild(p); }
  else if (stat.kind === 'done') { const p=document.createElement('span'); p.className='pill pill-done'; p.textContent='Completed'; header.appendChild(p); }

  const editBtn = document.createElement('button');
  editBtn.type='button'; editBtn.className='subject-edit-btn'; editBtn.textContent='✎';
  editBtn.title='Edit subject';
  editBtn.setAttribute('aria-label', 'Edit subject ' + (sub.name || 'Untitled'));
  editBtn.addEventListener('click', (e) => {
    console.log('subject pen clicked →', sub.name);
    e.stopPropagation();
    commitOpenTaskPanel(); closeAllOtherEditPanels();
    sub.editing = true; save(); render();
  });
  header.appendChild(editBtn);

  attachSubjectHeaderHandlers(sub, header, wrap);
  wrap.appendChild(header);

  if (sub.editing) wrap.appendChild(renderSubjectEditPanel(sub));

  if (sub.open) {
    const body = document.createElement('div'); body.className = 'subject-body';
    let tasks = [...sub.tasks];
    // Hide completed unless toggled
    const hasDone = tasks.some(t => t.done);
    let visible = tasks.filter(t => (sub.showCompleted || !t.done) && taskMatchesFilter(t));
    if (list.sortMode === 'smart') {
      visible.sort((a,b) => compareTasksSmart(a, b, sub));
    } else {
      visible.sort((a,b) => (a.done===b.done?0:a.done?1:-1));
    }
    visible.forEach(t => body.appendChild(renderTaskCard(sub, t)));

    if (hasDone) {
      const tog = document.createElement('button'); tog.className='btn-link';
      const doneCount = tasks.filter(t=>t.done).length;
      tog.textContent = (sub.showCompleted ? 'Hide ' : 'Show ') + doneCount + ' completed';
      tog.addEventListener('click', (e) => { e.stopPropagation(); sub.showCompleted = !sub.showCompleted; save(); render(); });
      body.appendChild(tog);
    }
    wrap.appendChild(body);
  }
  return wrap;
}

function renderTaskCard(sub, task){
  const eff = effectiveTaskDue(task, sub);
  const stat = statusFromDue(eff, task.done);
  const el = document.createElement('div');
  el.className = 'task';
  el.dataset.taskId = task.id;
  const list = getList();
  if (stat === 'overdue') el.classList.add('tone-overdue');
  else if (stat === 'soon') el.classList.add('tone-soon');
  else if (stat === 'done') el.classList.add('tone-done');
  if (selectedTaskIds.has(task.id)) el.classList.add('selected');
  if (recentlyCreatedId === task.id) el.classList.add('appearing');
  if (task.important) el.classList.add('important');

  const row = document.createElement('div'); row.className='task-row';

  // Visible drag handle (grip): shown in Manual mode, or in select mode for group drag
  const showGrip = list.sortMode === 'manual' || (isSelectMode && selectedTaskIds.has(task.id));
  if (showGrip) {
    const grip = document.createElement('span');
    grip.className = 'task-grip';
    grip.textContent = '⋮⋮';
    grip.title = isSelectMode ? 'Drag selected tasks together' : 'Drag to reorder';
    grip.draggable = true;
    grip.addEventListener('click', e => e.stopPropagation());
    grip.addEventListener('dragstart', (e) => {
      e.stopPropagation();
      if (isSelectMode && selectedTaskIds.has(task.id) && selectedTaskIds.size >= 1) {
        startGroupDrag(e, [...selectedTaskIds]);
      } else if (list.sortMode === 'manual') {
        startDrag(e, { kind:'task', taskId: task.id }, el);
      } else {
        e.preventDefault();
      }
    });
    grip.addEventListener('dragend', endDrag);
    row.appendChild(grip);
  }

  const title = document.createElement('div'); title.className='task-title'; title.textContent = task.title || 'Untitled task';
  row.appendChild(title);

  if (stat === 'overdue') { const p=document.createElement('span'); p.className='pill pill-overdue'; p.textContent='Overdue'; row.appendChild(p); }
  else if (stat === 'soon') { const p=document.createElement('span'); p.className='pill pill-soon'; p.textContent='Soon'; row.appendChild(p); }
  else if (stat === 'done') { const p=document.createElement('span'); p.className='pill pill-done'; p.textContent='Completed'; row.appendChild(p); }
  else if (eff) {
    const p=document.createElement('span'); p.className='pill pill-neutral';
    const endISO = taskEndISO(task);
    p.textContent = (endISO && endISO !== eff) ? (formatDue(eff, task) + " – " + formatDue(endISO)) : formatDue(eff, task);
    row.appendChild(p);
  }
  // Tag pills (subtle)
  if (Array.isArray(task.tags)) {
    task.tags.forEach(tg => {
      const tp = document.createElement('span'); tp.className = 'tag-pill-mini'; tp.textContent = tg;
      row.appendChild(tp);
    });
  }

  const impBtn = document.createElement('button');
  impBtn.type='button';
  impBtn.className = 'task-important-btn' + (task.important ? ' active' : '');
  impBtn.textContent = '!';
  impBtn.title = 'Mark important assignments';
  impBtn.setAttribute('aria-label', (task.important ? 'Remove important from ' : 'Mark important: ') + (task.title || 'Untitled task'));
  impBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    task.important = !task.important;
    save(); render();
  });
  row.appendChild(impBtn);

  const penBtn = document.createElement('button');
  penBtn.type='button'; penBtn.className='task-edit-btn'; penBtn.textContent='✎';
  penBtn.title='Edit task';
  penBtn.setAttribute('aria-label', 'Edit ' + (task.title || 'Untitled task'));
  penBtn.addEventListener('click', (e) => {
    console.log('task pen clicked →', task.title);
    e.stopPropagation();
    if (task.expanded) commitOpenTaskPanel(); else openTaskPanel(task);
  });
  row.appendChild(penBtn);

  el.appendChild(row);

  // Row tap: complete (normal) or toggle selection (select mode)
  el.addEventListener('click', (e) => {
    if (penBtn.contains(e.target)) return;
    if (e.target.closest && e.target.closest('.edit-panel')) return;
    if (isSelectMode) {
      console.log('task clicked (select mode) →', task.title);
      if (selectedTaskIds.has(task.id)) selectedTaskIds.delete(task.id);
      else selectedTaskIds.add(task.id);
      lastSelectedId = task.id;
      updateSelectionBar(); render();
    } else {
      console.log('task clicked (complete) →', task.title);
      if (!task.done) {
        queueTaskCompletion(task, el);
      } else {
        task.done = false;
        task.completedAt = null;
        task.lastCompletedDate = '';
        save(); renderWithTaskMotion();
      }
    }
  });

  if (task.expanded) el.appendChild(renderTaskPanel(sub, task));
  if (!isSelectMode) attachTaskDragHandlers(el, sub, task);
  return el;
}

function dueFormHTML(prefix){

      <label>Due type</label>

        <option value="once">One-time due date</option>

    <div data-f="${prefix}-once-row" class="full">
      <label>Date <span data-f="${prefix}-info-due"></span></label>
      <div data-f="${prefix}-date-host"></div>
    </div>
    <div data-f="${prefix}-repeats-freq-row">
      <label>Repeat frequency <span data-f="${prefix}-info-rep"></span></label>
      <select data-f="${prefix}-frequency">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="fortnightly">Fortnightly</option>
        <option value="custom">Custom (coming soon)</option>
      </select>
    </div>
    <div data-f="${prefix}-repeats-day-row">
      <label>Repeat day</label>

        <option value="">—</option>
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
        <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
      </select>
    </div>
  `;
}
function bindDueForm(panel, prefix, dueObj){
  const typeSel = panel.querySelector(`[data-f="${prefix}-type"]`);
  const onceRow = panel.querySelector(`[data-f="${prefix}-once-row"]`);
  const freqRow = panel.querySelector(`[data-f="${prefix}-repeats-freq-row"]`);
  const dayRow  = panel.querySelector(`[data-f="${prefix}-repeats-day-row"]`);
  const freqSel = panel.querySelector(`[data-f="${prefix}-frequency"]`);
  const daySel  = panel.querySelector(`[data-f="${prefix}-day"]`);
  const dateHost= panel.querySelector(`[data-f="${prefix}-date-host"]`);
  // info icons
  const dueInfoHost = panel.querySelector(`[data-f="${prefix}-info-due"]`);
  const repInfoHost = panel.querySelector(`[data-f="${prefix}-info-rep"]`);
  if (dueInfoHost) dueInfoHost.appendChild(makeInfoBtn('due'));
  if (repInfoHost) repInfoHost.appendChild(makeInfoBtn('repeat'));

  const { wrap: dateWrap, input: dateInput } = makeDateInput(dueObj.date || '', (iso) => { dateInput.value = iso; });
  dateHost.appendChild(dateWrap);

  typeSel.value = dueObj.type || 'none';
  freqSel.value = dueObj.frequency || 'weekly';
  daySel.value = dueObj.day || '';

  function apply(){
    const t = typeSel.value;
    onceRow.style.display = (t === 'once') ? '' : 'none';
    freqRow.style.display = (t === 'repeats') ? '' : 'none';
    const f = freqSel.value;
    dayRow.style.display = (t === 'repeats' && (f === 'weekly' || f === 'fortnightly')) ? '' : 'none';
  }
  typeSel.addEventListener('change', apply);
  freqSel.addEventListener('change', apply);
  apply();

  return {
    read(){
      const t = typeSel.value;
      const out = { type: t, date:'', frequency:'', day:'' };
      if (t === 'once') out.date = dateInput.value || '';
      if (t === 'repeats') {
        out.frequency = freqSel.value;
        if (out.frequency === 'weekly' || out.frequency === 'fortnightly') out.day = daySel.value || '';
      }
      return out;
    }
  };
}

function renderSubjectEditPanel(sub){

  panel.addEventListener('click', e => e.stopPropagation());
  panel.innerHTML = `
    <div class="full"><label>Subject name</label><input type="text" data-f="name" placeholder="Subject name"/></div>

      <button class="btn" data-f="done">Done</button>
    </div></div>`;
  const nameI = panel.querySelector('[data-f="name"]'); nameI.value = sub.name || '';
  const dueBind = bindDueForm(panel, 'sub', sub.due || emptyDue());
  panel.querySelector('[data-f="done"]').addEventListener('click', (e) => {
    e.stopPropagation();

function renderTaskPanel(sub, task){
  const panel = document.createElement('div'); panel.className='edit-panel';
  panel.addEventListener('click', e => e.stopPropagation());
  panel.innerHTML = `
    <div class="full"><label>Task name</label><input type="text" data-f="title" placeholder="Task name"/></div>
    <div class="full"><label>Notes</label><textarea data-f="notes" placeholder="Notes"></textarea></div>
    ${dueFormHTML('task')}
    <div class="full"><label>Time / Period</label><input type="text" data-f="timeText" placeholder="e.g. Period 6, 11am, 10am – 12:30pm" /></div>
    <div class="full"><label>Tags</label><div class="tag-picker" data-f="tags"></div></div>
    <div class="actions-row">
      <button class="btn-danger" data-f="delete">Delete</button>
      <div class="actions-right">
        <button class="btn-soft" data-f="cancel">Cancel</button>
        <button class="btn" data-f="done">Done</button>
      </div>
    </div>`;
  const titleI = panel.querySelector('[data-f="title"]'); titleI.value = task.title || '';
  const notesI = panel.querySelector('[data-f="notes"]'); notesI.value = task.notes || '';
  const timeI = panel.querySelector('[data-f="timeText"]');
  // Migrate legacy time-from-notes-prefix on the fly so users can edit it
  if (timeI) {
    if (task.timeText) {
      timeI.value = task.timeText;
    } else if (task.notes) {
      const firstLine = (task.notes.split('\n')[0] || '').trim();
      if (/^Period\s+\d/i.test(firstLine) || /^\d{1,2}(?::\d{2})?\s*(am|pm)/i.test(firstLine)) {
        timeI.value = firstLine;
      }
    }
  }
  const dueBind = bindDueForm(panel, 'task', task.due || emptyDue());
  // Tag picker
  const tagHost = panel.querySelector('[data-f="tags"]');
  if (tagHost) {
    const taskTags = new Set(Array.isArray(task.tags) && task.tags.length ? task.tags : ['School']);
    TAG_OPTIONS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tag-pill' + (taskTags.has(t) ? ' active' : '');
      b.textContent = t; b.dataset.tag = t;
      b.addEventListener('click', (e) => { e.stopPropagation(); b.classList.toggle('active'); });
      tagHost.appendChild(b);
    });
  }
  panel.querySelector('[data-f="done"]').addEventListener('click', (e) => {
    e.stopPropagation();
    const t = titleI.value.trim(); if (t) task.title = t;
    task.notes = notesI.value || '';
    task.due = dueBind.read();
    if (timeI) task.timeText = (timeI.value || '').trim();
    if (tagHost) {
      const newTags = [...tagHost.querySelectorAll('.tag-pill.active')].map(b => b.dataset.tag);
      task.tags = newTags.length ? newTags : ['School'];
    }
    task.expanded = false; save(); render();
  });
  panel.querySelector('[data-f="cancel"]').addEventListener('click', (e) => {
    e.stopPropagation(); task.expanded = false; save(); render();
  });
  panel.querySelector('[data-f="delete"]').addEventListener('click', (e) => {
    e.stopPropagation();
    const loc = findTask(task.id); if (!loc) return;
    const removed = { task: loc.task, parent: loc.parent, idx: loc.idx };
    loc.parent.splice(loc.idx, 1);
    save(); render();
    showToast('Task deleted', () => {
      removed.parent.splice(Math.min(removed.idx, removed.parent.length), 0, removed.task);
      save(); render();
    });
  });
  return panel;
}

function getOpenTask(){
  const list = getList(); if (!list) return null;
  for (const sub of list.subjects) for (const t of sub.tasks) if (t.expanded) return { task: t, sub };
  return null;
}
function openTaskPanel(task){
  commitOpenTaskPanel();
  const list = getList();
  list.subjects.forEach(sub => { sub.tasks.forEach(t => t.expanded = false); sub.editing = false; });
  task.expanded = true; save(); render();
}
function readPanelIntoTask(o){
  const taskEl = document.querySelector('[data-task-id="' + o.task.id + '"]');
  if (!taskEl) return;
  const det = taskEl.querySelector('.edit-panel'); if (!det) return;
  const titleVal = (det.querySelector('[data-f="title"]').value || '').trim();
  if (titleVal) o.task.title = titleVal;
  o.task.notes = det.querySelector('[data-f="notes"]').value || '';
  const typeSel = det.querySelector('[data-f="task-type"]');
  const freqSel = det.querySelector('[data-f="task-frequency"]');
  const daySel  = det.querySelector('[data-f="task-day"]');
  const dateInp = det.querySelector('[data-f="task-date-host"] input');
  const t = typeSel.value;
  const due = { type:t, date:'', frequency:'', day:'' };
  if (t === 'once') due.date = (dateInp && dateInp.value) || '';
  if (t === 'repeats') {
    due.frequency = freqSel.value;
    if (due.frequency === 'weekly' || due.frequency === 'fortnightly') due.day = daySel.value || '';
  }
  o.task.due = due;
  const timeI = det.querySelector('[data-f="timeText"]');
  if (timeI) o.task.timeText = (timeI.value || '').trim();
  const tagHost = det.querySelector('[data-f="tags"]');
  if (tagHost) {
    const newTags = [...tagHost.querySelectorAll('.tag-pill.active')].map(b => b.dataset.tag);
    o.task.tags = newTags.length ? newTags : ['School'];
  }
}
function commitOpenTaskPanel(){
  const o = getOpenTask(); if (!o) return;
  if (isCalOpen()) closeCalendar();
  readPanelIntoTask(o);
  o.task.expanded = false; save(); render();
}
function cancelOpenTaskPanel(){
  const o = getOpenTask(); if (!o) return;
  if (isCalOpen()) closeCalendar();
  o.task.expanded = false; save(); render();
}

const ctxMenu = document.getElementById('ctxMenu');
let ctxSubject = null;
function showSubjectCtxMenu(x,y,sub){
  hideListCtxMenu(); hideListDropdown();
  ctxSubject = sub;
  ctxMenu.style.left = x+'px'; ctxMenu.style.top = y+'px';
  ctxMenu.classList.remove('hidden');
}
function hideSubjectCtxMenu(){ ctxMenu.classList.add('hidden'); ctxSubject = null; }
ctxMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  const act = e.target.dataset.act; if (!act || !ctxSubject) return;
  const sub = ctxSubject; hideSubjectCtxMenu();
  if (act === 'add-task') {
    openInputModal({ title:'New Task', placeholder:'Task name', okLabel:'Add',
      onSave: (name) => { sub.tasks.push({ id:uid(), title:name, notes:'', done:false, expanded:false, due:emptyDue(), lastCompletedDate:'', completedAt:null }); sub.open=true; save(); render(); } });
  } else if (act === 'rename') {
    commitOpenTaskPanel(); closeAllOtherEditPanels(); sub.editing = true; save(); render();
  } else if (act === 'duplicate') {
    const list = getList();
    const copy = JSON.parse(JSON.stringify(sub)); copy.id = uid(); copy.name = sub.name + ' copy';
    if (Array.isArray(copy.tasks)) copy.tasks.forEach(t => t.id = uid());
    const idx = list.subjects.findIndex(s => s.id === sub.id);
    list.subjects.splice(idx+1, 0, copy); save(); render();
  } else if (act === 'delete') {
    openConfirmModal({ title:'Delete Subject', message:'Delete subject "' + sub.name + '" and everything in it?',
      okLabel:'Delete', danger:true, onConfirm: () => {
        const list = getList(); list.subjects = list.subjects.filter(s => s.id !== sub.id); save(); render();
      } });
  }
});

function showListDropdown(){
  hideListCtxMenu();

// ===== Subject typo suggestion helpers =====
const SUBJECT_ALIAS_MAP = {
  'maths':'Math', 'math':'Math', 'mth':'Math', 'mathematics':'Mathematics',
  'eng':'English', 'engl':'English',
  'lit':'Literature',
  'bio':'Biology',
  'chem':'Chemistry',

  'geo':'Geography',
  'hist':'History',

  'hpe':'HPE',
  'drama':'Drama',
  'art':'Art',
  'music':'Music'
};
const SUBJECT_MARKERS = ['for','in','from','about','on','of'];
const STUDY_MARKERS = ['study','review','revise','practice','prepare'];
const TASK_WORDS_FOR_SUGGEST = ['test','exam','quiz','assessment','essay','oral','speech','presentation','practical','project','competition','performance','worksheet','homework','vocab','revision','notes','exercise','reading','rehearsal','assignment'];
const SUBJECT_STOPWORDS = (() => {
  const s = new Set([
    'make','do','go','get','have','take','give','put','say','let','use',
    'email','call','finish','start','work','read','write',
    'poster','teacher','routine','task',
    'today','tomorrow','yesterday','tonight','noon','midday','weekend',
    'monday','tuesday','wednesday','thursday','friday','saturday','sunday',
    'morning','afternoon','evening','night',
    'every','each','weekly','daily','fortnightly','next','this','due','at','and','or','the','a','an','my','i','am','pm'
  ]);
  SUBJECT_MARKERS.forEach(w => s.add(w));
  STUDY_MARKERS.forEach(w => s.add(w));
  TASK_WORDS_FOR_SUGGEST.forEach(w => s.add(w));
  return s;
})();

function normalizeSubjectText(t){
  return (t || '').toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
}
function levenshteinDistance(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
      curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}
function fuzzyThreshold(maxLen){
  if (maxLen <= 4) return 1;
  if (maxLen <= 7) return 2;
  return 3;
}

function getSubjectCandidates(text){
  const trimmed = (text || '').trim();
  if (!trimmed) return [];
  const tokens = trimmed.split(/\s+/);
  const seen = new Set();
  const out = [];
  function pushCand(words, sourceType, startIdx){
    if (!words || words.length === 0) return;
    const raw = words.join(' ');
    const norm = normalizeSubjectText(raw);
    if (!norm) return;
    if (norm.length < 3) return;
    // Reject candidates containing any stopword token
    for (const w of words) {
      const lc = (w || '').toLowerCase().replace(/[^\w]/g, '');
      if (SUBJECT_STOPWORDS.has(lc)) return;
    }
    const key = sourceType + '|' + norm;
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ text: raw, normalized: norm, sourceType, startIndex: startIdx });
  }
  // A. Start of input
  for (let n = 1; n <= 3 && n <= tokens.length; n++) {
    pushCand(tokens.slice(0, n), 'start', 0);
  }
  // B. After subject-introducing markers
  for (let i = 0; i < tokens.length; i++) {
    const lc = (tokens[i] || '').toLowerCase();
    if (SUBJECT_MARKERS.includes(lc)) {
      for (let n = 1; n <= 3 && i + n < tokens.length; n++) {
        pushCand(tokens.slice(i + 1, i + 1 + n), 'after-marker', i + 1);
      }
    }
  }
  // C. After study-marker + "for"
  for (let i = 0; i < tokens.length - 1; i++) {
    const lc = (tokens[i] || '').toLowerCase();
    if (STUDY_MARKERS.includes(lc) && (tokens[i + 1] || '').toLowerCase() === 'for') {
      for (let n = 1; n <= 3 && i + 2 + n - 1 < tokens.length; n++) {
        pushCand(tokens.slice(i + 2, i + 2 + n), 'after-study-marker', i + 2);
      }
    }
  }
  // D. Directly before a task/assessment word
  for (let i = tokens.length - 1; i >= 1; i--) {
    const lc = (tokens[i] || '').toLowerCase();
    if (TASK_WORDS_FOR_SUGGEST.includes(lc)) {
      for (let n = 1; n <= 3 && i - n >= 0; n++) {
        pushCand(tokens.slice(i - n, i), 'before-task-word', i - n);
      }
    }
  }
  return out;
}

function findSubjectSuggestion(text, knownSubjects){
  if (!text || !Array.isArray(knownSubjects) || knownSubjects.length === 0) return null;
  // If any existing subject phrase appears verbatim in the input, do not suggest.
  const norm = normalizeSubjectText(text);
  for (const s of knownSubjects) {
    const sn = normalizeSubjectText(s.name);
    if (sn && norm.includes(sn)) return null;
  }
  // Try alias map against the first token first.
  const firstToken = (text.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^\w]/g, '');
  const aliasTarget = SUBJECT_ALIAS_MAP[firstToken];
  if (aliasTarget) {
    const ex = knownSubjects.find(s => s.name.toLowerCase() === aliasTarget.toLowerCase());
    if (ex) return { subject: ex, candidateText: firstToken, sourceType: 'alias', score: 0 };
  }
  // Generate candidates
  const candidates = getSubjectCandidates(text);
  const sourcePriority = { 'alias':0, 'after-marker':1, 'after-study-marker':1, 'start':2, 'before-task-word':3 };
  let best = null;
  for (const c of candidates) {
    for (const sub of knownSubjects) {
      const ns = normalizeSubjectText(sub.name);
      if (!ns || c.normalized === ns) continue;
      const dist = levenshteinDistance(c.normalized, ns);
      const limit = fuzzyThreshold(Math.max(c.normalized.length, ns.length));
      if (dist > limit) continue;
      // Penalize: too-short candidate compared to subject is risky
      if (c.normalized.length < 3) continue;
      const score = dist * 10 + (sourcePriority[c.sourceType] ?? 5);
      if (!best || score < best.score) {
        best = { subject: sub, candidateText: c.text, sourceType: c.sourceType, score, distance: dist };
      }
    }
  }
  return best;
}
function capitalize(s){ return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s; }

function parseTaskInput(text){
  const list = getList();
  const knownSubjects = list ? list.subjects.filter(s => s.name).map(s => ({ id:s.id, name:s.name })) : [];
  const result = { title:'', subject:null, due:null, dueEnd:null, dueLabel:'', repeat:'none', repeatDay:'', time:'', tags: [], important:false, startDate:null };

  // Pre-pass: expand common abbreviations on a working copy
  let preText = text;

  const tagWordMap = { school:'School', class:'School', tutor:'Tutor', tutoring:'Tutor', home:'Home' };
  const foundTags = new Set();
  Object.entries(tagWordMap).forEach(([word, tag]) => {
    const re = new RegExp('(^|\\s)#?' + word + '\\b', 'i');
    if (re.test(working)) {
      foundTags.add(tag);
      working = working.replace(new RegExp('(^|\\s)#?' + word + '\\b', 'gi'), '$1');
    }
  });
  if (foundTags.size > 0) result.tags = [...foundTags];

  // Importance hint: school keywords like test, exam, oral, speech, project, etc.
  if (/\b(test|exam|exams|assessment|assessments|quiz|oral|speech|presentation|assignment|project|practical)\b/i.test(working)) {
    result.important = true;
  }

  // ===== Period parsing (with range, last/final, ambiguous) =====
  let periodPart = '';
  // "last period" / "final period" / "last lesson" → leave for AI/user
  let lpm = working.match(/\b(?:last\s+period|final\s+period|last\s+lesson)\b/i);
  if (lpm) {
    periodPart = 'Needs detail';
    result.timeUnknown = true;
    working = working.replace(lpm[0], ' ');
  }
  // Period range: "Period 2 to Period 4" / "p2-p4" / "Period 2 - 4"
  if (!periodPart) {
    let prm = working.match(/\b(?:period\s*|p)(\d{1,2})\s*(?:to|through|until|-|–|—)\s*(?:period\s*|p)?(\d{1,2})\b/i);
    if (prm) {
      periodPart = 'Period ' + prm[1] + ' – Period ' + prm[2];
      working = working.replace(prm[0], ' ');
    }
  }
  // Single period: "period 6", "p6", "lesson 6"
  if (!periodPart) {
    let pm = working.match(/\b(?:period\s*(\d{1,2})|p(\d{1,2})|lesson\s*(\d{1,2}))\b/i);
    if (pm) {
      const num = pm[1] || pm[2] || pm[3];
      periodPart = 'Period ' + num;
      working = working.replace(pm[0], ' ');
    }
  }

  // ===== Clock parsing (with range) =====
  let clockPart = '';
  // Range: "10am to 12:30pm" / "10am-12:30pm" / "from 10am to 12:30pm"
  let crm = working.match(/\b(?:from\s+)?(\d{1,2}(?::\d{2})?\s*(?:am|pm))\s*(?:to|through|until|-|–|—)\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm))\b/i);
  if (crm) {
    clockPart = crm[1].toLowerCase().replace(/\s+/g, '') + ' – ' + crm[2].toLowerCase().replace(/\s+/g, '');
    working = working.replace(crm[0], ' ');

        const m2 = dayExpr.match(/^(?:next\s+|this\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/);
        if (m2) {
          const idx = dnames.indexOf(m2[1]);

    mm = s.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[2].toLowerCase()));
      const day = parseInt(mm[1]);
      if (monthIdx >= 0 && day >= 1 && day <= 31) {
        let y = today0.getFullYear(); let c = new Date(y, monthIdx, day);
        if (c < today0) c = new Date(y+1, monthIdx, day);
        return toISO(c);
      }
    }
    mm = s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
    if (mm) {
      const a = parseInt(mm[1]), b = parseInt(mm[2]);
      const fmt = (data.settings && data.settings.dateFormat) || 'DD/MM';
      const day   = fmt === 'MM/DD' ? b : a;
      const month = fmt === 'MM/DD' ? a : b;
      if (day >= 1 && day <= 31 && month >= 1 && month <= 12) {
        let year = mm[3] ? (mm[3].length === 2 ? 2000 + parseInt(mm[3]) : parseInt(mm[3])) : today0.getFullYear();
        let c = new Date(year, month-1, day);
        if (!mm[3] && c < today0) c = new Date(year+1, month-1, day);
        return toISO(c);
      }
    }
    return null;
  }

  // Range patterns
  let rangeMatch = null, rangeStart = null, rangeEnd = null;

  // Ordinal range without month: "11th to 12th", "on the 11th to 12th", "the 11th to the 12th", "from the 11th to the 12th", "11th-12th"
  rangeMatch = working.match(/\b(?:(?:on|from)\s+)?(?:the\s+)?(\d{1,2})(?:st|nd|rd|th)\s*(?:to|through|until|-|–|—)\s*(?:the\s+)?(\d{1,2})(?:st|nd|rd|th)\b/i);
  if (rangeMatch) {
    const a = parseInt(rangeMatch[1]);
    const b = parseInt(rangeMatch[2]);
    if (a >= 1 && a <= 31 && b >= 1 && b <= 31 && a <= b) {
      // Pick this month if end is still future, else next month
      let y = today0.getFullYear(), m = today0.getMonth();
      let candidateEnd = new Date(y, m, b);
      if (candidateEnd < today0) {
        m += 1; if (m > 11) { m = 0; y += 1; }
      }
      const start = new Date(y, m, a);
      const end = new Date(y, m, b);
      rangeStart = toISO(start);
      rangeEnd = toISO(end);
    }
  }
  // "May 11-12" / "May 11 - 12" — same month, day-day
  if (!rangeStart) {
    rangeMatch = working.match(/\b([A-Za-z]+)\s+(\d{1,2})\s*[-–—]\s*(\d{1,2})\b/);
    if (rangeMatch) {
      rangeStart = parseSimpleDate(rangeMatch[1] + ' ' + rangeMatch[2]);
      rangeEnd   = parseSimpleDate(rangeMatch[1] + ' ' + rangeMatch[3]);
    }
  }
  // "11/5-12/5" / "11-5 to 12-5"
  if (!rangeStart) {
    rangeMatch = working.match(/\b(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\s*[-–—]\s*(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/);
    if (rangeMatch) {
      rangeStart = parseSimpleDate(rangeMatch[1]);
      rangeEnd   = parseSimpleDate(rangeMatch[2]);
    }
  }
  // "May 11 to May 12" / "May 11 through 12" / "from May 11 to May 12"
  if (!rangeStart) {
    rangeMatch = working.match(/\b(?:from\s+)?([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\s+(?:to|through|until|-|–|—)\s+([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/i);
    if (rangeMatch) {
      rangeStart = parseSimpleDate(rangeMatch[1]);
      rangeEnd   = parseSimpleDate(rangeMatch[2]);
    }
  }
  // Weekday range: "Friday to Monday", "next Monday to Wednesday"
  if (!rangeStart) {
    rangeMatch = working.match(/\b(?:from\s+)?((?:next\s+|this\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\s+(?:to|through|until|-|–|—)\s+((?:next\s+|this\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b/i);
    if (rangeMatch) {
      const startISO = parseSimpleDate(rangeMatch[1]);
      if (startISO) {
        rangeStart = startISO;
        const startDate = fromISO(startISO);
        // End weekday must be ON or AFTER start date
        const endName = rangeMatch[2].toLowerCase().replace(/^(?:next|this)\s+/, '');
        const endIdx = dnamesArr.indexOf(endName);
        if (endIdx >= 0) {
          let diff = endIdx - startDate.getDay();
          if (diff < 0) diff += 7;
          if (diff === 0 && /^(next|this)\s+/i.test(rangeMatch[2])) diff = 7;
          const endDate = new Date(startDate); endDate.setDate(startDate.getDate() + diff);
          rangeEnd = toISO(endDate);
        }
      }
    }
  }
  if (rangeStart && rangeEnd && rangeStart <= rangeEnd) {
    result.due = rangeStart;
    result.dueEnd = rangeEnd;
    working = working.replace(rangeMatch[0], ' ');
  }
  // ===== End date range detection =====

  // Repeat with weekday: "weekly on Friday", "fortnightly on Sat"
  let m = working.match(/\b(weekly|fortnightly)\s+on\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
  if (m) {
    result.repeat = m[1].toLowerCase();
    result.repeatDay = capitalize(m[2]);
    working = working.replace(m[0], ' ');
  }
  // "every <day>"
  if (result.repeat === 'none') {
    m = working.match(/\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (m) {
      result.repeat = 'weekly';
      result.repeatDay = capitalize(m[1]);
      working = working.replace(m[0], ' ');
    }
  }
  // "every fortnight <day>" / "every fortnight Thursday"
  if (result.repeat === 'none') {
    let mfn = working.match(/\b(?:every\s+)?fortnight(?:ly)?\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (mfn) {
      result.repeat = 'fortnightly';
      result.repeatDay = capitalize(mfn[1]);
      working = working.replace(mfn[0], ' ');
    }
  }
  // generic repeat keywords
  if (result.repeat === 'none') {
    if (/\b(fortnightly|every\s*(?:2|two)\s*weeks?|every\s+fortnight)\b/i.test(working)) {
      result.repeat = 'fortnightly';
      working = working.replace(/\b(fortnightly|every\s*(?:2|two)\s*weeks?|every\s+fortnight)\b/i, ' ');
    } else if (/\b(weekly|every\s*week)\b/i.test(working)) {
      result.repeat = 'weekly';
      working = working.replace(/\b(weekly|every\s*week)\b/i, ' ');
    } else if (/\b(daily|every\s*day)\b/i.test(working)) {
      result.repeat = 'daily';
      working = working.replace(/\b(daily|every\s*day)\b/i, ' ');
    }
  }

  function tryDateExpr(expr){
    expr = expr.trim().toLowerCase();
    if (!expr) return null;
    if (expr === 'today') return toISO(today);
    if (expr === 'tomorrow') { const d=new Date(today); d.setDate(d.getDate()+1); return toISO(d); }
    if (expr === 'weekend' || expr === 'this weekend') { let diff=6-today.getDay(); if(diff<0) diff+=7; const d=new Date(today); d.setDate(d.getDate()+diff); return toISO(d); }
    const dnames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    let mm = expr.match(/^(?:next\s+|this\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/);
    if (mm) {
      const idx = dnames.indexOf(mm[1]);
      let diff = idx - today.getDay(); if (diff <= 0) diff += 7;
      const d = new Date(today); d.setDate(d.getDate()+diff); return toISO(d);
    }
    mm = expr.match(/^([A-Za-z]+)\s+(\d{1,2})$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[1].toLowerCase()));
      const dayNum = parseInt(mm[2]);
      if (monthIdx >= 0 && dayNum >= 1 && dayNum <= 31) {
        let y = today.getFullYear(); let c = new Date(y, monthIdx, dayNum);
        if (c < today) c = new Date(y+1, monthIdx, dayNum);
        return toISO(c);
      }
    }
    mm = expr.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
    if (mm) {
      const monthIdx = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(mm[2].toLowerCase()));
      const dayNum = parseInt(mm[1]);
      if (monthIdx >= 0 && dayNum >= 1 && dayNum <= 31) {
        let y = today.getFullYear(); let c = new Date(y, monthIdx, dayNum);
        if (c < today) c = new Date(y+1, monthIdx, dayNum);
        return toISO(c);
      }
    }
    // Numeric "5/6" / "5-6" / "15/5/2026" → respect dateFormat setting
    mm = expr.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
    if (mm) {
      const a = parseInt(mm[1]), b = parseInt(mm[2]);
      const fmt = (data.settings && data.settings.dateFormat) || 'DD/MM';
      const day   = fmt === 'MM/DD' ? b : a;
      const month = fmt === 'MM/DD' ? a : b;
      if (day >= 1 && day <= 31 && month >= 1 && month <= 12) {
        let year;
        if (mm[3]) year = mm[3].length === 2 ? 2000 + parseInt(mm[3]) : parseInt(mm[3]);
        else { year = today.getFullYear(); }
        let c = new Date(year, month-1, day);
        if (!mm[3] && c < today) c = new Date(year+1, month-1, day);
        return toISO(c);
      }
    }
    return null;
  }

  // "each <weekday>" → weekly + day
  if (result.repeat === 'none') {
    m = working.match(/\beach\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (m) {
      result.repeat = 'weekly';
      result.repeatDay = capitalize(m[1]);
      working = working.replace(m[0], ' ');
    }
  }
  // ===== Past relative phrases (run BEFORE generic due/date detection) =====
  function setPastRelative(unit, amount) {
    const t = todayLocal();
    let dd;
    if (unit === 'day') dd = new Date(t.getTime() - amount * DAY_MS);
    else if (unit === 'week') dd = new Date(t.getTime() - amount * 7 * DAY_MS);
    else if (unit === 'month') {
      dd = new Date(t);
      const origDay = dd.getDate();
      dd.setDate(1);
      dd.setMonth(dd.getMonth() - amount);
      const dim = new Date(dd.getFullYear(), dd.getMonth()+1, 0).getDate();
      dd.setDate(Math.min(origDay, dim));
    } else if (unit === 'year') {
      dd = new Date(t);
      const origDay = dd.getDate();
      dd.setFullYear(dd.getFullYear() - amount);
      const dim = new Date(dd.getFullYear(), dd.getMonth()+1, 0).getDate();
      dd.setDate(Math.min(origDay, dim));
    } else { return; }
    result.due = toISO(dd);
    result.relativeSource = { unit, amount };
  }
  // "yesterday" / "due yesterday"
  if (!result.due) {
    let pmY = working.match(/\b(?:due\s+)?yesterday\b/i);
    if (pmY) { setPastRelative('day', 1); working = working.replace(pmY[0], ' '); }
  }
  // "last week" / "last month" / "last year"
  if (!result.due) {
    let pmL = working.match(/\b(?:due\s+)?last\s+(week|month|year)\b/i);
    if (pmL) { setPastRelative(pmL[1].toLowerCase(), 1); working = working.replace(pmL[0], ' '); }
  }
  // "N days/weeks/months/years ago" — "two months ago", "3 weeks ago"
  if (!result.due) {
    let pmA = working.match(/\b(?:due\s+)?(\d+|two|three|four|five|six|seven|eight|nine|ten)\s+(day|days|week|weeks|month|months|year|years)\s+ago\b/i);
    if (pmA) {
      const numWords = { two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10 };
      let n = parseInt(pmA[1]);
      if (isNaN(n)) n = numWords[pmA[1].toLowerCase()];
      const unit = pmA[2].toLowerCase().replace(/s$/, '');
      setPastRelative(unit, n);
      working = working.replace(pmA[0], ' ');
    }
  }

  // "due X" — accepts numeric, written, or named (supports "this", "next", "on")
  const dueRe = /\bdue\s+(?:on\s+|this\s+|next\s+)*((?:this\s+|next\s+)?(?:today|tomorrow|weekend|sunday|monday|tuesday|wednesday|thursday|friday|saturday)|[A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/i;
  m = working.match(dueRe);
  if (m) {
    const iso = tryDateExpr(m[1]);
    if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
  }
  // "on May 15"
  if (!result.due) {
    m = working.match(/\bon\s+([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/i);
    if (m) {
      const iso = tryDateExpr(m[1]);
      if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
    }
  }
  // bare keywords (also absorbs leading "on", "this", "next")
  if (!result.due) {
    m = working.match(/\b(?:on\s+)?((?:this\s+|next\s+)?(?:today|tomorrow|weekend|sunday|monday|tuesday|wednesday|thursday|friday|saturday))\b/i);
    if (m) {
      const iso = tryDateExpr(m[1]);
      if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
    }
  }
  // bare written or numeric date e.g. "May 20" / "15/5"
  if (!result.due) {
    m = working.match(/\b([A-Za-z]+\s+\d{1,2}|\d{1,2}\s+[A-Za-z]+|\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\b/);
    if (m) {
      const iso = tryDateExpr(m[1]);
      if (iso) { result.due = iso; working = working.replace(m[0], ' '); }
    }
  }

  // ===== Existing-subject detection =====
  // Rules:
  //  - Match only at the START of the user's typed text.
  //  - Case-insensitive.
  //  - Longest existing subject name wins (so "Contemporary Music" beats "Music").
  //  - If nothing matches, the subject stays null and the caller treats it as
  //    Unsorted. No automatic new-subject creation from the first capitalized
  //    word — that requires a manual edit in the parse panel.
  const sortedSubjects = [...knownSubjects].sort((a, b) => (b.name.length - a.name.length));
  const startText = text.trim();
  let detected = null;
  for (const s of sortedSubjects) {
    const re = new RegExp('^' + escapeRegex(s.name) + '\\b', 'i');
    if (re.test(startText)) { detected = s; break; }
  }
  if (detected) {
    result.subject = { id: detected.id, name: detected.name, isExisting: true };
    // Assessment/event title rule:
    //   Keep subject in title when the FIRST 1–2 words after the subject phrase
    //   are an assessment/event word (Math Test, English Essay,
    //   Contemporary Music Performance). Strip otherwise
    //   (Math worksheet → Worksheet, Contemporary Music Concert Rehearsals and Performance → Concert Rehearsals and Performance).
    const ASSESSMENT_WORDS = ['test','exam','quiz','assessment','essay','oral','speech','presentation','practical','project','competition','performance'];
    const re = new RegExp('\\b' + escapeRegex(detected.name) + '\\b', 'i');
    const removed = working.replace(re, ' ');
    const restWords = removed.replace(/\s+/g, ' ').trim().split(' ').slice(0, 2).map(w => w.toLowerCase());
    const hasAssessment = restWords.some(w => ASSESSMENT_WORDS.includes(w));
    if (!hasAssessment) {
      working = removed; // routing usage: remove subject word
    }
    // else: keep subject in working so the final title reads "Math Test", "Contemporary Music Performance", etc.
  }
  // No `else` branch — we deliberately do NOT auto-create a new subject from
  // the first capitalized word. Subject stays null → caller renders Unsorted.

  // If repeat is weekly/fortnightly but no day was captured, pull a weekday from anywhere
  if ((result.repeat === 'weekly' || result.repeat === 'fortnightly') && !result.repeatDay) {
    let wm = working.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if (wm) {
      result.repeatDay = capitalize(wm[1]);
      working = working.replace(wm[0], ' ');
    }
  }
  // Strip any leftover orphan date/time scaffolding words
  working = working.replace(/\b(?:due|on|this|next|at|to|from|through|until)\b/gi, ' ');
  const rawTitle = working.replace(/\s+/g, ' ').trim();
  result.title = cleanTitle(rawTitle);
  // Never produce an empty title — fall back to "Task"
  if (!result.title) result.title = 'Task';
  if (result.due) {
    const d = fromISO(result.due);
    if (d) result.dueLabel = formatDue(result.due);
  }
  return result;
}

function effectiveParse(){
  const p = parsing.parsed || { title:'', subject:null, due:null, dueEnd:null, repeat:'none', repeatDay:'', time:'', tags:[] };
  return {
    title:   parsing.override.task    !== undefined ? parsing.override.task    : p.title,
    subject: parsing.override.subject !== undefined ? parsing.override.subject : p.subject,
    due:     parsing.override.due     !== undefined ? parsing.override.due     : p.due,
    dueEnd:  parsing.override.dueEnd  !== undefined ? parsing.override.dueEnd  : (p.dueEnd || null),
    repeat:  parsing.override.repeat  !== undefined ? parsing.override.repeat  : p.repeat,
    repeatDay: p.repeatDay,
    time:    parsing.override.time    !== undefined ? parsing.override.time    : (p.time || ''),
    tags:    parsing.override.tags    !== undefined ? parsing.override.tags    : (Array.isArray(p.tags) ? p.tags : [])
  };
}

function showParsePanel(){ parsePanel.classList.remove('hidden'); }
function hideParsePanel(){ parsePanel.classList.add('hidden'); }
function isParsePanelOpen(){ return !parsePanel.classList.contains('hidden'); }

function renderParsePanel(){
  const eff = effectiveParse();
  const hasManualChanges = Object.values(parsing.manual).some(Boolean);
  if (parseResetAll) parseResetAll.classList.toggle('hidden', !hasManualChanges);
  parsePanel.querySelectorAll('[data-parse-field]').forEach(row => {
    row.classList.toggle('manual-edited', !!parsing.manual[row.dataset.parseField]);
  });
  // Task name preview (don't clobber while user is editing it)
  if (!parsing.manual.task && document.activeElement !== parseTaskName) {
    parseTaskName.value = eff.title || (parsing.text.trim() || '');
  }
  // Subject (don't clobber while editing)
  if (!parsing.manual.subject && document.activeElement !== parseSubject) {
    if (eff.subject && eff.subject.isExisting) {
      parseSubject.value = eff.subject.name;
      parseSubjectSub.textContent = '';
    } else if (eff.subject && eff.subject.isNew) {
      parseSubject.value = eff.subject.name;
      parseSubjectSub.textContent = 'New subject will be created';
    } else {
      parseSubject.value = '';
      parseSubject.placeholder = 'Unsorted';
      parseSubjectSub.textContent = 'Task can be organized later';
    }
  }
  // Typo suggestion row
  const sugRow = document.getElementById('parseSuggestionRow');
  const sugName = document.getElementById('parseSuggestionName');
  if (sugRow && sugName) {
    if (parsing.suggestion && !parsing.acceptedSuggestion && !parsing.manual.subject) {
      sugName.textContent = parsing.suggestion.subject.name;
      sugRow.classList.remove('hidden');
    } else {
      sugRow.classList.add('hidden');
    }
  }
  // Due — preserve "Last Month" / "2 Weeks Ago" from the in-progress parse
  const relSrc = parsing.parsed && parsing.parsed.relativeSource
    ? { relativeUnit: parsing.parsed.relativeSource.unit, relativeAmount: parsing.parsed.relativeSource.amount }
    : null;
  // For repeating tasks, swap "Due" → "Starts" and show the start date
  const dueLabelEl = document.getElementById('parseDueLabel');
  const isRepeat = eff.repeat && eff.repeat !== 'none';
  const startISO = (parsing.parsed && parsing.parsed.startDate) || null;
  if (isRepeat) {
    if (dueLabelEl) dueLabelEl.textContent = 'Starts';
    if (startISO) parseDue.textContent = formatDue(startISO);
    else if (eff.due) parseDue.textContent = formatDue(eff.due, relSrc);
    else parseDue.textContent = 'Today';
  } else {
    if (dueLabelEl) dueLabelEl.textContent = 'Due';
    if (eff.due && eff.dueEnd && eff.dueEnd !== eff.due) {
      parseDue.textContent = formatDue(eff.due, relSrc) + ' – ' + formatDue(eff.dueEnd);
    } else if (eff.due) {
      parseDue.textContent = formatDue(eff.due, relSrc);
    } else {
      parseDue.textContent = 'None';
    }
  }
  // Tags row — highlight selected (effective) tags
  const tagsRow = document.getElementById('parseTagsRow');
  if (tagsRow) {
    const effTags = new Set(eff.tags && eff.tags.length ? eff.tags : ['School']);
    tagsRow.querySelectorAll('button[data-tag]').forEach(b => {
      b.classList.toggle('active', effTags.has(b.dataset.tag));
    });
  }
  // Time (editable)
  const timeEl = document.getElementById('parseTime');
  if (timeEl && !parsing.manual.time && document.activeElement !== timeEl) {
    timeEl.value = eff.time || '';
    timeEl.classList.toggle('muted', !eff.time);
  }
  // Quick due actives
  quickDueRow.querySelectorAll('button').forEach(b => {
    const k = b.dataset.due;
    let isActive = false;
    if (k === 'today' && eff.due === toISO(todayLocal())) isActive = true;
    else if (k === 'tomorrow') {
      const t = new Date(todayLocal()); t.setDate(t.getDate()+1);
      if (eff.due === toISO(t)) isActive = true;
    } else if (k === 'weekend') {
      const t = todayLocal(); let diff = 6 - t.getDay(); if (diff < 0) diff += 7;
      const d = new Date(t); d.setDate(d.getDate()+diff);
      if (eff.due === toISO(d)) isActive = true;
    } else if (k === 'none' && !eff.due) isActive = true;
    b.classList.toggle('active', isActive);
  });
  // Repeats
  repeatRow.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.rep === (eff.repeat || 'none'));
  });
}

function clearTypingBar(){
  parsing = freshParsingState();
  typingInput.value = '';
  hideParsePanel();
}

function resetParseChanges(){
  const text = typingInput.value;
  parsing = freshParsingState();
  typingInput.value = text;
  syncParsePanel();
  typingInput.focus();
}
if (parseResetAll) {
  parseResetAll.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    resetParseChanges();
  });
}

// Wire editable preview inputs
parseTaskName.addEventListener('input', () => {
  parsing.manual.task = true;
  parsing.overrideSource.task = 'manual';
  parsing.override.task = parseTaskName.value;
});
parseSubject.addEventListener('input', () => {
  parsing.manual.subject = true;
  parsing.overrideSource.subject = 'manual';
  // Manual subject edit clears any accepted/pending suggestion state
  parsing.acceptedSuggestion = null;
  parsing.suggestion = null;
  const v = parseSubject.value.trim();
  if (!v) {
    parsing.override.subject = null; // explicit Unsorted
  } else {
    // Match existing subject case-insensitively, else mark as new
    const list = getList();
    const existing = list ? list.subjects.find(s => (s.name||'').toLowerCase() === v.toLowerCase()) : null;
    parsing.override.subject = existing

});

function commitTypingBar(){
  const text = typingInput.value.trim();
  if (!text) { hideParsePanel(); return; }

  // ensure parsed reflects current text
  parsing.text = text;
  parsing.parsed = parseTaskInput(text);
  const eff = effectiveParse();
  const list = getList(); if (!list) return;

  // Resolve target subject
  let targetSub;
  if (eff.subject && eff.subject.isExisting) {
    targetSub = list.subjects.find(s => s.id === eff.subject.id);
  } else if (eff.subject && eff.subject.isNew && eff.subject.name) {
    targetSub = { id:uid(), name: eff.subject.name, open:true, tasks:[], due:emptyDue(), lastResetDate:'', showCompleted:false };
    list.subjects.push(targetSub);
  } else {
    targetSub = list.subjects.find(s => (s.name||'').toLowerCase() === 'unsorted');
    if (!targetSub) {
      targetSub = { id:uid(), name:'Unsorted', open:true, tasks:[], due:emptyDue(), lastResetDate:'', showCompleted:false };
      list.subjects.push(targetSub);
    }
  }

  // Build due
  let due = emptyDue();
  if (eff.repeat && eff.repeat !== 'none') {
    due = { type:'repeats', frequency: eff.repeat, day:'', date:'' };
    if (eff.repeat === 'weekly' || eff.repeat === 'fortnightly') {
      if (eff.repeatDay) due.day = capitalize(eff.repeatDay);
      else if (eff.due) {
        const d = fromISO(eff.due);
        if (d) due.day = DAY_NAMES[d.getDay()];
      } else {
        due.day = DAY_NAMES[todayLocal().getDay()];
      }
    }
    if (parsing.parsed && parsing.parsed.startDate) due.startDate = parsing.parsed.startDate;
  } else if (eff.due) {
    due = { type:'once', date: eff.due, frequency:'', day:'' };
    if (eff.dueEnd && eff.dueEnd !== eff.due) due.endDate = eff.dueEnd;
    // Carry through relative source so future displays preserve "Last Month" etc.
    if (parsing.parsed && parsing.parsed.relativeSource) {
      due.relativeUnit = parsing.parsed.relativeSource.unit;
      due.relativeAmount = parsing.parsed.relativeSource.amount;
    }
  }

  let taskTitle = cleanTitle((eff.title || text).trim());
  if (!taskTitle) taskTitle = 'Task';
  const newTaskId = uid();
  // Honor any manual tag edits made in the parse panel
  const effTags = (eff.tags && eff.tags.length) ? eff.tags : ((parsing.parsed && parsing.parsed.tags) || []);
  const tags = effTags.length ? effTags : ['School'];
  const important = !!(parsing.parsed && parsing.parsed.important);
  targetSub.tasks.push({
    id: newTaskId, title: taskTitle, notes: '', done:false, expanded:false,
    due, lastCompletedDate:'', completedAt: null,
    timeText: eff.time || '',
    tags, important
  });
  // Clean subject names too (only newly created)
  if (targetSub && targetSub.name) targetSub.name = cleanTitle(targetSub.name);
  console.log('task created via typing →', taskTitle, '/ subj:', targetSub.name, '/ due:', JSON.stringify(due), '/ time:', eff.time);
  save();
  // Build "Added to …" toast message
  // "Added to …" toast WITH undo (button is rendered next to the text)
  showToast(buildAddedMessage(due, targetSub, tags), () => {
    const loc = findTask(newTaskId);
    if (loc) { loc.parent.splice(loc.idx, 1); save(); render(); }
  });
  // Mark for appear animation; clear after one render
  recentlyCreatedId = newTaskId;
  setTimeout(() => { recentlyCreatedId = null; }, 400);
  // Clear and refocus for rapid entry
  clearTypingBar();
  render();
  // Refocus synchronously so the next typed character lands in the bar and
  // dispatches a real `input` event (which calls syncParsePanel and reopens).
  typingInput.focus();
}

function buildAddedMessage(due, sub, tags){
  // If the new task is filtered out of the current view, surface the tag instead
  if (currentFilters && currentFilters.size > 0 && Array.isArray(tags) && tags.length) {
    let matches = false;
    for (const f of currentFilters) if (tags.includes(f)) { matches = true; break; }
    if (!matches) return 'Added to ' + tags[0];
  }
  const today = todayLocal();
  if (due.type === 'once' && due.date) {
    const d = fromISO(due.date);
    const endISO = due.endDate;
    const diff = Math.round((startOfDay(d) - today) / DAY_MS);
    if (diff <= 0 || (endISO && fromISO(endISO) >= today)) return 'Added to Today';
    if (diff <= 2) return 'Added to Today';
    return 'Added to Upcoming · ' + (endISO && endISO !== due.date ? formatDue(due.date) + ' – ' + formatDue(endISO) : formatDue(due.date));
  }
  if (due.type === 'repeats') {
    return 'Added to ' + (sub ? sub.name : 'Unsorted');
  }
  return 'Added to ' + (sub ? sub.name : 'Unsorted');
}

// Single source of truth: parse panel visibility tracks the typing-bar value.
function syncParsePanel(){
  const v = typingInput.value;
  if (!v.trim()) {
    // Reset parse state fully so a new task starts clean
    parsing = {
      text:'', parsed:null,
      override:{ due: undefined, repeat: undefined, subject: undefined, task: undefined, time: undefined, tags: undefined },
      manual:{ task:false, subject:false, due:false, repeat:false, time:false, tags:false },
      suggestion: null,
      acceptedSuggestion: null,
      dismissedSubjectKeys: new Set(),
      overrideSource: { subject: null, task: null },
      lastSuggestionInputSnapshot: ''
    };
    hideParsePanel();
    return;
  }

  // If the user took a suggestion action (Use or Keep typed) and then changed
  // the typing-bar text meaningfully, drop the suggestion-source state so the
  // parser re-runs cleanly. Manual edits to parse-panel fields are preserved.
  if (parsing.lastSuggestionInputSnapshot) {
    const currentNorm = normalizeSubjectText(v);
    if (currentNorm !== parsing.lastSuggestionInputSnapshot) {
      parsing.acceptedSuggestion = null;
      if (parsing.overrideSource.subject === 'suggestion') {
        parsing.override.subject = undefined;
        parsing.manual.subject = false;
        parsing.overrideSource.subject = null;
      }
      if (parsing.overrideSource.task === 'suggestion') {
        parsing.override.task = undefined;
        parsing.manual.task = false;
        parsing.overrideSource.task = null;
      }
      // Allow previously dismissed suggestions to re-appear if the new input
      // genuinely reveals one (per test E).
      parsing.dismissedSubjectKeys = new Set();
      parsing.lastSuggestionInputSnapshot = '';
    }
  }

  parsing.text = v;
  parsing.parsed = parseTaskInput(v);

  // Compute typo suggestion when nothing is detected/overridden and no accepted suggestion is active.
  if (!parsing.acceptedSuggestion
      && !parsing.manual.subject
      && parsing.parsed.subject == null) {
    const list = getList();
    const subs = list ? list.subjects : [];
    const sug = findSubjectSuggestion(v, subs);
    if (sug) {
      const key = (sug.candidateText || '').toLowerCase() + '::' + sug.subject.name.toLowerCase();
      parsing.suggestion = parsing.dismissedSubjectKeys.has(key) ? null : sug;
    } else {
      parsing.suggestion = null;
    }
  } else {
    parsing.suggestion = null;
  }

  renderParsePanel();
  showParsePanel();
}

function applySubjectSuggestion(sug){
  if (!sug) return;
  // 1. Lock the existing subject as the chosen subject (manual override)
  parsing.override.subject = { id: sug.subject.id, name: sug.subject.name, isExisting: true };
  parsing.manual.subject = true;

  // 2. Rewrite the title using the corrected subject name and assessment rule
  let title = (parsing.parsed && parsing.parsed.title) || (parsing.text || '');
  // Replace the misspelled candidate phrase (case-insensitive) with the corrected name
  if (sug.candidateText) {
    const reCand = new RegExp('\\b' + escapeRegex(sug.candidateText) + '\\b', 'i');
    if (reCand.test(title)) title = title.replace(reCand, sug.subject.name);
  }
  // Strip the corrected subject phrase out, then drop subject markers / study markers
  const reSub = new RegExp('\\b' + escapeRegex(sug.subject.name) + '\\b', 'i');
  const removed = title.replace(reSub, ' ').replace(/\s+/g, ' ').trim();
  const cleanedRest = removed.replace(/\b(?:in|for|on|about|from|of|study|review|revise|practice|prepare)\b/gi, ' ').replace(/\s+/g, ' ').trim();
  const ASSESSMENT_WORDS = ['test','exam','quiz','assessment','essay','oral','speech','presentation','practical','project','competition','performance'];
  const restWords = cleanedRest.split(' ').filter(Boolean).slice(0, 2).map(w => w.toLowerCase());
  const hasAssessment = restWords.some(w => ASSESSMENT_WORDS.includes(w));
  const finalTitle = hasAssessment
    ? cleanTitle(sug.subject.name + ' ' + cleanedRest).trim()
    : (cleanTitle(cleanedRest) || sug.subject.name);
  parsing.override.task = finalTitle;
  parsing.manual.task = true;
  parsing.acceptedSuggestion = sug;
  parsing.suggestion = null;
  // Tag these overrides as suggestion-sourced and snapshot the input so a
  // later meaningful typing-bar edit can clear them automatically.
  parsing.overrideSource.subject = 'suggestion';
  parsing.overrideSource.task = 'suggestion';
  parsing.lastSuggestionInputSnapshot = normalizeSubjectText(typingInput.value);
  renderParsePanel();
}

// Apply the page-track transform. If `animate`, use the CSS transition;
// `pixelOffset` is an optional extra px applied during a live gesture.
let activeTrackAnim = false;
function applyTrackTransform(animate, pixelOffset){
  if (!pageTrack) return;
  // Don't interrupt a running animation or live gesture with a non-animated reset
  if (!animate && (activeTrackAnim || gestureActive)) return;
  const i = PAGES.indexOf(currentPage);
  const w = pageViewport.offsetWidth || pageTrack.offsetWidth || 0;
  const px = -i * w + (pixelOffset || 0);
  if (animate) {
    pageTrack.classList.add('animating');
    activeTrackAnim = true;
    setTimeout(() => {
      pageTrack.classList.remove('animating');
      activeTrackAnim = false;
    }, 360);
  } else {
    pageTrack.classList.remove('animating');
  }
  pageTrack.style.transform = `translateX(${px}px)`;
}

function setPage(p){
  if (!PAGES.includes(p)) return;
  if (p === currentPage) return;
  const oldI = PAGES.indexOf(currentPage);
  const newI = PAGES.indexOf(p);
  // Stretch the animation slightly when crossing 2 pages (Today ↔ Organize).
  const distance = Math.abs(newI - oldI);
  currentPage = p;
  data.settings.currentPage = p; save();
  // Update header pieces (sort toggle, select btn, nav active states) but
  // do NOT clear pageContent — the panels stay populated for visual passing.
  // We also don't slide individual panels: the track handles it.
  // Update header (and any per-page chrome) by calling render — this rebuilds
  // panel contents but keeps them in place; the track transform below moves
  // visually from old → new index.
  hideParsePanel();
  render();
  // Trigger animated track transform
  pageTrack.classList.add('animating');
  activeTrackAnim = true;
  // Optional duration boost for 2-page crossings
  pageTrack.style.transitionDuration = (260 + (distance - 1) * 100) + 'ms';
  // Need a frame so the browser applies the (possibly reset) transform
  // before we change it again — render() already did applyTrackTransform(false)
  // to the new currentPage. We want to start FROM the old page and animate
  // TO the new page. Easiest: temporarily set transform back to the old page
  // without animation, then animate to the new one.
  const w = pageViewport.offsetWidth || 0;
  pageTrack.classList.remove('animating');
  pageTrack.style.transform = `translateX(${-oldI * w}px)`;
  // Force reflow
  // eslint-disable-next-line no-unused-expressions
  pageTrack.offsetWidth;
  pageTrack.classList.add('animating');
  pageTrack.style.transform = `translateX(${-newI * w}px)`;
  setTimeout(() => {
    pageTrack.classList.remove('animating');
    pageTrack.style.transitionDuration = '';
    activeTrackAnim = false;
  }, 360 + (distance - 1) * 100);
}
// Prompt user for a new subject name. Case-insensitive duplicate detection.
function promptAddSubject(){
  openInputModal({

function attachSubjectDragHandlers(wrap, sub){
  wrap.addEventListener('dragstart', (e) => { e.stopPropagation(); startDrag(e, { kind:'subject', subjectId: sub.id }, wrap); });
  wrap.addEventListener('dragend', endDrag);
  wrap.addEventListener('dragover', (e) => {
    if (!dragInfo || dragInfo.kind !== 'subject' || dragInfo.subjectId === sub.id) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    showDropLine(r, e.clientY < r.top + r.height/2);
  });
  wrap.addEventListener('drop', (e) => {
    if (!dragInfo || dragInfo.kind !== 'subject') return;
    e.preventDefault();
    const list = getList();
    const fromIdx = list.subjects.findIndex(s => s.id === dragInfo.subjectId);
    let toIdx = list.subjects.findIndex(s => s.id === sub.id);
    if (fromIdx < 0 || toIdx < 0) return;
    const r = wrap.getBoundingClientRect();
    const above = e.clientY < r.top + r.height/2;
    const [moved] = list.subjects.splice(fromIdx, 1);
    if (fromIdx < toIdx) toIdx--;
    list.subjects.splice(above ? toIdx : toIdx+1, 0, moved);
    endDrag(); save(); render();
  });
}
function attachTaskDragHandlers(el, sub, task){
  // dragstart now lives on the grip handle; only register drop targets here
  el.addEventListener('dragover', (e) => {
    if (!dragInfo) return;
